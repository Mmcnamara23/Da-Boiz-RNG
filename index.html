<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA BOIZ RNG</title>
<style>
:root{
--bg:#080b14;
--panel:#111827;
--panel2:#172033;
--purple:#8b5cf6;
--gold:#fbbf24;
--text:#f8fafc;
--muted:#a1abc0;
--border:#29364d;
--green:#22c55e;
--radius:18px;
--shadow:0 16px 40px #0005;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:
radial-gradient(ellipse at 50% -15%,#283c68 0%,transparent 48%),
radial-gradient(ellipse at 100% 40%,#24134255,transparent 40%),
linear-gradient(180deg,#0b1020,#080b14 65%);
color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
min-height:100vh;
line-height:1.5;
}
button,input,select{font:inherit}
button{
cursor:pointer;
border:1px solid #a78bfa55;
border-radius:12px;
padding:12px 17px;
font-weight:850;
letter-spacing:.2px;
background:linear-gradient(135deg,#9b7bff,#6d3bd1);
color:white;
box-shadow:0 5px 16px #6d3bd133,inset 0 1px #ffffff25;
transition:transform .18s ease,filter .18s ease,box-shadow .18s ease,border-color .18s ease;
}
button:hover:not(:disabled){
filter:brightness(1.13);
transform:translateY(-2px);
box-shadow:0 9px 23px #7c3aed44,inset 0 1px #ffffff30;
}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{
outline:3px solid #c4b5fd;
outline-offset:3px;
}
button:disabled{
opacity:.38;
cursor:not-allowed;
filter:saturate(.5);
transform:none;
box-shadow:none;
}
input,select{
background:#0c1220;
color:white;
border:1px solid #34415b;
border-radius:11px;
padding:11px 13px;
}
input:focus,select:focus{border-color:#a78bfa;outline:none}
header{
padding:19px 4%;
background:#0a1020eF;
border-bottom:1px solid #34415b;
position:sticky;
top:0;
z-index:5;
backdrop-filter:blur(20px);
box-shadow:0 8px 30px #0003;
}
.headtop{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{
font-size:clamp(24px,4vw,39px);
font-weight:1000;
letter-spacing:1.5px;
background:linear-gradient(100deg,#fff 10%,#c4b5fd 48%,#fcd34d 90%);
background-clip:text;
-webkit-background-clip:text;
color:transparent;
filter:drop-shadow(0 4px 15px #8b5cf633);
}
.stats,nav{display:flex;gap:9px;flex-wrap:wrap}
.stat{
background:linear-gradient(145deg,#1c2940,#111a2c);
border:1px solid #3a4964;
padding:10px 14px;
border-radius:13px;
font-weight:850;
font-size:14px;
box-shadow:inset 0 1px #ffffff0c;
}
nav{
overflow-x:auto;
padding-top:17px;
scrollbar-width:thin;
}
nav button{
white-space:nowrap;
background:#151f32;
color:#b9c5da;
border:1px solid #35445e;
flex:1;
min-width:100px;
font-size:14px;
box-shadow:none;
}
nav button.active{
background:linear-gradient(135deg,#9067f5,#6334c3);
color:white;
border-color:#bba4ff;
box-shadow:0 5px 18px #7c3aed55,inset 0 1px #ffffff35;
}
.subnav{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-bottom:20px;
padding:9px;
background:#0e1727;
border:1px solid #2d3c55;
border-radius:15px;
box-shadow:inset 0 1px #ffffff08;
}
.subnav button{
flex:1;
min-width:120px;
background:#1a263b;
color:#b9c5da;
border:1px solid #35445e;
box-shadow:none;
}
.subnav button.active{
background:linear-gradient(135deg,#9067f5,#6334c3);
color:white;
border-color:#bba4ff;
}
main{max-width:1320px;margin:auto;padding:28px 4% 70px}
h2{margin:0 0 16px;font-size:clamp(22px,3vw,29px);letter-spacing:-.5px;line-height:1.2}
h3{margin:0 0 10px;font-size:18px;letter-spacing:-.2px}
p{color:var(--muted);line-height:1.65}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:17px;
}
.panel,.pack,.objective,.setting,.shopitem{
background:linear-gradient(145deg,#19253a,#101827);
border:1px solid #34445f;
border-radius:var(--radius);
padding:19px;
box-shadow:var(--shadow),inset 0 1px #ffffff09;
}
.panel,.objective,.setting,.shopitem{transition:border-color .2s,transform .2s,box-shadow .2s}
.panel:hover,.objective:hover,.shopitem:hover{
border-color:#687ba0;
box-shadow:0 18px 42px #0005,inset 0 1px #ffffff0c;
}
.sectionhero{
background:
radial-gradient(circle at 90% 0%,#9b7bff25,transparent 35%),
linear-gradient(120deg,#202d4b,#131d31 60%,#1d1835);
border:1px solid #485b7c;
border-radius:21px;
padding:24px;
margin-bottom:19px;
box-shadow:0 15px 38px #0003,inset 0 1px #ffffff12;
position:relative;
overflow:hidden;
}
.sectionhero:after{
content:"";
position:absolute;
right:-50px;
bottom:-95px;
width:210px;
height:210px;
border-radius:50%;
border:1px solid #ffffff0b;
box-shadow:0 0 0 22px #ffffff04,0 0 0 44px #ffffff03;
pointer-events:none;
}
.tokenhero{
background:
radial-gradient(circle at 90% 0%,#fbbf2430,transparent 35%),
linear-gradient(120deg,#443019,#211b2c 58%,#171b30);
border-color:#80633b;
}
.pack{
position:relative;
overflow:hidden;
min-height:285px;
display:flex;
flex-direction:column;
gap:12px;
isolation:isolate;
transition:transform .2s,border-color .2s,box-shadow .2s;
}
.pack:hover{transform:translateY(-4px);box-shadow:0 20px 45px #0006}
.pack:before{
content:"";
position:absolute;
width:210px;
height:210px;
border-radius:50%;
background:var(--glow,#8b5cf633);
filter:blur(35px);
right:-80px;
top:-85px;
z-index:-1;
}
.pack>*{position:relative}
.pack.low{--glow:#60a5fa66;border-color:#3b82f688}
.pack.mid{--glow:#a78bfa77;border-color:#8b5cf688}
.pack.high{--glow:#ec489977;border-color:#ec489988}
.pack.mega{--glow:#22d3ee77;border-color:#22d3ee99}
.packicon{font-size:48px;filter:drop-shadow(0 6px 12px #0006)}
.packname{font-size:19px;font-weight:1000;letter-spacing:.2px}
.price{font-size:24px;font-weight:1000;color:#fcd46b;text-shadow:0 2px 12px #fbbf2420}
.packdesc{font-size:13px;color:#c0cce0;min-height:35px}
.packfoot{margin-top:auto}
.packfoot button{width:100%;padding:14px}
.packstats{display:flex;gap:7px;flex-wrap:wrap}
.packstats span{
background:#ffffff0b;
border:1px solid #ffffff18;
padding:7px 9px;
border-radius:9px;
font-size:11px;
color:#d8e0ef;
}
.shopitem{
position:relative;
overflow:hidden;
display:flex;
flex-direction:column;
gap:11px;
min-height:275px;
}
.shopitem .packicon{font-size:42px}
.shopitem p{font-size:13px;min-height:50px;margin:0}
.shopitem button{margin-top:auto;width:100%}
.badge{
display:inline-block;
padding:7px 10px;
border-radius:9px;
background:#ffffff0d;
border:1px solid #ffffff20;
font-size:10px;
letter-spacing:1px;
font-weight:950;
color:#dce5f5;
}
.card{
border:2px solid #53627b;
border-radius:17px;
padding:15px;
background:linear-gradient(155deg,#25324a,#111827 72%);
text-align:center;
position:relative;
overflow:hidden;
min-width:0;
box-shadow:0 10px 24px #0003,inset 0 1px #ffffff12;
transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 15px 28px #0005,inset 0 1px #ffffff15}
.card:before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(130deg,#ffffff0b,transparent 40%);
pointer-events:none;
}
.card .emoji{font-size:40px;margin:9px 0 6px;filter:drop-shadow(0 5px 9px #0005)}
.card .name{font-size:14px;font-weight:950;overflow-wrap:anywhere;line-height:1.35;margin-top:4px}
.rating{font-size:30px;font-weight:1000;line-height:1.1;text-shadow:0 3px 15px #0006}
.rarity{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:950;margin:9px 0 3px}
.Common{border-color:#94a3b8}
.Common .rarity{color:#cbd5e1}
.Uncommon{border-color:#4ade80}
.Uncommon .rarity{color:#4ade80}
.Rare{border-color:#60a5fa;box-shadow:0 0 18px #60a5fa20,0 10px 24px #0003}
.Rare .rarity{color:#60a5fa}
.Epic{border-color:#c084fc;box-shadow:0 0 18px #a855f722,0 10px 24px #0003}
.Epic .rarity{color:#d8b4fe}
.Legendary{border-color:#fbbf24;box-shadow:0 0 22px #fbbf2428,0 10px 24px #0003}
.Legendary .rarity{color:#fcd34d}
.Icon{border-color:#fb7185;box-shadow:0 0 22px #fb71852b,0 10px 24px #0003}
.Icon .rarity{color:#fda4af}
.Mythical{border-color:#22d3ee;box-shadow:0 0 24px #22d3ee30,0 10px 24px #0003}
.Mythical .rarity{color:#67e8f9}
.card.selected{outline:3px solid var(--gold);transform:translateY(-3px)}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.card-actions button{flex:1;padding:9px 5px;font-size:12px}
.secondary{
background:linear-gradient(145deg,#27354c,#1a2639);
border:1px solid #53627b;
color:#e0e8f5;
box-shadow:none;
}
.secondary:hover:not(:disabled){background:#354560;box-shadow:0 7px 18px #0003}
.gold{
background:linear-gradient(135deg,#facc15,#d97706);
color:#201300;
border-color:#fcd34d;
}
.small{font-size:12px;color:var(--muted)}
.bar{
height:10px;
background:#26334a;
border:1px solid #3b4b66;
border-radius:20px;
overflow:hidden;
margin:11px 0;
}
.bar span{
height:100%;
display:block;
background:linear-gradient(90deg,#8b5cf6,#c084fc,#f0abfc);
border-radius:20px;
box-shadow:0 0 12px #a78bfa88;
}
.pitch{
position:relative;
overflow:hidden;
background:
linear-gradient(#ffffff08 1px,transparent 1px),
repeating-linear-gradient(90deg,#176b42 0 55px,#1c7549 55px 110px);
background-size:100% 50px,auto;
border:3px solid #64b78b;
border-radius:22px;
padding:24px 18px;
min-height:360px;
display:flex;
flex-direction:column;
justify-content:space-around;
gap:12px;
box-shadow:0 15px 35px #0004,inset 0 0 35px #001d0f55;
}
.pitch-markings{position:absolute;inset:10px;border:2px solid #d5f7e7aa;pointer-events:none;z-index:0;border-radius:5px}
.center-line{position:absolute;left:0;right:0;top:50%;border-top:2px solid #d5f7e7aa}
.center-circle{position:absolute;width:95px;height:95px;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #d5f7e7aa;border-radius:50%}
.center-spot{position:absolute;width:7px;height:7px;left:50%;top:50%;transform:translate(-50%,-50%);background:#e7fff2;border-radius:50%}
.penalty-box{position:absolute;left:22%;width:56%;height:17%;border:2px solid #d5f7e7aa}
.penalty-box.top{top:-2px;border-top:0}
.penalty-box.bottom{bottom:-2px;border-bottom:0}
.goal-box{position:absolute;left:37.5%;width:25%;height:7%;border:2px solid #d5f7e7aa}
.goal-box.top{top:-2px;border-top:0}
.goal-box.bottom{bottom:-2px;border-bottom:0}
.pitchrow{position:relative;z-index:1;display:flex;justify-content:space-evenly;gap:10px;flex-wrap:wrap}
.position{
background:linear-gradient(145deg,#123d31ee,#102c26ee);
border:1px solid #8bd6a8;
border-radius:14px;
padding:11px;
min-width:115px;
flex:1;
text-align:center;
box-shadow:0 7px 16px #0004,inset 0 1px #ffffff18;
}
.position button{margin-top:8px;padding:8px;font-size:12px;width:100%}
.position-role{display:block;font-size:12px;font-weight:1000;letter-spacing:2px;color:#b7ffd0;margin-bottom:5px}
.playerlist{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:10px;
max-height:55vh;
overflow:auto;
padding:5px;
}
.playeroption{
display:flex;
align-items:center;
gap:10px;
text-align:left;
background:linear-gradient(145deg,#202e45,#141e30);
border:1px solid #3b4b66;
border-radius:13px;
padding:11px;
color:white;
transition:.18s;
}
.playeroption:hover{border-color:#a78bfa;background:#27344d}
.playeroption .miniemoji{font-size:25px}
.playerinfo{flex:1;min-width:0}
.playerinfo b{display:block;overflow-wrap:anywhere;font-size:13px}
.playerinfo small{color:var(--muted)}
.ovr{font-size:20px;font-weight:1000;color:var(--gold)}
.playeroption.active{border-color:var(--gold);background:#493617}
.sbc-player{
width:100%;
text-align:left;
display:flex;
align-items:center;
gap:10px;
background:linear-gradient(145deg,#202e45,#141e30);
border:1px solid #3b4b66;
padding:12px;
border-radius:13px;
color:white;
box-shadow:none;
}
.sbc-player:hover:not(:disabled){border-color:#a78bfa;transform:translateY(-1px);box-shadow:0 6px 15px #0003}
.sbc-player.chosen{border-color:var(--gold);background:linear-gradient(145deg,#493617,#292313);box-shadow:0 0 15px #ffd16622}
.sbc-player .sbc-player-info{flex:1;min-width:0}
.sbc-player b{display:block;overflow-wrap:anywhere}
.sbc-player small{color:var(--muted)}
.sbc-player .sbc-rating{font-size:23px;font-weight:1000;color:var(--gold)}
.sbc-summary{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}
.sbc-stat{
flex:1;
min-width:120px;
background:#0c1422;
border:1px solid #34445f;
border-radius:14px;
padding:14px;
text-align:center;
}
.sbc-stat strong{display:block;font-size:27px;color:var(--gold)}
.sbc-complete{border-color:#22c55e;background:linear-gradient(145deg,#123525,#111827)}
.sbc-stage{max-width:900px;margin:auto}
.sbc-stage-button{
width:100%;
padding:18px;
text-align:left;
background:linear-gradient(135deg,#30204e,#171326);
border:1px solid #8b5cf6;
}
.sbc-stage-button strong{display:block;font-size:20px;margin-bottom:7px}
.sbc-stage-button span{display:block;font-size:13px;color:#e5dcf5}
.sbc-section{margin-top:20px}
.sbc-section h3{margin-bottom:8px}
.sbc-requirement{
background:#0c1422;
border:1px solid #34445f;
padding:15px;
border-radius:13px;
margin:10px 0;
}
.overlay{
position:fixed;
inset:0;
background:#030712ed;
backdrop-filter:blur(13px);
z-index:20;
display:none;
overflow:auto;
padding:20px;
align-items:center;
justify-content:center;
}
.overlay.show{display:flex}
.modal{
width:min(100%,1000px);
background:
radial-gradient(circle at 90% 0%,#8b5cf622,transparent 35%),
linear-gradient(145deg,#1b2940,#0d1524);
border:1px solid #52627e;
border-radius:23px;
padding:24px;
box-shadow:0 25px 90px #000b,0 0 60px #8b5cf622;
max-height:94vh;
overflow:auto;
}
.modalhead{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:18px;
}
.revealgrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
gap:13px;
}
.revealcard{min-width:0}
.revealcard.hidden-reveal{opacity:0;transform:scale(.65);pointer-events:none;visibility:hidden}
.revealcard.card-revealed{visibility:visible;animation:flipin .4s ease both}
.card-status{
font-size:12px;
font-weight:1000;
letter-spacing:1px;
text-align:center;
margin-bottom:8px;
padding:8px;
border-radius:9px;
}
.card-status.new{background:#14532d;color:#86efac;border:1px solid #22c55e}
.card-status.dupe{background:#713f12;color:#fde68a;border:1px solid #f59e0b}
.storage-button{
width:100%;
margin-top:9px;
background:linear-gradient(135deg,#0f766e,#115e59);
font-size:11px;
padding:10px 5px;
}
.storage-sell-button{
width:100%;
margin-top:10px;
background:linear-gradient(135deg,#facc15,#d97706);
color:#201300;
font-size:12px;
padding:11px;
}
#revealStorageStatus{font-size:12px;color:#fcd34d;font-weight:900;margin-top:7px}
#walkoutBanner{text-align:center;min-height:65px}
.walkouttitle{
font-size:clamp(28px,6vw,58px);
font-weight:1000;
letter-spacing:2px;
text-align:center;
margin:18px 0;
color:white;
text-shadow:0 5px 25px #8b5cf655;
}
.walkout-subtitle{
text-align:center;
font-weight:1000;
letter-spacing:2px;
margin-bottom:20px;
color:#eee;
animation:rarityAppear .45s ease both;
}
.walkout-mode{background:radial-gradient(ellipse at center,#21143a 0%,#05030df5 78%)}
.pack-rest-title{
text-align:center;
font-weight:1000;
font-size:24px;
margin:20px 0;
animation:titleSlam .4s both;
}
.pickhint{text-align:center;color:var(--gold);font-weight:900;margin:12px 0;min-height:18px}
.walkout-flip{perspective:1000px;width:100%;max-width:250px;height:330px;margin:15px auto}
.flip-inner{position:relative;width:100%;height:330px;transform-style:preserve-3d}
.flip-inner.flip-now{animation:cardFlip .9s ease-in-out forwards}
.flip-back,.flip-front{
position:absolute;
inset:0;
width:100%;
height:330px;
min-height:330px;
box-sizing:border-box;
border-radius:18px;
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
}
.flip-back{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
background:linear-gradient(145deg,#30204e,#100d1b);
border:3px solid #8b5cf6;
box-shadow:0 0 35px #8b5cf655;
font-size:65px;
}
.flip-back span{font-size:16px;font-weight:1000;letter-spacing:3px}
.flip-front{transform:rotateY(180deg)}
.flip-front .card{
width:100%;
height:100%;
min-height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}
.walkout-flip.Rare .flip-back{border-color:#60a5fa}
.walkout-flip.Epic .flip-back{border-color:#c084fc}
.walkout-flip.Legendary .flip-back{border-color:#fbbf24}
.walkout-flip.Icon .flip-back{border-color:#fb7185}
.walkout-flip.Mythical .flip-back{border-color:#22d3ee}
@keyframes cardFlip{0%{transform:rotateY(0deg)}100%{transform:rotateY(180deg)}}
@keyframes rarityAppear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes flipin{from{opacity:0;transform:rotateY(35deg)}to{opacity:1;transform:rotateY(0)}}
@keyframes titleSlam{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
.toast{
position:fixed;
bottom:22px;
left:50%;
transform:translateX(-50%);
background:linear-gradient(145deg,#26334d,#111b2d);
border:1px solid #9270e9;
padding:14px 20px;
border-radius:14px;
z-index:50;
display:none;
box-shadow:0 12px 40px #0009;
max-width:90vw;
text-align:center;
font-weight:750;
}
.toast.show{display:block;animation:flipin .2s}
.setting{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}
.setting input{width:20px;height:20px;accent-color:#8b5cf6}
footer{
text-align:center;
color:#77849c;
padding:28px;
border-top:1px solid #29364d;
background:#090f1b;
font-size:13px;
letter-spacing:.5px;
}
.match-hud{
display:none;
margin-top:15px;
background:linear-gradient(100deg,#173e2d,#21143a);
border:1px solid #65d99a;
border-radius:14px;
padding:13px 16px;
align-items:center;
justify-content:space-between;
gap:12px;
flex-wrap:wrap;
box-shadow:0 8px 25px #0003;
}
.match-hud.visible{display:flex}
.match-hud strong{font-size:17px}
.match-clock{font-size:24px;font-weight:1000;color:var(--gold)}
.match-panel{
margin:18px 0;
background:linear-gradient(145deg,#162e26,#171326);
border:1px solid #4b936e;
border-radius:18px;
padding:20px;
box-shadow:var(--shadow);
}
.match-panel h3{font-size:20px}
.match-score{font-size:clamp(25px,5vw,38px);font-weight:1000;text-align:center;margin:14px}
.match-events{max-height:190px;overflow:auto;margin-top:12px}
.match-event{
padding:10px 12px;
margin:7px 0;
background:#ffffff0b;
border:1px solid #ffffff16;
border-radius:10px;
font-size:13px;
}
.match-win{color:#4ade80;font-weight:900}
.match-loss{color:#fb7185;font-weight:900}
.match-draw{color:var(--gold);font-weight:900}
.match-play{
width:100%;
padding:16px;
font-size:16px;
margin-top:12px;
background:linear-gradient(135deg,#16a34a,#047857);
border-color:#4ade80;
}
body.goal-shake{animation:screenShake .45s ease}
@keyframes screenShake{
0%,100%{transform:translateX(0)}
15%{transform:translateX(-9px) rotate(-.5deg)}
30%{transform:translateX(9px) rotate(.5deg)}
45%{transform:translateX(-7px)}
60%{transform:translateX(7px)}
75%{transform:translateX(-3px)}
}
.goal-flash{
position:fixed;
inset:0;
z-index:60;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
background:#ffd16622;
animation:goalFlash .9s ease forwards;
}
.goal-flash-text{
font-size:clamp(55px,14vw,125px);
font-weight:1000;
font-style:italic;
letter-spacing:4px;
color:#ffd166;
text-shadow:0 0 15px #ff8c00,0 0 40px #ff8c00,5px 7px 0 #5b2600;
animation:goalSlam .9s ease forwards;
text-align:center;
}
@keyframes goalFlash{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes goalSlam{0%{transform:scale(.2) rotate(-12deg);opacity:0}25%{transform:scale(1.2) rotate(4deg);opacity:1}45%{transform:scale(1) rotate(0)}100%{transform:scale(1.1);opacity:0}}
@media(max-width:700px){
header{padding:14px 4%}
.headtop{align-items:flex-start}
.stats{width:100%}
.stat{padding:9px 10px;font-size:12px;flex:1;text-align:center}
main{padding-top:19px}
.grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.panel,.pack,.objective,.setting,.shopitem{padding:15px}
.sectionhero{padding:19px}
.pack{min-height:270px}
.modal{padding:15px}
.position{min-width:100px}
.walkout-flip{max-width:230px}
nav button{min-width:0;padding:11px 8px;font-size:12px}
.subnav button{min-width:0;padding:10px 7px;font-size:12px}
}
@media(max-width:390px){
.logo{font-size:23px}
.stats{gap:6px}
.stat{font-size:11px;padding:8px 5px}
.grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.packname{font-size:16px}
.card{padding:11px}
.card .emoji{font-size:34px}
.rating{font-size:26px}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
scroll-behavior:auto!important;
animation-duration:.01ms!important;
animation-iteration-count:1!important;
transition-duration:.01ms!important;
}
.flip-inner,.walkouttitle,.revealcard,.walkout-subtitle{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

 <div class="headtop">
  <div class="logo">⚡ DA BOIZ RNG</div>

</div>

 </div>

<script>
const SAVE_KEY="daBoizRNG_full_v6";
const positionNames=["GK","CB","CB","CM","ST"];

const baseCards=[
["brody","Brody Doel","🐺","Uncommon",76,300],
["dexter","Dexter Chadwick","🧢","Rare",78,600],
["matthew","Matthew Bardsley","😎","Common",72,100],
["numaii","Numaii Leslie-Madden","🦊","Common",67,100],
["freddie","Freddie Fifield","⚽","Uncommon",74,300],
["max_rolfe","Max Rolfe","🔥","Common",68,100],
["ashton","Ashton Elliott","🦁","Rare",77,600],
["oscar","Oscar Robert Harper","👑","Epic",83,1200],
["jayden","Jayden Jobarteh","💎","Uncommon",75,300],
["henry","Henry James Worsell","⚡","Epic",82,1200],
["vittorio","Vittorio Petruzzelli","🦈","Legendary",88,3000],
["zain","Zain Miah","🚀","Epic",84,1200],
["lil_mumps","Lil Mumps","🎤","Legendary",88,3000],
["liam","Liam Sutherland","🌠","Icon",93,10000],

].map(x=>({id:x[0],name:x[1],emoji:x[2],rarity:x[3],rating:x[4],price:x[5]}));

const cards=baseCards.map(c=>({...c}));
const noseBreatherCard={id:"nose_breather_lil_mumps",name:"Nose Breather Lil Mumps",emoji:"👃",rarity:"Icon",rating:94,price:10000};

const mythical=[
["myth_dexter","Mythical Dexter Chadwick","83"],
["myth_matthew","Mythical Matthew Bardsley","80"],
["myth_numaii","Mythical Numaii Leslie-Madden","79"],
["myth_freddie","Mythical Freddie Fifield","81"],
["myth_max_rolfe","Mythical Max Rolfe","77"],
["myth_ashton","Mythical Ashton Elliott","81"],
["myth_oscar","Mythical Oscar Robert Harper","87"],
["myth_jayden","Mythical Jayden Jobarteh","82"],
["myth_henry","Mythical Henry James Worsell","86"],
["myth_vittorio","Mythical Vittorio Petruzzelli","93"],
["myth_zain","Mythical Zain Miah","88"],
["myth_liam","Mythical Liam Sutherland","97"],
["myth_max_worboys","Mythical Max Worboys","98"],
["myth_jacky_chan","Mythical Jacky Chan","99"],
["myth_riley_may","Mythical Riley May","97"],
["myth_brody","Mythical Brody Doel","82"]
].map(x=>({id:x[0],name:x[1],emoji:"🌌",rarity:"Mythical",rating:Number(x[2]),price:5000}));

const allCards=[...cards,noseBreatherCard,...mythical];

/* Nose Breather remains in the album and can be awarded by its SBC,
   but is excluded from all random token and SBC rewards. */
const randomRewardCards=allCards.filter(c=>c.id!=="nose_breather_lil_mumps");

/* Lower Icon and Mythical weights for token and SBC rewards. */
const tokenRewardWeights={
Common:1,
Uncommon:1,
Rare:1,
Epic:1,
Legendary:0.5,
Icon:0.04,
Mythical:0.002
};

const sbcRewardWeights={
Common:1,
Uncommon:1,
Rare:1,
Epic:1,
Legendary:0.7,
Icon:0.08,
Mythical:0.002
};

const rarityPrice={Common:100,Uncommon:300,Rare:600,Epic:1200,Legendary:3000,Icon:10000,Mythical:5000};
const rarityRank={Common:0,Uncommon:1,Rare:2,Epic:3,Legendary:4,Icon:5,Mythical:6};

const packDefs=[
{id:"low",name:"LOW T PACK",icon:"📦",price:0,pulls:5,odds:{Common:80,Uncommon:13,Rare:5.5,Epic:1.4,Legendary:.1},tokenChance:.10,tokenAmount:2,description:"Free pack • 5 players",className:"low"},
{id:"mid",name:"MID T PACK",icon:"🎁",price:3500,pulls:5,odds:{Common:64,Uncommon:22,Rare:9,Epic:4.2,Legendary:.7,Icon:.1},tokenChance:.07,tokenAmount:3,description:"5 players • Better odds",className:"mid"},
{id:"high",name:"HIGH T PACK",icon:"💜",price:7500,pulls:5,odds:{Common:40,Uncommon:30,Rare:18,Epic:10,Legendary:1.8,Icon:.2},tokenChance:.08,tokenAmount:4,description:"5 players • Top-tier odds",className:"high"},
{id:"mega",name:"DA BOIZ MYTHICAL PACK",icon:"🌌",price:35000,pulls:1,odds:{Mythical:100},description:"Guaranteed Mythical player",className:"mega"}
];

const objectives=[
{rating:83,coins:5000,tokens:5},
{rating:88,coins:55000,tokens:10},
{rating:90,coins:65000,tokens:15},
{rating:93,coins:75000,tokens:20},
{rating:96,coins:80000,tokens:35}
];

const opponentTeams=[
{name:"GOATS XI",emoji:"🐐",scorers:["Cristiano Ronaldo","Lionel Messi","Kylian Mbappé","Phil Jones"]},
{name:"ICONS XI",emoji:"🌟",scorers:["Carles Puyol","Andriy Shevchenko","Zinedine Zidane","Diego Maradona"]},
{name:"BRONZE XI",emoji:"🥉",scorers:["Yaya Sithole","Diogo Dalot","Darwin Núñez"]}
];

let game;
try{game=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){}
if(!game||typeof game!=="object")game={};

game.coins=Number(game.coins??0);
game.tokens=Number(game.tokens??0);
game.owned=game.owned||{};
game.team=Array.isArray(game.team)?game.team:[null,null,null,null,null];
while(game.team.length<5)game.team.push(null);
game.team=game.team.slice(0,5);
game.formation=["2-2-1","1-3-1"].includes(game.formation)?game.formation:"2-2-1";
game.claimed=game.claimed||{};
objectives.forEach(o=>{if(typeof game.claimed[o.rating]!=="boolean")game.claimed[o.rating]=false});
game.potion=game.potion||null;
game.settings=game.settings||{};
game.settings.walkouts=game.settings.walkouts||{};
game.match=game.match&&typeof game.match==="object"?game.match:null;
game.lastMatch=game.lastMatch||null;
game.sbcStorage=Array.isArray(game.sbcStorage)?game.sbcStorage:[];
game.sbcCapacity=[5,10,15].includes(Number(game.sbcCapacity))?Number(game.sbcCapacity):5;
game.sbcCompleted=game.sbcCompleted===true;
game.noseBreathingCompleted=game.noseBreathingCompleted===true;
game.champSbcCompleted=game.champSbcCompleted===true;

["Rare","Epic","Legendary","Icon","Mythical"].forEach(r=>{
if(typeof game.settings.walkouts[r]!=="boolean")game.settings.walkouts[r]=true;
});

let activeTab="shops";
let activeShopTab="packs";
let activeTeamTab="team";
let activeSbcTab="challenges";
let isOpening=false;
let pickState=null;
let toastTimer,animationTimer,openingRun=0;
let matchInterval=null;
let celebratedGoals=new Set();
let pendingDuplicateSales=[];
let sbcSelected=[];
let sbcScreen="list";
let activeSbcId="intro";

const sbcDefinitions={
intro:{id:"intro",name:"Introduction to SBCs",icon:"🧩",description:"Learn the basics and earn five guaranteed players rated 78 or higher.",requirement:82,reward:"78+ ×5 PLAYER PACK",rewardDescription:"Five guaranteed players, each rated 78 or higher.",repeatable:false},
nose:{id:"nose",name:"Nose Breathing ++",icon:"👃",description:"A tough challenge with a legendary custom reward.",requirement:87,reward:"94-RATED NOSE BREATHER LIL MUMPS",rewardDescription:"Unlock Nose Breather Lil Mumps, rated 94.",repeatable:false},
infinite:{id:"infinite",name:"Infinite SBC",icon:"♾️",description:"Keep submitting squads to earn more high-rated players.",requirement:85,reward:"85+ ×2 PLAYER PACK",rewardDescription:"Two guaranteed players rated 85 or higher. Repeat this SBC whenever you want.",repeatable:true},
champ:{id:"champ",name:"Da Boiz RNG Champ",icon:"🏆",description:"The ultimate challenge. Choose your champion from four elite players.",requirement:91,reward:"1-OF-4 PLAYER PICK • 90+",rewardDescription:"Reveal four players rated 90 or higher and choose one.",repeatable:false}
};

function sbcCompleted(id){
if(id==="intro")return game.sbcCompleted;
if(id==="nose")return game.noseBreathingCompleted;
if(id==="champ")return game.champSbcCompleted;
return false;
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(game))}catch(e){}}
function ownedCount(){return Object.values(game.owned).reduce((a,b)=>a+b,0)}
function getCard(id){return allCards.find(c=>c.id===id)}
function getOwned(){return Object.keys(game.owned).filter(id=>game.owned[id]>0).map(getCard).filter(Boolean)}
function teamCards(){return game.team.map(id=>id?getCard(id):null)}
function teamRating(){let t=teamCards();return t.length===5&&t.every(Boolean)?Math.round(t.reduce((s,c)=>s+c.rating,0)/5):0}
function money(n){return Math.round(n).toLocaleString("en-GB")}
function persistRender(){save();render()}
function opponentName(){return game.match?.opponent?.name||"GOATS XI"}
function opponentEmoji(){return game.match?.opponent?.emoji||"🐐"}

function updateRevealStorageStatus(){
const status=document.getElementById("revealStorageStatus");
if(status)status.textContent=`📦 SBC STORAGE: ${game.sbcStorage.length} / ${game.sbcCapacity}`;
}

function toast(msg){
let t=document.getElementById("toast");
t.textContent=msg;
t.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

function cardHTML(c,actions=""){
return `<div class="card ${c.rarity}">
<div class="emoji">${c.emoji}</div>
<div class="rating">${c.rating}</div>
<div class="name">${c.name}</div>
<div class="rarity">${c.rarity}</div>${actions}</div>`;
}

function setTab(tab){
if(isOpening)return;
activeTab=tab;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
render();
}
function setShopTab(tab){if(isOpening)return;activeShopTab=tab;render()}
function setTeamTab(tab){if(isOpening)return;activeTeamTab=tab;render()}
function setSbcTab(tab){
if(isOpening)return;
activeSbcTab=tab;
sbcSelected=[];
if(tab==="challenges")sbcScreen="list";
render();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function render(){
document.getElementById("coins").textContent=money(game.coins);
document.getElementById("tokens").textContent=money(game.tokens);
document.getElementById("teamRating").textContent=teamRating()||"—";
let content="";
if(activeTab==="shops"){
const shopViews={packs:renderPacks,luck:renderLuck,tokenshop:renderTokenShop};
content=`<div class="subnav">
<button data-shop-tab="packs" class="${activeShopTab==="packs"?"active":""}">🎁 Pack Shop</button>
<button data-shop-tab="luck" class="${activeShopTab==="luck"?"active":""}">🍀 Luck Shop</button>
<button data-shop-tab="tokenshop" class="${activeShopTab==="tokenshop"?"active":""}">🪙 Token Shop</button>
</div>${shopViews[activeShopTab]()}`;
}else if(activeTab==="teamhub"){
const teamViews={team:renderTeam,objectives:renderObjectives,album:renderAlbum};
content=`<div class="subnav">
<button data-team-tab="team" class="${activeTeamTab==="team"?"active":""}">⚽ Squad</button>
<button data-team-tab="objectives" class="${activeTeamTab==="objectives"?"active":""}">🏆 Team Objectives</button>
<button data-team-tab="album" class="${activeTeamTab==="album"?"active":""}">📚 Album</button>
</div>${teamViews[activeTeamTab]()}`;
}else if(activeTab==="sbcs"){
content=`<div class="subnav">
<button data-sbc-tab="challenges" class="${activeSbcTab==="challenges"?"active":""}">🏆 Squad Building Challenges</button>
<button data-sbc-tab="storage" class="${activeSbcTab==="storage"?"active":""}">📦 SBC Storage</button>
</div>${activeSbcTab==="challenges"?renderSbcChallenges():renderSbcStorage()}`;
}else content=renderSettings();
document.getElementById("app").innerHTML=content;
bindButtons();
updateMatchHUD();
}

function renderPacks(){
return `<section>
<div class="sectionhero"><h2>🎁 THE PACK STORE</h2><p>Open packs, discover rare players and build your ultimate squad. You can still open packs during a match!</p><span class="badge">🪙 ${money(game.coins)} COINS AVAILABLE</span></div>
<div class="grid">${packDefs.map(p=>`
<div class="pack ${p.className}">
<div class="packicon">${p.icon}</div><div class="packname">${p.name}</div>
<div class="price">${p.price===0?"FREE":"🪙 "+money(p.price)}</div>
<div class="packdesc">${p.description}</div>
<div class="packstats"><span>🃏 ${p.pulls} player${p.pulls===1?"":"s"}</span><span>${p.id==="mega"?"🌌 Guaranteed Mythical":"✨ Pack odds"}</span></div>
<div class="packfoot"><button data-openpack="${p.id}" ${game.coins<p.price?"disabled":""}>${game.coins<p.price?"NOT ENOUGH COINS":"OPEN PACK →"}</button></div>
</div>`).join("")}</div>
</section>`;
}

/* Each entry represents one physical player copy. */
function getSbcCandidates(){
const candidates=[];
const teamCounts={};
const storageCounts={};

game.team.forEach((id,index)=>{
const c=id?getCard(id):null;
if(c){
teamCounts[id]=(teamCounts[id]||0)+1;
candidates.push({key:"team:"+index,id,card:c,source:"TEAM",location:"Starting Squad • "+positionNames[index]});
}
});

game.sbcStorage.forEach((id,index)=>{
const c=getCard(id);
if(c){
storageCounts[id]=(storageCounts[id]||0)+1;
candidates.push({key:"storage:"+index,id,card:c,source:"STORAGE",location:"SBC Storage"});
}
});

Object.entries(game.owned).forEach(([id,total])=>{
const c=getCard(id);
if(!c)return;
const remaining=Math.max(0,Number(total||0)-(teamCounts[id]||0)-(storageCounts[id]||0));
for(let i=0;i<remaining;i++){
candidates.push({key:"club:"+id+":"+i,id,card:c,source:"CLUB",location:"Club • Reserve"});
}
});
return candidates;
}

function getSbcSelectedCandidates(){
const all=getSbcCandidates();
return sbcSelected.map(key=>all.find(item=>item.key===key)).filter(Boolean);
}

function openSbc(id){
if(sbcCompleted(id)){toast("You have already completed this SBC!");return}
activeSbcId=id;
sbcScreen="details";
sbcSelected=[];
render();
}
function startSbcSelection(){
sbcScreen="selection";
sbcSelected=[];
render();
}
function backSbc(){
sbcScreen=sbcScreen==="selection"?"details":"list";
sbcSelected=[];
render();
}

function renderSbcChallenges(){
if(sbcScreen==="list"){
return `<section class="sbc-stage">
<div class="sectionhero"><h2>🏆 SQUAD BUILDING CHALLENGES</h2><p>Complete challenges by submitting exactly five player copies from anywhere in your Club. Starting Squad, reserves and SBC Storage all count.</p></div>
<div class="grid">${Object.values(sbcDefinitions).map(s=>{
const done=sbcCompleted(s.id);
return `<div class="panel ${done?"sbc-complete":""}">
<div style="font-size:34px">${s.icon}</div>
<h2 style="margin-top:8px">${s.name}</h2>
<p>${s.description}</p>
<div class="badge">⭐ ${s.requirement}+ AVERAGE</div>
<p><b>🎁 ${s.reward}</b></p>
${s.repeatable?'<span class="badge">♾️ REPEATABLE</span>':done?'<span class="badge">✅ COMPLETED</span>':'<span class="badge">ONE-TIME CHALLENGE</span>'}
<button style="width:100%;margin-top:14px" data-open-sbc="${s.id}" ${done?"disabled":""}>${done?"COMPLETED":"VIEW CHALLENGE →"}</button>
</div>`;
}).join("")}</div>
</section>`;
}

const challenge=sbcDefinitions[activeSbcId]||sbcDefinitions.intro;
if(sbcCompleted(activeSbcId)){
return `<section class="sbc-stage"><div class="sectionhero sbc-complete"><h2>${challenge.icon} ${challenge.name}</h2><p>This challenge has already been completed!</p></div><button class="secondary" data-sbc-list>← BACK TO SBCs</button></section>`;
}

if(sbcScreen==="details"){
return `<section class="sbc-stage">
<div class="sectionhero"><h2>${challenge.icon} ${challenge.name}</h2><p>${challenge.description}</p></div>
<div class="panel">
<h2>Challenge requirements</h2>
<div class="sbc-requirement">
<p><b>👥 Players required:</b> Exactly 5 player copies</p>
<p><b>⭐ Minimum average rating:</b> ${challenge.requirement}+ (rounded average)</p>
<p><b>📦 Eligible players:</b> Your entire Club, including your Starting Squad, reserves and SBC Storage.</p>
</div>
<h3>🎁 Challenge reward</h3>
<div class="sectionhero" style="margin:12px 0">
<div style="font-size:30px">${challenge.id==="nose"?"👃":challenge.id==="infinite"?"♾️":challenge.id==="champ"?"🏆":"🎁"}</div>
<h2 style="margin:8px 0">${challenge.reward}</h2>
<p>${challenge.rewardDescription}</p>
</div>
<p class="small">Important: the five player copies you submit will be permanently removed from your Club.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
<button class="secondary" data-sbc-list>← BACK</button>
<button data-start-sbc style="flex:1">CHOOSE PLAYERS →</button>
</div>
</div>
</section>`;
}

const candidates=getSbcCandidates();
const selected=getSbcSelectedCandidates();
const roundedAverage=selected.length?Math.round(selected.reduce((sum,item)=>sum+item.card.rating,0)/selected.length):0;
const valid=selected.length===5&&roundedAverage>=challenge.requirement;
const clubCandidates=candidates.filter(item=>item.source==="TEAM"||item.source==="CLUB");
const storageCandidates=candidates.filter(item=>item.source==="STORAGE");

function playerButtons(items){
if(!items.length)return `<p class="small">No players available in this section.</p>`;
return items.map(item=>{
const chosen=sbcSelected.includes(item.key);
return `<button class="sbc-player ${chosen?"chosen":""}" data-sbc-select="${item.key}">
<span style="font-size:27px">${item.card.emoji}</span>
<span class="sbc-player-info"><b>${item.card.name}</b><small>${item.source==="TEAM"?"STARTING SQUAD":item.source==="CLUB"?"CLUB RESERVE":"SBC STORAGE"} • ${item.location} • ${item.card.rarity}</small></span>
<span class="sbc-rating">${item.card.rating}</span><span>${chosen?"✓":"＋"}</span>
</button>`;
}).join("");
}

return `<section class="sbc-stage">
<div class="sectionhero">
<h2>${challenge.icon} ${challenge.name}</h2>
<p>Select five player copies from anywhere in your Club.</p>
<span class="badge">🎁 REWARD: ${challenge.reward}</span>
</div>

function toggleSbcPlayer(key){
if(sbcCompleted(activeSbcId))return;
if(game.match?.status==="running"){toast("You cannot submit an SBC during a match!");return;}
const candidate=getSbcCandidates().find(item=>item.key===key);
if(!candidate){toast("That player copy is no longer available.");sbcSelected=[];render();return;}
if(sbcSelected.includes(key)){
sbcSelected=sbcSelected.filter(item=>item!==key);
}else{
if(sbcSelected.length>=5){toast("You can only select five players!");return}
sbcSelected.push(key);
}
render();
}

function consumeSbcPlayers(chosen){
const teamSlots=chosen.filter(item=>item.source==="TEAM").map(item=>({index:Number(item.key.split(":")[1]),id:item.id}));
const storageSlots=chosen.filter(item=>item.source==="STORAGE").map(item=>({index:Number(item.key.split(":")[1]),id:item.id}));
const clubCopies=chosen.filter(item=>item.source==="CLUB");

teamSlots.forEach(item=>{
if(game.team[item.index]===item.id)game.team[item.index]=null;
if(game.owned[item.id]){
game.owned[item.id]--;
if(game.owned[item.id]<=0)delete game.owned[item.id];
}
});
storageSlots.sort((a,b)=>b.index-a.index).forEach(item=>{
if(game.sbcStorage[item.index]===item.id)game.sbcStorage.splice(item.index,1);
if(game.owned[item.id]){
game.owned[item.id]--;
if(game.owned[item.id]<=0)delete game.owned[item.id];
}
});
clubCopies.forEach(item=>{
if(game.owned[item.id]){
game.owned[item.id]--;
if(game.owned[item.id]<=0)delete game.owned[item.id];
}
});
}

/* SBC rewards now use weighted random cards, excluding Nose Breather.
   Nose Breather is still awarded directly by the Nose Breathing ++ SBC. */
function submitSbc(){
const id=activeSbcId;
const challenge=sbcDefinitions[id];
if(!challenge||sbcCompleted(id)){toast("You have already completed this SBC!");return}
if(game.match?.status==="running"){toast("You cannot submit an SBC during a match!");return}
const chosen=getSbcSelectedCandidates();
if(chosen.length!==5){toast("You must select exactly five players!");return}
const average=Math.round(chosen.reduce((sum,item)=>sum+item.card.rating,0)/5);
if(average<challenge.requirement){toast("Your five players need an average rating of at least "+challenge.requirement+"!");return}

consumeSbcPlayers(chosen);
sbcSelected=[];
pendingDuplicateSales=[];

if(id==="intro")game.sbcCompleted=true;
if(id==="nose")game.noseBreathingCompleted=true;
if(id==="champ")game.champSbcCompleted=true;

isOpening=true;
save();

if(id==="intro"){
const pool=randomRewardCards.filter(card=>card.rating>=78);
const results=Array.from({length:5},()=>weightedCard(pool,sbcRewardWeights));
const duplicateFlags=results.map(card=>award(card));
showReveal({title:"78+ ×5 SBC REWARD",subtitle:"Five guaranteed players rated 78 or higher!",results,duplicateFlags,walkouts:true});
return;
}

if(id==="nose"){
const duplicate=award(noseBreatherCard);
showReveal({title:"NOSE BREATHING ++ REWARD",subtitle:"94-rated Nose Breather Lil Mumps!",results:[noseBreatherCard],duplicateFlags:[duplicate],walkouts:true});
return;
}

if(id==="infinite"){
const pool=randomRewardCards.filter(card=>card.rating>=85);
const results=Array.from({length:2},()=>weightedCard(pool,sbcRewardWeights));
const duplicateFlags=results.map(card=>award(card));
showReveal({title:"INFINITE SBC REWARD",subtitle:"Two guaranteed players rated 85 or higher!",results,duplicateFlags,walkouts:true});
return;
}

if(id==="champ"){
const pool=randomRewardCards.filter(card=>card.rating>=90);
const candidates=[];
const excluded=new Set();
for(let i=0;i<4;i++){
const chosenCard=weightedCard(pool,sbcRewardWeights,excluded);
candidates.push(chosenCard);
excluded.add(chosenCard.id);
}
showPick({count:4,need:1,min:90,title:"DA BOIZ RNG CHAMP • 1 OF 4"},candidates);
return;
}
}

function renderSbcStorage(){

}).join("")}</div>`:`<div class="panel" style="text-align:center;padding:35px 15px"><div style="font-size:45px">📦</div><h3>Your SBC Storage is empty</h3><p>When you get a duplicate from a pack, press SEND TO SBC STORAGE to put it here.</p></div>`}
</section>`;

function upgradeSbcStorage(){
const capacity=game.sbcCapacity;
const cost=capacity===5?10000:capacity===10?25000:0;
if(!cost){toast("Your SBC Storage is already at maximum capacity!");return}
if(game.coins<cost){toast("Not enough coins to upgrade your storage!");return}
game.coins-=cost;
game.sbcCapacity=capacity===5?10:15;
persistRender();
toast("SBC Storage upgraded to "+game.sbcCapacity+" slots!");
}

function sellStoredCard(index){
const id=game.sbcStorage[index];
if(!id)return;
const c=getCard(id);
if(!c)return;
const price=c.price||rarityPrice[c.rarity]||100;
game.sbcStorage.splice(index,1);
game.coins+=price;
if(game.owned[id]){
game.owned[id]--;
if(game.owned[id]<=0)delete game.owned[id];
}
persistRender();
toast(c.name+" sold for "+money(price)+" coins!");
}

function storeDuplicate(id,button){
if(!game.owned[id]||game.owned[id]<1){toast("You don't have an extra copy of this player!");return}
if(game.sbcStorage.length>=game.sbcCapacity){toast("Your SBC Storage is full! Upgrade it to get more space. This duplicate will be sold when you close the reveal.");return}
game.owned[id]--;
if(game.owned[id]<=0)delete game.owned[id];
game.sbcStorage.push(id);
const pending=pendingDuplicateSales.find(item=>item.id===id&&!item.stored);
if(pending)pending.stored=true;
save();
if(button){button.textContent="✓ STORED";button.disabled=true}
render();
updateRevealStorageStatus();
toast(getCard(id).name+" sent to SBC Storage! Storage: "+game.sbcStorage.length+" / "+game.sbcCapacity);
}

/* MATCH FUNCTIONS */
function getMatchElapsed(){if(!game.match)return 0;return Math.min(90,Math.max(0,Math.floor((Date.now()-game.match.startAt)/1000)))}
function getMatchScore(){
const events=game.match?.events||[];const elapsed=getMatchElapsed();
return {home:events.filter(e=>e.side==="home"&&e.time<=elapsed).length,away:events.filter(e=>e.side==="away"&&e.time<=elapsed).length};
}
function matchEventHTML(e){return `<div class="match-event">${e.time} • ${e.side==="home"?"⚽ DA BOIZ XI":`${opponentEmoji()} ${opponentName()}`} — ${e.scorer} scored!</div>`}
function celebrateGoal(){
document.body.classList.remove("goal-shake");void document.body.offsetWidth;document.body.classList.add("goal-shake");
const flash=document.createElement("div");flash.className="goal-flash";flash.innerHTML='<div class="goal-flash-text">⚽ GOAL!!! ⚽</div>';document.body.appendChild(flash);setTimeout(()=>flash.remove(),950);
}
function updateMatchHUD(){
const hud=document.getElementById("matchHud");if(!hud)return;
if(!game.match||game.match.status!=="running"){hud.classList.remove("visible");return}
hud.classList.add("visible");const score=getMatchScore();const elapsed=Math.max(1,getMatchElapsed());
document.getElementById("hudScore").textContent=`DA BOIZ XI ${score.home} - ${score.away} ${opponentName()}`;
document.getElementById("hudClock").textContent=elapsed;
const latest=game.match.events.filter(e=>e.time<=getMatchElapsed()).slice(-1)[0];
document.getElementById("hudLatest").textContent=latest?`${latest.scorer} scored!`:"Kick-off!";
const teamClock=document.getElementById("teamMatchClock");if(teamClock)teamClock.textContent=elapsed;
}
function createMatch(){
if(game.match){toast("You already have a match in progress!");return}
if(!teamCards().every(Boolean)){toast("You need a full five-player team!");return}
if(game.tokens<3){toast("You need 3 tokens to play!");return}
game.tokens-=3;const squad=teamCards();const opponent=opponentTeams[Math.floor(Math.random()*opponentTeams.length)];
const homeGoals=Math.min(5,Math.max(0,Math.floor(Math.random()*5)));const awayGoals=Math.min(5,Math.max(0,Math.floor(Math.random()*5)));
const events=[];const usedTimes=new Set();
function randomTime(){let t;do{t=5+Math.floor(Math.random()*81)}while(usedTimes.has(t));usedTimes.add(t);return t}
for(let i=0;i<homeGoals;i++){const scorer=squad[Math.floor(Math.random()*squad.length)];events.push({time:randomTime(),side:"home",scorer:scorer.name})}
for(let i=0;i<awayGoals;i++){const scorer=opponent.scorers[Math.floor(Math.random()*opponent.scorers.length)];events.push({time:randomTime(),side:"away",scorer})}
events.sort((a,b)=>a.time-b.time);const now=Date.now();
game.match={status:"running",startAt:now,endAt:now+90000,opponent:{name:opponent.name,emoji:opponent.emoji,scorers:opponent.scorers},events,teamSnapshot:squad.map(c=>({name:c.name,rating:c.rating,emoji:c.emoji}))};
celebratedGoals=new Set();save();activeTab="teamhub";activeTeamTab="team";
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="teamhub"));
render();toast("Match started against "+opponent.name+"! Good luck, Da Boiz XI!");
}
function finishMatch(){
if(!game.match||game.match.status!=="running")return;
game.match.status="finished";game.match.finishedAt=Date.now();activeTab="teamhub";activeTeamTab="team";
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="teamhub"));
save();render();toast("FULL TIME! Claim your match result.");
}
function claimMatch(){
if(!game.match||game.match.status!=="finished")return;
const score=getMatchScore();const result=score.home>score.away?"WIN":score.home<score.away?"LOSS":"DRAW";const reward=result==="WIN"?10:result==="DRAW"?4:0;
game.tokens+=reward;game.lastMatch={home:score.home,away:score.away,opponent:opponentName(),result,reward,events:game.match.events,date:Date.now()};
game.match=null;celebratedGoals=new Set();save();render();toast(reward?`Match claimed! You earned ${reward} tokens!`:"Match claimed. Better luck next time!");
}
function matchTick(){
if(game.match&&game.match.status==="running"){
const elapsed=getMatchElapsed();
game.match.events.forEach((event,index)=>{if(event.side==="home"&&event.time<=elapsed&&!celebratedGoals.has(index)){celebratedGoals.add(index);celebrateGoal()}});
updateMatchHUD();if(Date.now()>=game.match.endAt)finishMatch();
}
}
function startMatchTimer(){
if(matchInterval)clearInterval(matchInterval);
if(game.match?.status==="running")celebratedGoals=new Set(game.match.events.map((event,index)=>({event,index})).filter(item=>item.event.side==="home"&&item.event.time<=getMatchElapsed()).map(item=>item.index));
matchTick();matchInterval=setInterval(matchTick,250);
}

function bindButtons(){
document.querySelectorAll("[data-shop-tab]").forEach(b=>b.onclick=()=>setShopTab(b.dataset.shopTab));
document.querySelectorAll("[data-team-tab]").forEach(b=>b.onclick=()=>setTeamTab(b.dataset.teamTab));
document.querySelectorAll("[data-sbc-tab]").forEach(b=>b.onclick=()=>setSbcTab(b.dataset.sbcTab));

document.querySelectorAll("[data-open-sbc]").forEach(b=>b.onclick=()=>openSbc(b.dataset.openSbc));
document.querySelectorAll("[data-sbc-list]").forEach(b=>b.onclick=()=>{sbcScreen="list";sbcSelected=[];render()});
document.querySelectorAll("[data-start-sbc]").forEach(b=>b.onclick=startSbcSelection);
document.querySelectorAll("[data-sbc-back]").forEach(b=>b.onclick=backSbc);
document.querySelectorAll("[data-sbc-select]").forEach(b=>b.onclick=()=>toggleSbcPlayer(b.dataset.sbcSelect));
document.querySelectorAll("[data-submit-sbc]").forEach(b=>b.onclick=submitSbc);

document.querySelectorAll("[data-upgradesbc]").forEach(b=>b.onclick=upgradeSbcStorage);
document.querySelectorAll("[data-sellstorage]").forEach(b=>b.onclick=()=>sellStoredCard(Number(b.dataset.sellstorage)));
document.querySelectorAll("[data-openpack]").forEach(b=>b.onclick=()=>openPack(b.dataset.openpack));
document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>openPicker(+b.dataset.slot));
document.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{
if(game.match?.status==="running"){toast("You cannot change your team during a match!");return}
game.team[+b.dataset.clear]=null;persistRender();
});
document.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>claimObjective(+b.dataset.claim));
document.querySelectorAll("[data-potion]").forEach(b=>b.onclick=()=>buyPotion(+b.dataset.potion));
document.querySelectorAll("[data-tokenbuy]").forEach(b=>b.onclick=()=>buyTokenItem(b.dataset.tokenbuy));
document.querySelectorAll("[data-startmatch]").forEach(b=>b.onclick=createMatch);
document.querySelectorAll("[data-claimmatch]").forEach(b=>b.onclick=claimMatch);
document.querySelectorAll("[data-walkout]").forEach(b=>b.onchange=()=>{
game.settings.walkouts[b.dataset.walkout]=b.checked;save();toast(b.dataset.walkout+" walkout "+(b.checked?"enabled":"disabled"));
});
let f=document.getElementById("formation");
if(f)f.onchange=()=>{if(game.match?.status==="running")return;game.formation=f.value;save();render()};
}

function weightedRarity(odds){
let entries=Object.entries(odds).filter(x=>x[1]>0);let total=entries.reduce((s,x)=>s+x[1],0);let n=Math.random()*total;
for(let [r,w] of entries){n-=w;if(n<=0)return r}
return entries[0][0];
}
function weightedCard(pool,weights={},exclude=new Set()){
let choices=pool.filter(c=>!exclude.has(c.id));if(!choices.length)choices=pool;
let ws=choices.map(c=>weights[c.rarity]??1);let total=ws.reduce((a,b)=>a+b,0);let n=Math.random()*total;
for(let i=0;i<choices.length;i++){n-=ws[i];if(n<=0)return choices[i]}
return choices[choices.length-1];
}
function normalPick(pack){
if(pack.id==="mega"){
const weights=mythical.map(c=>c.rating===99?0.1:8.3);const total=weights.reduce((a,b)=>a+b,0);let n=Math.random()*total;
for(let i=0;i<mythical.length;i++){n-=weights[i];if(n<0)return mythical[i]}
return mythical[mythical.length-1];
}
let odds={...pack.odds};
if(game.potion&&game.potion.until>Date.now()){
let m=game.potion.multiplier;Object.keys(odds).forEach(r=>{if(r!=="Common")odds[r]*=m});
let sum=Object.values(odds).reduce((a,b)=>a+b,0);Object.keys(odds).forEach(r=>odds[r]=odds[r]/sum*100);
}
let rarity=weightedRarity(odds);let pool=cards.filter(c=>c.rarity===rarity);if(!pool.length)pool=cards.filter(c=>c.rarity!=="Icon");
return pool[Math.floor(Math.random()*pool.length)];
}
function award(c){
const isDuplicate=!!game.owned[c.id];game.owned[c.id]=(game.owned[c.id]||0)+1;
if(isDuplicate)pendingDuplicateSales.push({id:c.id,stored:false});
return isDuplicate;
}
function revealCardElement(c,isDuplicate,index){
let wrap=document.createElement("div");wrap.className="revealcard card-revealed";
const status=document.createElement("div");status.className="card-status "+(isDuplicate?"dupe":"new");status.textContent=isDuplicate?"🔁 DUPE":"✨ NEW";wrap.appendChild(status);
let card=document.createElement("div");card.innerHTML=cardHTML(c);wrap.appendChild(card.firstElementChild);
if(isDuplicate){
let button=document.createElement("button");button.className="storage-button";button.textContent="📦 SEND TO SBC STORAGE";
button.title=game.sbcStorage.length>=game.sbcCapacity?"Storage is full — this duplicate will be sold when you close the reveal":"Send this duplicate to SBC Storage";
button.onclick=()=>storeDuplicate(c.id,button);wrap.appendChild(button);
}
return wrap;
}
function openPack(id){
if(isOpening)return;let p=packDefs.find(x=>x.id===id);if(!p||game.coins<p.price)return;
game.coins-=p.price;isOpening=true;pendingDuplicateSales=[];
let results=Array.from({length:p.pulls},()=>normalPick(p));let tokens=0;
if(p.tokenChance&&Math.random()<p.tokenChance){tokens=p.tokenAmount;game.tokens+=tokens}
let duplicateFlags=results.map(c=>award(c));save();
showReveal({title:p.name,subtitle:`${results.length} player${results.length===1?"":"s"} in your pack${tokens?` • BONUS +${tokens} TOKENS`:""}`,results,duplicateFlags,walkouts:true});
}
function revealEffect(c){return ["Rare","Epic","Legendary","Icon","Mythical"].includes(c.rarity)&&game.settings.walkouts[c.rarity]}
function bestWalkout(results){return results.filter(revealEffect).sort((a,b)=>(rarityRank[b.rarity]-rarityRank[a.rarity])||(b.rating-a.rating))[0]||null}
function walkoutMarkup(c){
let icon=c.rarity==="Mythical"?"🌌":c.rarity==="Icon"?"⚡":c.rarity==="Legendary"?"👑":c.rarity==="Epic"?"💜":"💎";
return `<div class="walkouttitle">YOU PACKED A...</div><div class="walkout-subtitle">${c.rarity.toUpperCase()} ${icon}</div>`;
}

function showReveal(data){
clearTimeout(animationTimer);
const overlay=document.getElementById("reveal");const grid=document.getElementById("revealGrid");const run=++openingRun;
overlay.classList.remove("walkout-mode");
document.getElementById("revealTitle").textContent=data.title||"PLAYER REVEAL";
document.getElementById("revealSubtitle").textContent=data.subtitle||"";
updateRevealStorageStatus();document.getElementById("walkoutBanner").innerHTML="";
document.getElementById("pickHint").textContent="";document.getElementById("revealActions").innerHTML="";
grid.innerHTML="";overlay.classList.add("show");document.getElementById("closeReveal").disabled=true;
const walkout=data.walkouts?bestWalkout(data.results):null;const rest=walkout?data.results.filter(c=>c!==walkout):data.results.slice();

function finish(){
if(run!==openingRun)return;
document.getElementById("closeReveal").disabled=false;
document.getElementById("revealActions").innerHTML='<button id="revealDone">CONTINUE</button>';
document.getElementById("revealDone").onclick=closeReveal;document.getElementById("closeReveal").onclick=closeReveal;
}
function showRest(){
if(run!==openingRun)return;
overlay.classList.remove("walkout-mode");document.getElementById("walkoutBanner").innerHTML="";document.getElementById("pickHint").textContent="";grid.innerHTML="";
const allPlayers=walkout?[walkout,...rest]:rest;
if(allPlayers.length){
document.getElementById("revealSubtitle").textContent="THE WHOLE PACK REVEALED";
let title=document.createElement("div");title.className="pack-rest-title";title.style.gridColumn="1/-1";title.textContent="📦 THE WHOLE PACK";grid.appendChild(title);
allPlayers.forEach((c,i)=>{let originalIndex=data.results.indexOf(c);let el=revealCardElement(c,!!data.duplicateFlags?.[originalIndex],i);el.style.animationDelay=(i*.12)+"s";grid.appendChild(el)});
}else{
document.getElementById("revealSubtitle").textContent="Your pack contained one player!";
let el=revealCardElement(walkout,!!data.duplicateFlags?.[data.results.indexOf(walkout)],0);grid.appendChild(el);
}
finish();
}
if(!walkout){
data.results.forEach((c,i)=>{let el=revealCardElement(c,!!data.duplicateFlags?.[i],i);el.style.animationDelay=(i*.12)+"s";grid.appendChild(el)});
finish();return;
}
overlay.classList.add("walkout-mode");document.getElementById("walkoutBanner").innerHTML='<div class="walkouttitle">YOU PACKED A...</div>';
document.getElementById("pickHint").textContent="WAIT FOR IT...";
let rarity=walkout.rarity;let special=document.createElement("div");special.className="walkout-flip "+rarity;
let inner=document.createElement("div");inner.className="flip-inner";
let back=document.createElement("div");back.className="flip-back";back.innerHTML=`${rarity==="Mythical"?"🌌":rarity==="Icon"?"⚡":"🎁"}<span>DA BOIZ RNG</span>`;
let front=document.createElement("div");front.className="flip-front";front.innerHTML=cardHTML(walkout);
inner.appendChild(back);inner.appendChild(front);special.appendChild(inner);grid.appendChild(special);
animationTimer=setTimeout(()=>{
if(run!==openingRun)return;
let icon=rarity==="Mythical"?"🌌":rarity==="Icon"?"⚡":rarity==="Legendary"?"👑":rarity==="Epic"?"💜":"💎";
document.getElementById("walkoutBanner").innerHTML=`<div class="walkouttitle">YOU PACKED A...</div><div class="walkout-subtitle">${rarity.toUpperCase()} ${icon}</div>`;
document.getElementById("pickHint").textContent="REVEALING PLAYER...";
animationTimer=setTimeout(()=>{if(run!==openingRun)return;inner.classList.add("flip-now")},550);
animationTimer=setTimeout(()=>{if(run!==openingRun)return;showRest()},1900);
},800);
document.getElementById("closeReveal").onclick=()=>{if(confirm("Close the pack reveal?"))closeReveal()};
}

function sellUnstoredDuplicates(){
let soldCount=0;let totalCoins=0;
pendingDuplicateSales.forEach(item=>{
if(item.stored)return;const c=getCard(item.id);if(!c)return;
if(!game.owned[item.id]||game.owned[item.id]<1)return;
game.owned[item.id]--;if(game.owned[item.id]<=0)delete game.owned[item.id];
const price=c.price||rarityPrice[c.rarity]||100;game.coins+=price;totalCoins+=price;soldCount++;
});
pendingDuplicateSales=[];save();return {soldCount,totalCoins};
}
function closeReveal(){
clearTimeout(animationTimer);openingRun++;
document.getElementById("reveal").classList.remove("show","walkout-mode");
document.getElementById("closeReveal").disabled=false;isOpening=false;pickState=null;
sellUnstoredDuplicates();render();
}

/* Token rewards use a filtered pool and much lower Icon/Mythical weights.
   The 95+ pick has four unique choices from a pool of five: only one is
   a standard Icon, so that particular pick will still contain Mythicals. */
function buyTokenItem(type){
if(isOpening)return;
const costs={x2:25,pick84:50,pick95:400,pick79:15};const cost=costs[type];
if(game.tokens<cost){toast("Not enough tokens!");return}
game.tokens-=cost;isOpening=true;pendingDuplicateSales=[];save();
if(type==="x2"){
let pool=randomRewardCards.filter(c=>c.rating>=84);
let results=[weightedCard(pool,tokenRewardWeights),weightedCard(pool,tokenRewardWeights)];let duplicateFlags=results.map(c=>award(c));
save();showReveal({title:"84+ x2 TOKEN PACK",subtitle:"Two guaranteed 84+ players",results,walkouts:true,duplicateFlags});return;
}
let config={pick84:{count:5,need:1,min:84,title:"1 OF 5 • 84+ PLAYER PICK"},pick95:{count:4,need:1,min:95,title:"1 OF 4 • 95+ PLAYER PICK"},pick79:{count:5,need:2,min:79,title:"2 OF 5 • 79+ PLAYER PICK"}}[type];
let pool=randomRewardCards.filter(c=>c.rating>=config.min);let candidates=[];let excluded=new Set();
for(let i=0;i<config.count;i++){
let c=weightedCard(pool,tokenRewardWeights,excluded);
candidates.push(c);
excluded.add(c.id);
}
showPick(config,candidates);
}

function showPick(config,candidates){
clearTimeout(animationTimer);openingRun++;
const overlay=document.getElementById("reveal");const grid=document.getElementById("revealGrid");
overlay.classList.remove("walkout-mode");
document.getElementById("revealTitle").textContent=config.title;
document.getElementById("revealSubtitle").textContent="Your candidates are being revealed one at a time...";
updateRevealStorageStatus();document.getElementById("walkoutBanner").innerHTML="";
document.getElementById("pickHint").textContent=`REVEALED 0/${candidates.length}`;
grid.innerHTML="";pickState={config,candidates,selected:new Set(),revealed:0};
candidates.forEach(c=>{
let el=document.createElement("div");el.className="revealcard hidden-reveal";
el.innerHTML=cardHTML(c,'<div class="card-actions"><button class="secondary" disabled>WAIT...</button></div>');
el.onclick=()=>togglePick(c);grid.appendChild(el);
});
document.getElementById("revealActions").innerHTML='<button id="confirmPick" disabled>CONFIRM SELECTION</button> <button class="secondary" id="cancelPick">CANCEL</button>';
document.getElementById("confirmPick").onclick=confirmPick;
document.getElementById("cancelPick").onclick=()=>{if(confirm("Cancel this pick?"))closeReveal()};
document.getElementById("closeReveal").disabled=false;
document.getElementById("closeReveal").onclick=()=>{if(confirm("Close this pick?"))closeReveal()};
overlay.classList.add("show");
let i=0;
function next(){
if(!pickState||i>=candidates.length)return;
let el=grid.children[i];el.classList.remove("hidden-reveal");el.classList.add("card-revealed");
el.querySelector("button").disabled=false;el.querySelector("button").textContent="SELECT";
pickState.revealed=i+1;
document.getElementById("pickHint").textContent=`REVEALED ${i+1}/${candidates.length} • SELECT ${config.need} PLAYER${config.need>1?"S":""}`;
i++;
if(i<candidates.length)animationTimer=setTimeout(next,650);
else document.getElementById("revealSubtitle").textContent="All candidates revealed! Choose your reward.";
}
animationTimer=setTimeout(next,400);
}

function togglePick(c){
if(!pickState)return;
let index=pickState.candidates.findIndex(x=>x.id===c.id);
if(index>=pickState.revealed){toast("Wait for this player to be revealed!");return}
let s=pickState.selected;
if(s.has(c.id))s.delete(c.id);
else if(s.size<pickState.config.need)s.add(c.id);
else{toast("You can only select "+pickState.config.need+" player(s).");return}
document.getElementById("revealGrid").querySelectorAll(".revealcard").forEach((el,i)=>{
el.classList.toggle("selected",s.has(pickState.candidates[i].id));
let b=el.querySelector("button");if(b&&i<pickState.revealed)b.textContent=s.has(pickState.candidates[i].id)?"✓ SELECTED":"SELECT";
});
document.getElementById("pickHint").textContent=`SELECT ${pickState.config.need} PLAYER${pickState.config.need>1?"S":""} • ${s.size}/${pickState.config.need} SELECTED`;
document.getElementById("confirmPick").disabled=s.size!==pickState.config.need||pickState.revealed!==pickState.candidates.length;
}

function confirmPick(){
if(!pickState||pickState.selected.size!==pickState.config.need||pickState.revealed!==pickState.candidates.length)return;
let chosen=pickState.candidates.filter(c=>pickState.selected.has(c.id));
let duplicateFlags=chosen.map(c=>award(c));save();pickState=null;
document.getElementById("reveal").classList.remove("walkout-mode");
document.getElementById("revealTitle").textContent="PLAYER PICK CONFIRMED!";
document.getElementById("revealSubtitle").textContent="Your selected players have been added to your collection.";
updateRevealStorageStatus();document.getElementById("walkoutBanner").innerHTML="";document.getElementById("pickHint").textContent="";
let grid=document.getElementById("revealGrid");grid.innerHTML="";
chosen.forEach((c,i)=>{let el=revealCardElement(c,duplicateFlags[i],i);el.style.animationDelay=(i*.2)+"s";grid.appendChild(el)});
document.getElementById("revealActions").innerHTML='<button id="pickDone">CONTINUE</button>';
document.getElementById("pickDone").onclick=closeReveal;document.getElementById("closeReveal").onclick=closeReveal;
}

function openPicker(slot){
if(isOpening)return;
if(game.match?.status==="running"){toast("You cannot change your team during a match!");return}
let list=document.getElementById("playerList");list.innerHTML="";
let owned=getOwned().sort((a,b)=>b.rating-a.rating||a.name.localeCompare(b.name));
document.getElementById("pickerSubtitle").textContent=`${positionNames[slot]} • Position ${slot+1} • Sorted by rating`;
if(!owned.length)list.innerHTML='<div class="panel">You have no players yet. Open a pack first.</div>';
owned.forEach(c=>{
let el=document.createElement("button");el.className="playeroption"+(game.team[slot]===c.id?" active":"");
el.innerHTML=`<span class="miniemoji">${c.emoji}</span><span class="playerinfo"><b>${c.name}</b><small>${c.rarity} • Owned: ${game.owned[c.id]}</small></span><span class="ovr">${c.rating}</span>`;
el.onclick=()=>{
if(game.team.some((id,i)=>i!==slot&&id===c.id)){toast("That player is already in another position.");return}
game.team[slot]=c.id;save();document.getElementById("playerPicker").classList.remove("show");render();
};
list.appendChild(el);
});
document.getElementById("playerPicker").classList.add("show");
}
document.getElementById("closePicker").onclick=()=>document.getElementById("playerPicker").classList.remove("show");

function claimObjective(target){
let o=objectives.find(x=>x.rating===target);
if(!o||game.claimed[target]||teamRating()<target||!teamCards().every(Boolean))return;
game.claimed[target]=true;game.coins+=o.coins;game.tokens+=o.tokens;
persistRender();toast(`Reward claimed: ${money(o.coins)} coins and ${o.tokens} tokens!`);
}
function buyPotion(mult){
let price=mult===2?20000:80000;
if(game.coins<price||game.potion&&game.potion.until>Date.now())return;
game.coins-=price;game.potion={multiplier:mult,until:Date.now()+120000};
persistRender();toast(mult+"x luck activated for 2 minutes!");
}

render();
startMatchTimer();
</script>
