<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA BOIZ RNG</title>
<style>
:root{
--bg:#080b14;
--panel:#111827;
--panel2:#172033;
--purple:#8b5cf6;
--gold:#fbbf24;
--text:#f8fafc;
--muted:#a1abc0;
--border:#29364d;
--green:#22c55e;
--radius:18px;
--shadow:0 16px 40px #0005;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:
radial-gradient(ellipse at 50% -15%,#283c68 0%,transparent 48%),
radial-gradient(ellipse at 100% 40%,#24134255,transparent 40%),
linear-gradient(180deg,#0b1020,#080b14 65%);
color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
min-height:100vh;
line-height:1.5;
}
button,input,select{font:inherit}
button{
cursor:pointer;
border:1px solid #a78bfa55;
border-radius:12px;
padding:12px 17px;
font-weight:850;
letter-spacing:.2px;
background:linear-gradient(135deg,#9b7bff,#6d3bd1);
color:white;
box-shadow:0 5px 16px #6d3bd133,inset 0 1px #ffffff25;
transition:transform .18s ease,filter .18s ease,box-shadow .18s ease,border-color .18s ease;
}
button:hover:not(:disabled){
filter:brightness(1.13);
transform:translateY(-2px);
box-shadow:0 9px 23px #7c3aed44,inset 0 1px #ffffff30;
}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{
outline:3px solid #c4b5fd;
outline-offset:3px;
}
button:disabled{
opacity:.38;
cursor:not-allowed;
filter:saturate(.5);
transform:none;
box-shadow:none;
}
input,select{
background:#0c1220;
color:white;
border:1px solid #34415b;
border-radius:11px;
padding:11px 13px;
}
input:focus,select:focus{border-color:#a78bfa;outline:none}
header{
padding:19px 4%;
background:#0a1020eF;
border-bottom:1px solid #34415b;
position:sticky;
top:0;
z-index:5;
backdrop-filter:blur(20px);
box-shadow:0 8px 30px #0003;
}
.headtop{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{
font-size:clamp(24px,4vw,39px);
font-weight:1000;
letter-spacing:1.5px;
background:linear-gradient(100deg,#fff 10%,#c4b5fd 48%,#fcd34d 90%);
background-clip:text;
-webkit-background-clip:text;
color:transparent;
filter:drop-shadow(0 4px 15px #8b5cf633);
}
.stats,nav{display:flex;gap:9px;flex-wrap:wrap}
.stat{
background:linear-gradient(145deg,#1c2940,#111a2c);
border:1px solid #3a4964;
padding:10px 14px;
border-radius:13px;
font-weight:850;
font-size:14px;
box-shadow:inset 0 1px #ffffff0c;
}
nav{
overflow-x:auto;
padding-top:17px;
scrollbar-width:thin;
}
nav button{
white-space:nowrap;
background:#151f32;
color:#b9c5da;
border:1px solid #35445e;
flex:1;
min-width:100px;
font-size:14px;
box-shadow:none;
}
nav button.active{
background:linear-gradient(135deg,#9067f5,#6334c3);
color:white;
border-color:#bba4ff;
box-shadow:0 5px 18px #7c3aed55,inset 0 1px #ffffff35;
}
.subnav{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-bottom:20px;
padding:9px;
background:#0e1727;
border:1px solid #2d3c55;
border-radius:15px;
box-shadow:inset 0 1px #ffffff08;
}
.subnav button{
flex:1;
min-width:120px;
background:#1a263b;
color:#b9c5da;
border:1px solid #35445e;
box-shadow:none;
}
.subnav button.active{
background:linear-gradient(135deg,#9067f5,#6334c3);
color:white;
border-color:#bba4ff;
}
main{max-width:1320px;margin:auto;padding:28px 4% 70px}
h2{margin:0 0 16px;font-size:clamp(22px,3vw,29px);letter-spacing:-.5px;line-height:1.2}
h3{margin:0 0 10px;font-size:18px;letter-spacing:-.2px}
p{color:var(--muted);line-height:1.65}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:17px;
}
.panel,.pack,.objective,.setting,.shopitem{
background:linear-gradient(145deg,#19253a,#101827);
border:1px solid #34445f;
border-radius:var(--radius);
padding:19px;
box-shadow:var(--shadow),inset 0 1px #ffffff09;
}
.panel,.objective,.setting,.shopitem{transition:border-color .2s,transform .2s,box-shadow .2s}
.panel:hover,.objective:hover,.shopitem:hover{
border-color:#687ba0;
box-shadow:0 18px 42px #0005,inset 0 1px #ffffff0c;
}
.sectionhero{
background:
radial-gradient(circle at 90% 0%,#9b7bff25,transparent 35%),
linear-gradient(120deg,#202d4b,#131d31 60%,#1d1835);
border:1px solid #485b7c;
border-radius:21px;
padding:24px;
margin-bottom:19px;
box-shadow:0 15px 38px #0003,inset 0 1px #ffffff12;
position:relative;
overflow:hidden;
}
.sectionhero:after{
content:"";
position:absolute;
right:-50px;
bottom:-95px;
width:210px;
height:210px;
border-radius:50%;
border:1px solid #ffffff0b;
box-shadow:0 0 0 22px #ffffff04,0 0 0 44px #ffffff03;
pointer-events:none;
}
.tokenhero{
background:
radial-gradient(circle at 90% 0%,#fbbf2430,transparent 35%),
linear-gradient(120deg,#443019,#211b2c 58%,#171b30);
border-color:#80633b;
}
.pack{
position:relative;
overflow:hidden;
min-height:285px;
display:flex;
flex-direction:column;
gap:12px;
isolation:isolate;
transition:transform .2s,border-color .2s,box-shadow .2s;
}
.pack:hover{transform:translateY(-4px);box-shadow:0 20px 45px #0006}
.pack:before{
content:"";
position:absolute;
width:210px;
height:210px;
border-radius:50%;
background:var(--glow,#8b5cf633);
filter:blur(35px);
right:-80px;
top:-85px;
z-index:-1;
}
.pack>*{position:relative}
.pack.low{--glow:#60a5fa66;border-color:#3b82f688}
.pack.mid{--glow:#a78bfa77;border-color:#8b5cf688}
.pack.high{--glow:#ec489977;border-color:#ec489988}
.pack.mega{--glow:#22d3ee77;border-color:#22d3ee99}
.packicon{font-size:48px;filter:drop-shadow(0 6px 12px #0006)}
.packname{font-size:19px;font-weight:1000;letter-spacing:.2px}
.price{font-size:24px;font-weight:1000;color:#fcd46b;text-shadow:0 2px 12px #fbbf2420}
.packdesc{font-size:13px;color:#c0cce0;min-height:35px}
.packfoot{margin-top:auto}
.packfoot button{width:100%;padding:14px}
.packstats{display:flex;gap:7px;flex-wrap:wrap}
.packstats span{
background:#ffffff0b;
border:1px solid #ffffff18;
padding:7px 9px;
border-radius:9px;
font-size:11px;
color:#d8e0ef;
}
.shopitem{
position:relative;
overflow:hidden;
display:flex;
flex-direction:column;
gap:11px;
min-height:275px;
}
.shopitem .packicon{font-size:42px}
.shopitem p{font-size:13px;min-height:50px;margin:0}
.shopitem button{margin-top:auto;width:100%}
.badge{
display:inline-block;
padding:7px 10px;
border-radius:9px;
background:#ffffff0d;
border:1px solid #ffffff20;
font-size:10px;
letter-spacing:1px;
font-weight:950;
color:#dce5f5;
}
.card{
border:2px solid #53627b;
border-radius:17px;
padding:15px;
background:linear-gradient(155deg,#25324a,#111827 72%);
text-align:center;
position:relative;
overflow:hidden;
min-width:0;
box-shadow:0 10px 24px #0003,inset 0 1px #ffffff12;
transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 15px 28px #0005,inset 0 1px #ffffff15}
.card:before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(130deg,#ffffff0b,transparent 40%);
pointer-events:none;
}
.card .emoji{font-size:40px;margin:9px 0 6px;filter:drop-shadow(0 5px 9px #0005)}
.card .name{font-size:14px;font-weight:950;overflow-wrap:anywhere;line-height:1.35;margin-top:4px}
.rating{font-size:30px;font-weight:1000;line-height:1.1;text-shadow:0 3px 15px #0006}
.rarity{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:950;margin:9px 0 3px}
.Common{border-color:#94a3b8}
.Common .rarity{color:#cbd5e1}
.Uncommon{border-color:#4ade80}
.Uncommon .rarity{color:#4ade80}
.Rare{border-color:#60a5fa;box-shadow:0 0 18px #60a5fa20,0 10px 24px #0003}
.Rare .rarity{color:#60a5fa}
.Epic{border-color:#c084fc;box-shadow:0 0 18px #a855f722,0 10px 24px #0003}
.Epic .rarity{color:#d8b4fe}
.Legendary{border-color:#fbbf24;box-shadow:0 0 22px #fbbf2428,0 10px 24px #0003}
.Legendary .rarity{color:#fcd34d}
.Icon{border-color:#fb7185;box-shadow:0 0 22px #fb71852b,0 10px 24px #0003}
.Icon .rarity{color:#fda4af}
.Mythical{border-color:#22d3ee;box-shadow:0 0 24px #22d3ee30,0 10px 24px #0003}
.Mythical .rarity{color:#67e8f9}
.card.selected{outline:3px solid var(--gold);transform:translateY(-3px)}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.card-actions button{flex:1;padding:9px 5px;font-size:12px}
.secondary{
background:linear-gradient(145deg,#27354c,#1a2639);
border:1px solid #53627b;
color:#e0e8f5;
box-shadow:none;
}
.secondary:hover:not(:disabled){background:#354560;box-shadow:0 7px 18px #0003}
.gold{
background:linear-gradient(135deg,#facc15,#d97706);
color:#201300;
border-color:#fcd34d;
}
.small{font-size:12px;color:var(--muted)}
.bar{
height:10px;
background:#26334a;
border:1px solid #3b4b66;
border-radius:20px;
overflow:hidden;
margin:11px 0;
}
.bar span{
height:100%;
display:block;
background:linear-gradient(90deg,#8b5cf6,#c084fc,#f0abfc);
border-radius:20px;
box-shadow:0 0 12px #a78bfa88;
}
.pitch{
position:relative;
overflow:hidden;
background:
linear-gradient(#ffffff08 1px,transparent 1px),
repeating-linear-gradient(90deg,#176b42 0 55px,#1c7549 55px 110px);
background-size:100% 50px,auto;
border:3px solid #64b78b;
border-radius:22px;
padding:24px 18px;
min-height:360px;
display:flex;
flex-direction:column;
justify-content:space-around;
gap:12px;
box-shadow:0 15px 35px #0004,inset 0 0 35px #001d0f55;
}
.pitch-markings{position:absolute;inset:10px;border:2px solid #d5f7e7aa;pointer-events:none;z-index:0;border-radius:5px}
.center-line{position:absolute;left:0;right:0;top:50%;border-top:2px solid #d5f7e7aa}
.center-circle{position:absolute;width:95px;height:95px;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #d5f7e7aa;border-radius:50%}
.center-spot{position:absolute;width:7px;height:7px;left:50%;top:50%;transform:translate(-50%,-50%);background:#e7fff2;border-radius:50%}
.penalty-box{position:absolute;left:22%;width:56%;height:17%;border:2px solid #d5f7e7aa}
.penalty-box.top{top:-2px;border-top:0}
.penalty-box.bottom{bottom:-2px;border-bottom:0}
.goal-box{position:absolute;left:37.5%;width:25%;height:7%;border:2px solid #d5f7e7aa}
.goal-box.top{top:-2px;border-top:0}
.goal-box.bottom{bottom:-2px;border-bottom:0}
.pitchrow{position:relative;z-index:1;display:flex;justify-content:space-evenly;gap:10px;flex-wrap:wrap}
.position{
background:linear-gradient(145deg,#123d31ee,#102c26ee);
border:1px solid #8bd6a8;
border-radius:14px;
padding:11px;
min-width:115px;
flex:1;
text-align:center;
box-shadow:0 7px 16px #0004,inset 0 1px #ffffff18;
}
.position button{margin-top:8px;padding:8px;font-size:12px;width:100%}
.position-role{display:block;font-size:12px;font-weight:1000;letter-spacing:2px;color:#b7ffd0;margin-bottom:5px}
.playerlist{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:10px;
max-height:55vh;
overflow:auto;
padding:5px;
}
.playeroption{
display:flex;
align-items:center;
gap:10px;
text-align:left;
background:linear-gradient(145deg,#202e45,#141e30);
border:1px solid #3b4b66;
border-radius:13px;
padding:11px;
color:white;
transition:.18s;
}
.playeroption:hover{border-color:#a78bfa;background:#27344d}
.playeroption .miniemoji{font-size:25px}
.playerinfo{flex:1;min-width:0}
.playerinfo b{display:block;overflow-wrap:anywhere;font-size:13px}
.playerinfo small{color:var(--muted)}
.ovr{font-size:20px;font-weight:1000;color:var(--gold)}
.playeroption.active{border-color:var(--gold);background:#493617}.overlay{
position:fixed;
inset:0;
background:#030712ed;
backdrop-filter:blur(13px);
z-index:20;
display:none;
overflow:auto;
padding:20px;
align-items:center;
justify-content:center;
}
.overlay.show{display:flex}
.modal{
width:min(100%,1000px);
background:
radial-gradient(circle at 90% 0%,#8b5cf622,transparent 35%),
linear-gradient(145deg,#1b2940,#0d1524);
border:1px solid #52627e;
border-radius:23px;
padding:24px;
box-shadow:0 25px 90px #000b,0 0 60px #8b5cf622;
max-height:94vh;
overflow:auto;
}
.modalhead{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:18px;
}
.revealgrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
gap:13px;
}
.revealcard{min-width:0}
.revealcard.hidden-reveal{opacity:0;transform:scale(.65);pointer-events:none;visibility:hidden}
.revealcard.card-revealed{visibility:visible;animation:flipin .4s ease both}
.card-status{
font-size:12px;
font-weight:1000;
letter-spacing:1px;
text-align:center;
margin-bottom:8px;
padding:8px;
border-radius:9px;
}
.card-status.new{background:#14532d;color:#86efac;border:1px solid #22c55e}
.card-status.dupe{background:#713f12;color:#fde68a;border:1px solid #f59e0b}
.storage-button{
width:100%;
margin-top:9px;
background:linear-gradient(135deg,#0f766e,#115e59);
font-size:11px;
padding:10px 5px;
}
.storage-sell-button{
width:100%;
margin-top:10px;
background:linear-gradient(135deg,#facc15,#d97706);
color:#201300;
font-size:12px;
padding:11px;
}
#revealStorageStatus{font-size:12px;color:#fcd34d;font-weight:900;margin-top:7px}
#walkoutBanner{text-align:center;min-height:65px}
.walkouttitle{
font-size:clamp(28px,6vw,58px);
font-weight:1000;
letter-spacing:2px;
text-align:center;
margin:18px 0;
color:white;
text-shadow:0 5px 25px #8b5cf655;
}
.walkout-subtitle{
text-align:center;
font-weight:1000;
letter-spacing:2px;
margin-bottom:20px;
color:#eee;
animation:rarityAppear .45s ease both;
}
.walkout-mode{background:radial-gradient(ellipse at center,#21143a 0%,#05030df5 78%)}
.pack-rest-title{
text-align:center;
font-weight:1000;
font-size:24px;
margin:20px 0;
animation:titleSlam .4s both;
}
.pickhint{text-align:center;color:var(--gold);font-weight:900;margin:12px 0;min-height:18px}
.walkout-flip{perspective:1000px;width:100%;max-width:250px;height:330px;margin:15px auto}
.flip-inner{position:relative;width:100%;height:330px;transform-style:preserve-3d}
.flip-inner.flip-now{animation:cardFlip .9s ease-in-out forwards}
.flip-back,.flip-front{
position:absolute;
inset:0;
width:100%;
height:330px;
min-height:330px;
box-sizing:border-box;
border-radius:18px;
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
}
.flip-back{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
background:linear-gradient(145deg,#30204e,#100d1b);
border:3px solid #8b5cf6;
box-shadow:0 0 35px #8b5cf655;
font-size:65px;
}
.flip-back span{font-size:16px;font-weight:1000;letter-spacing:3px}
.flip-front{transform:rotateY(180deg)}
.flip-front .card{
width:100%;
height:100%;
min-height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}
.walkout-flip.Rare .flip-back{border-color:#60a5fa}
.walkout-flip.Epic .flip-back{border-color:#c084fc}
.walkout-flip.Legendary .flip-back{border-color:#fbbf24}
.walkout-flip.Icon .flip-back{border-color:#fb7185}
.walkout-flip.Mythical .flip-back{border-color:#22d3ee}
@keyframes cardFlip{0%{transform:rotateY(0deg)}100%{transform:rotateY(180deg)}}
@keyframes rarityAppear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes flipin{from{opacity:0;transform:rotateY(35deg)}to{opacity:1;transform:rotateY(0)}}
@keyframes titleSlam{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
.toast{
position:fixed;
bottom:22px;
left:50%;
transform:translateX(-50%);
background:linear-gradient(145deg,#26334d,#111b2d);
border:1px solid #9270e9;
padding:14px 20px;
border-radius:14px;
z-index:50;
display:none;
box-shadow:0 12px 40px #0009;
max-width:90vw;
text-align:center;
font-weight:750;
}
.toast.show{display:block;animation:flipin .2s}
.setting{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}
.setting input{width:20px;height:20px;accent-color:#8b5cf6}
footer{
text-align:center;
color:#77849c;
padding:28px;
border-top:1px solid #29364d;
background:#090f1b;
font-size:13px;
letter-spacing:.5px;
}
.match-hud{
display:none;
margin-top:15px;
background:linear-gradient(100deg,#173e2d,#21143a);
border:1px solid #65d99a;
border-radius:14px;
padding:13px 16px;
align-items:center;
justify-content:space-between;
gap:12px;
flex-wrap:wrap;
box-shadow:0 8px 25px #0003;
}
.match-hud.visible{display:flex}
.match-hud strong{font-size:17px}
.match-clock{font-size:24px;font-weight:1000;color:var(--gold)}
.match-panel{
margin:18px 0;
background:linear-gradient(145deg,#162e26,#171326);
border:1px solid #4b936e;
border-radius:18px;
padding:20px;
box-shadow:var(--shadow);
}
.match-panel h3{font-size:20px}
.match-score{font-size:clamp(25px,5vw,38px);font-weight:1000;text-align:center;margin:14px}
.match-events{max-height:190px;overflow:auto;margin-top:12px}
.match-event{
padding:10px 12px;
margin:7px 0;
background:#ffffff0b;
border:1px solid #ffffff16;
border-radius:10px;
font-size:13px;
}
.match-win{color:#4ade80;font-weight:900}
.match-loss{color:#fb7185;font-weight:900}
.match-draw{color:var(--gold);font-weight:900}
.match-play{
width:100%;
padding:16px;
font-size:16px;
margin-top:12px;
background:linear-gradient(135deg,#16a34a,#047857);
border-color:#4ade80;
}
body.goal-shake{animation:screenShake .45s ease}
@keyframes screenShake{
0%,100%{transform:translateX(0)}
15%{transform:translateX(-9px) rotate(-.5deg)}
30%{transform:translateX(9px) rotate(.5deg)}
45%{transform:translateX(-7px)}
60%{transform:translateX(7px)}
75%{transform:translateX(-3px)}
}
.goal-flash{
position:fixed;
inset:0;
z-index:60;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
background:#ffd16622;
animation:goalFlash .9s ease forwards;
}
.goal-flash-text{
font-size:clamp(55px,14vw,125px);
font-weight:1000;
font-style:italic;
letter-spacing:4px;
color:#ffd166;
text-shadow:0 0 15px #ff8c00,0 0 40px #ff8c00,5px 7px 0 #5b2600;
animation:goalSlam .9s ease forwards;
text-align:center;
}
@keyframes goalFlash{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes goalSlam{0%{transform:scale(.2) rotate(-12deg);opacity:0}25%{transform:scale(1.2) rotate(4deg);opacity:1}45%{transform:scale(1) rotate(0)}100%{transform:scale(1.1);opacity:0}}
@media(max-width:700px){
header{padding:14px 4%}
.headtop{align-items:flex-start}
.stats{width:100%}
.stat{padding:9px 10px;font-size:12px;flex:1;text-align:center}
main{padding-top:19px}
.grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.panel,.pack,.objective,.setting,.shopitem{padding:15px}
.sectionhero{padding:19px}
.pack{min-height:270px}
.modal{padding:15px}
.position{min-width:100px}
.walkout-flip{max-width:230px}

 </div>
 <nav>

 </nav>

 </div>
</header>

<footer>DA BOIZ RNG • Build your dream team.</footer>

<div class="overlay" id="reveal">
 <div class="modal">

    <h2 id="revealTitle">PACK OPENING</h2>
    <div class="small" id="revealSubtitle"></div>   </div>
   <button class="secondary" id="closeReveal">✕ Close</button>
  </div>

 </div>
</div>

 <div class="modal">
  <div class="modalhead">
   <div><h2>🟣 SELECT YOUR PLAYER</h2><div class="small" id="pickerSubtitle"></div></div>
   <button class="secondary" id="closePicker">✕ Close</button>
  </div>
  <div class="playerlist" id="playerList"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SAVE_KEY="daBoizRNG_full_v7";
const positionNames=["GK","CB","CB","CM","ST"];

const baseCards=[
["brody","Brody Doel","🐺","Uncommon",76,300],
["dexter","Dexter Chadwick","🧢","Rare",78,600],
["matthew","Matthew Bardsley","😎","Common",72,100],
["numaii","Numaii Leslie-Madden","🦊","Common",67,100],
["freddie","Freddie Fifield","⚽","Uncommon",74,300],
["max_rolfe","Max Rolfe","🔥","Common",68,100],
["ashton","Ashton Elliott","🦁","Rare",77,600],
["oscar","Oscar Robert Harper","👑","Epic",83,1200],
["jayden","Jayden Jobarteh","💎","Uncommon",75,300],
["henry","Henry James Worsell","⚡","Epic",82,1200],
["vittorio","Vittorio Petruzzelli","🦈","Legendary",88,3000],
["zain","Zain Miah","🚀","Epic",84,1200],
["lil_mumps","Lil Mumps","🎤","Legendary",88,3000],
["liam","Liam Sutherland","🌠","Icon",93,10000],
["max_worboys","Max Worboys","🐐","Icon",94,10000],
["jacky_chan","Jacky Chan","🥋","Icon",95,10000],
["riley_may","Riley May","🌟","Icon",93,10000]
].map(x=>({id:x[0],name:x[1],emoji:x[2],rarity:x[3],rating:x[4],price:x[5]}));

const cards=baseCards.map(c=>({...c}));
const noseBreatherCard={id:"nose_breather_lil_mumps",name:"Nose Breather Lil Mumps",emoji:"👃",rarity:"Icon",rating:94,price:10000};

const mythical=[
["myth_dexter","Mythical Dexter Chadwick","83"],
["myth_matthew","Mythical Matthew Bardsley","80"],
["myth_numaii","Mythical Numaii Leslie-Madden","79"],
["myth_freddie","Mythical Freddie Fifield","81"],
["myth_max_rolfe","Mythical Max Rolfe","77"],
["myth_ashton","Mythical Ashton Elliott","81"],
["myth_oscar","Mythical Oscar Robert Harper","87"],
["myth_jayden","Mythical Jayden Jobarteh","82"],
["myth_henry","Mythical Henry James Worsell","86"],
["myth_vittorio","Mythical Vittorio Petruzzelli","93"],
["myth_zain","Mythical Zain Miah","88"],
["myth_liam","Mythical Liam Sutherland","97"],
["myth_max_worboys","Mythical Max Worboys","98"],
["myth_jacky_chan","Mythical Jacky Chan","99"],
["myth_riley_may","Mythical Riley May","97"],
["myth_brody","Mythical Brody Doel","82"]
].map(x=>({id:x[0],name:x[1],emoji:"🌌",rarity:"Mythical",rating:Number(x[2]),price:5000}));

const allCards=[...cards,noseBreatherCard,...mythical];

const randomRewardCards=allCards.filter(c=>c.id!=="nose_breather_lil_mumps");

const tokenRewardWeights={
Common:1,
Uncommon:1,
Rare:1,
Epic:1,
Legendary:0.5,
Icon:0.04,
Mythical:0.002
};


const rarityPrice={Common:100,Uncommon:300,Rare:600,Epic:1200,Legendary:3000,Icon:10000,Mythical:5000};
const rarityRank={Common:0,Uncommon:1,Rare:2,Epic:3,Legendary:4,Icon:5,Mythical:6};

const packDefs=[
{id:"low",name:"LOW T PACK",icon:"📦",price:0,pulls:5,odds:{Common:80,Uncommon:13,Rare:5.5,Epic:1.4,Legendary:.1},tokenChance:.10,tokenAmount:2,description:"Free pack • 5 players",className:"low"},
{id:"mid",name:"MID T PACK",icon:"🎁",price:3500,pulls:5,odds:{Common:64,Uncommon:22,Rare:9,Epic:4.2,Legendary:.7,Icon:.1},tokenChance:.07,tokenAmount:3,description:"5 players • Better odds",className:"mid"},
{id:"high",name:"HIGH T PACK",icon:"💜",price:7500,pulls:5,odds:{Common:40,Uncommon:30,Rare:18,Epic:10,Legendary:1.8,Icon:.2},tokenChance:.08,tokenAmount:4,description:"5 players • Top-tier odds",className:"high"},
{id:"mega",name:"DA BOIZ MYTHICAL PACK",icon:"🌌",price:35000,pulls:1,odds:{Mythical:100},description:"Guaranteed Mythical player",className:"mega"}
];

const objectives=[
{rating:83,coins:5000,tokens:5},
{rating:88,coins:55000,tokens:10},
{rating:90,coins:65000,tokens:15},
{rating:93,coins:75000,tokens:20},
{rating:96,coins:80000,tokens:35}
];

const opponentTeams=[
{name:"GOATS XI",emoji:"🐐",scorers:["Cristiano Ronaldo","Lionel Messi","Kylian Mbappé","Phil Jones"]},
{name:"ICONS XI",emoji:"🌟",scorers:["Carles Puyol","Andriy Shevchenko","Zinedine Zidane","Diego Maradona"]},
{name:"BRONZE XI",emoji:"🥉",scorers:["Yaya Sithole","Diogo Dalot","Darwin Núñez"]}
];

let game;
try{game=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){}
if(!game||typeof game!=="object")game={};

game.coins=Number(game.coins??0);
game.tokens=Number(game.tokens??0);
game.owned=game.owned||{};
game.team=Array.isArray(game.team)?game.team:[null,null,null,null,null];
while(game.team.length<5)game.team.push(null);
game.team=game.team.slice(0,7);while(game.team.length<7)game.team.push(null);
game.formation=["2-2-1","1-3-1"].includes(game.formation)?game.formation:"2-2-1";
game.claimed=game.claimed||{};
objectives.forEach(o=>{if(typeof game.claimed[o.rating]!=="boolean")game.claimed[o.rating]=false});
game.potion=game.potion||null;
game.settings=game.settings||{};
game.settings.walkouts=game.settings.walkouts||{};
game.match=game.match&&typeof game.match==="object"?game.match:null;
game.lastMatch=game.lastMatch||null;
["Rare","Epic","Legendary","Icon","Mythical"].forEach(r=>{
if(typeof game.settings.walkouts[r]!=="boolean")game.settings.walkouts[r]=true;
});

let activeTab="shops";
let activeShopTab="packs";
let activeTeamTab="team";let isOpening=false;
let pickState=null;
let toastTimer,animationTimer,openingRun=0;
let matchInterval=null;
let celebratedGoals=new Set();
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(game))}catch(e){}}
function ownedCount(){return Object.values(game.owned).reduce((a,b)=>a+b,0)}
function getCard(id){return allCards.find(c=>c.id===id)}
function getOwned(){return Object.keys(game.owned).filter(id=>game.owned[id]>0).map(getCard).filter(Boolean)}
function teamCards(){return game.team.map(id=>id?getCard(id):null)}
function teamRating(){let t=teamCards();return t.length===5&&t.every(Boolean)?Math.round(t.reduce((s,c)=>s+c.rating,0)/5):0}
function money(n){return Math.round(n).toLocaleString("en-GB")}
function persistRender(){save();render()}
function opponentName(){return game.match?.opponent?.name||"GOATS XI"}
function opponentEmoji(){return game.match?.opponent?.emoji||"🐐"}

function toast(msg){
let t=document.getElementById("toast");
t.textContent=msg;
t.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

function cardHTML(c,actions=""){
return `<div class="card ${c.rarity}">
<div class="emoji">${c.emoji}</div>
<div class="rating">${c.rating}</div>
<div class="name">${c.name}</div>
<div class="rarity">${c.rarity}</div>${actions}</div>`;
}

function setTab(tab){
if(isOpening)return;
activeTab=tab;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
render();
}
function setShopTab(tab){if(isOpening)return;activeShopTab=tab;render()}
function setTeamTab(tab){if(isOpening)return;activeTeamTab=tab;render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function render(){
document.getElementById("coins").textContent=money(game.coins);
document.getElementById("tokens").textContent=money(game.tokens);
document.getElementById("teamRating").textContent=teamRating()||"—";
let content="";
if(activeTab==="shops"){
const shopViews={packs:renderPacks,luck:renderLuck,tokenshop:renderTokenShop};
content=`<div class="subnav">
<button data-shop-tab="packs" class="${activeShopTab==="packs"?"active":""}">🎁 Pack Shop</button>
<button data-shop-tab="luck" class="${activeShopTab==="luck"?"active":""}">🍀 Luck Shop</button>
<button data-shop-tab="tokenshop" class="${activeShopTab==="tokenshop"?"active":""}">🪙 Token Shop</button>
</div>${shopViews[activeShopTab]()}`;
}else if(activeTab==="teamhub"){
const teamViews={team:renderTeam,objectives:renderObjectives,album:renderAlbum};
content=`<div class="subnav">
<button data-team-tab="team" class="${activeTeamTab==="team"?"active":""}">⚽ Squad</button>
<button data-team-tab="objectives" class="${activeTeamTab==="objectives"?"active":""}">🏆 Team Objectives</button>
<button data-team-tab="album" class="${activeTeamTab==="album"?"active":""}">📚 Gallery</button>
</div>${teamViews[activeTeamTab]()}`;
}else if(activeTab==="sbcs"){content='<section><div class="sectionhero"><h2>♟️ CHESS</h2><p>Coming soon.</p></div></section>';}else content=renderSettings();
document.getElementById("app").innerHTML=content;
bindButtons();
updateMatchHUD();
}

function renderPacks(){
return `<section>
<div class="sectionhero"><h2>🎁 THE PACK STORE</h2><p>Open packs, discover rare players and build your ultimate squad. You can still open packs during a match!</p><span class="badge">🪙 ${money(game.coins)} COINS AVAILABLE</span></div>
<div class="grid">${packDefs.map(p=>`
<div class="pack ${p.className}">
<div class="packicon">${p.icon}</div><div class="packname">${p.name}</div>
<div class="price">${p.price===0?"FREE":"🪙 "+money(p.price)}</div>
<div class="packdesc">${p.description}</div>
<div class="packstats"><span>🃏 ${p.pulls} player${p.pulls===1?"":"s"}</span></div>
<div class="packfoot"><button data-openpack="${p.id}" ${game.coins<p.price?"disabled":""}>${game.coins<p.price?"NOT ENOUGH COINS":"OPEN PACK →"}</button></div>
</div>`).join("")}</div>
</section>`;
}

function renderTeam(){
const slots=game.team.map((id,i)=>{
const c=id?getCard(id):null;
const locked=game.match?.status==="running";
return `<div class="position"><span class="position-role">${positionNames[i]}</span><div class="small">POSITION ${i+1}</div>${c?`<div style="font-size:26px">${c.emoji}</div><b>${c.name}</b><div class="rating">${c.rating}</div><span class="badge">${c.rarity}</span>`:`<div style="font-size:25px">➕</div><b>Empty slot</b>`}<button data-slot="${i}" ${locked?"disabled":""}>${c?"CHANGE PLAYER":"SELECT PLAYER"}</button>${c?`<button class="secondary" data-clear="${i}" ${locked?"disabled":""}>REMOVE</button>`:""}</div>`;
}).join("");
const rows=game.formation==="1-3-1"?[[4],[1,2,3],[0]]:[[4],[3],[1,2],[0]];
const match=game.match;
const running=match?.status==="running";
const finished=match?.status==="finished";
const ready=game.team.length===5&&game.team.every(id=>id&&getCard(id));
let matchPanel="";
if(running){
const score=getMatchScore();const opp=opponentName();
matchPanel=`<div class="match-panel"><h3>⚽ DA BOIZ XI VS ${opp}!</h3><p>Your squad is locked until the final whistle. You can still open packs while the match is running.</p><div class="match-score">DA BOIZ XI ${score.home} - ${score.away} ${opp}</div><p style="text-align:center">Time elapsed: <b id="teamMatchClock">${Math.max(1,getMatchElapsed())}</b> / 90 seconds</p><div class="match-events">${match.events.filter(e=>e.time<=getMatchElapsed()).map(matchEventHTML).join("")||'<div class="match-event">⚽ Kick-off! No goals yet.</div>'}</div></div>`;
}else if(finished){
const score=getMatchScore();const result=score.home>score.away?"WIN":score.home<score.away?"LOSS":"DRAW";const reward=result==="WIN"?10:result==="DRAW"?4:0;const opp=opponentName();
matchPanel=`<div class="match-panel"><h3>🏁 FULL TIME!</h3><div class="match-score">DA BOIZ XI ${score.home} - ${score.away} ${opp}</div><p style="text-align:center" class="${result==="WIN"?"match-win":result==="LOSS"?"match-loss":"match-draw"}">${result==="WIN"?"🏆 YOU WON!":result==="LOSS"?"❌ YOU LOST!":"🤝 IT'S A DRAW!"}</p><p style="text-align:center">${reward?`You earned <b>${reward} tokens</b>!`:"No tokens earned this time."}</p><h3>Match events</h3><div class="match-events">${match.events.map(matchEventHTML).join("")||'<div class="match-event">No goals were scored.</div>'}</div><button class="match-play" data-claimmatch>CLAIM MATCH RESULT</button></div>`;
}else{
matchPanel=`<div class="match-panel"><h3>🏟️ QUICK MATCH</h3><p>Play a simulated 90-second match against a randomly selected team: GOATS XI, ICONS XI or BRONZE XI. It costs <b>3 tokens</b> to enter.</p><p>Win to earn <b>10 tokens</b>, draw to earn <b>4 tokens</b>, and lose to earn no tokens!</p><p>You'll need a complete five-player team. Your squad will be locked during the match, but you can still open packs.</p>${!ready?'<p class="match-loss">You need all 5 team positions filled before you can play.</p>':""}${game.tokens<3?'<p class="match-loss">You need at least 3 tokens to enter.</p>':""}<button class="match-play" data-startmatch ${!ready||game.tokens<3?"disabled":""}>⚽ START RANDOM MATCH — 3 TOKENS</button></div>`;
}
return `<section>
<div class="sectionhero"><h2>⚽ MY SQUAD</h2><p>Fill all five positions to calculate your team rating.</p><span class="badge">⭐ TEAM RATING: ${teamRating()||"NOT COMPLETE"}</span></div>
<div class="panel" style="margin-bottom:15px"><label><b>Formation:</b><select id="formation" ${running?"disabled":""}><option value="2-2-1" ${game.formation==="2-2-1"?"selected":""}>2-2-1</option><option value="1-3-1" ${game.formation==="1-3-1"?"selected":""}>1-3-1</option></select></label></div>
<div class="pitch"><div class="pitch-markings"><div class="center-line"></div><div class="center-circle"></div><div class="center-spot"></div><div class="penalty-box top"></div><div class="penalty-box bottom"></div><div class="goal-box top"></div><div class="goal-box bottom"></div></div>
${rows.map(row=>`<div class="pitchrow">${row.map(i=>{let c=game.team[i]?getCard(game.team[i]):null;return `<div class="position"><span class="position-role">${positionNames[i]}</span>${c?`${c.emoji}<br><b>${c.name}</b><br><strong>${c.rating} OVR</strong>`:`➕<br><b>${positionNames[i]} Empty</b>`}</div>`}).join("")}</div>`).join("")}
</div>${matchPanel}
<h2 style="margin-top:24px">Squad Positions</h2><div class="grid">${slots}</div>
<div class="panel" style="margin-top:17px"><h3>Your Players</h3><div class="playerlist">${getOwned().sort((a,b)=>b.rating-a.rating).map(c=>`<div class="playeroption"><span class="miniemoji">${c.emoji}</span><span class="playerinfo"><b>${c.name}</b><small>${c.rarity} • Owned: ${game.owned[c.id]}</small></span><span class="ovr">${c.rating}</span></div>`).join("")||"Open a pack to get your first player."}</div></div>
${game.lastMatch?`<div class="panel" style="margin-top:15px"><h3>Last match</h3><p>${game.lastMatch.result}: ${game.lastMatch.home} - ${game.lastMatch.away} ${game.lastMatch.opponent||"GOATS XI"} • ${game.lastMatch.reward} tokens earned</p></div>`:""}
</section>`;
}

function renderObjectives(){
let rating=teamRating();
return `<section><div class="sectionhero"><h2>🏆 TEAM OBJECTIVES</h2><p>Reach each team rating milestone to claim rewards once.</p></div><div class="grid">${objectives.map(o=>`<div class="objective"><span class="badge">TEAM RATING ${o.rating}+</span><h3 style="margin-top:12px">${o.rating} OVR Challenge</h3><div>🪙 ${money(o.coins)} coins</div><div>🪙 ${o.tokens} tokens</div><div class="bar"><span style="width:${Math.min(100,rating/o.rating*100)}%"></span></div><div class="small">Your team: ${rating||"—"} / ${o.rating}</div><button data-claim="${o.rating}" ${game.claimed[o.rating]||rating<o.rating?"disabled":""}>${game.claimed[o.rating]?"CLAIMED":"CLAIM REWARD"}</button></div>`).join("")}</div></section>`;
}

function renderLuck(){
let active=game.potion&&game.potion.until>Date.now();
return `<section><div class="sectionhero"><h2>🍀 LUCK SHOP</h2><p>Boost higher-rarity odds in regular packs for two minutes.</p></div><div class="grid">
<div class="shopitem"><div class="packicon">✨</div><h3>2x Luck Potion</h3><div class="price">🪙 20,000</div><p>Double your luck for 2 minutes.</p><button data-potion="2" ${game.coins<20000||active?"disabled":""}>BUY POTION</button></div>
<div class="shopitem"><div class="packicon">🌟</div><h3>5x Luck Potion</h3><div class="price">🪙 80,000</div><p>Five times your luck for 2 minutes.</p><button data-potion="5" ${game.coins<80000||active?"disabled":""}>BUY POTION</button></div>
<div class="panel"><h3>Current boost</h3><div class="rating">${active?game.potion.multiplier+"x":"1x"}</div><p>${active?"Time left: "+Math.ceil((game.potion.until-Date.now())/1000)+" seconds":"No active potion"}</p></div>
</div></section>`;
}

function renderTokenShop(){

function createMatch(){
if(game.match){toast("You already have a match in progress!");return}
if(!teamCards().every(Boolean)){toast("You need a full five-player team!");return}
if(game.tokens<3){toast("You need 3 tokens to play!");return}
game.tokens-=3;const squad=teamCards();const opponent=opponentTeams[Math.floor(Math.random()*opponentTeams.length)];
const homeGoals=Math.min(5,Math.max(0,Math.floor(Math.random()*5)));const awayGoals=Math.min(5,Math.max(0,Math.floor(Math.random()*5)));
const events=[];const usedTimes=new Set();
function randomTime(){let t;do{t=5+Math.floor(Math.random()*81)}while(usedTimes.has(t));usedTimes.add(t);return t}
for(let i=0;i<homeGoals;i++){const scorer=squad[Math.floor(Math.random()*squad.length)];events.push({time:randomTime(),side:"home",scorer:scorer.name})}
for(let i=0;i<awayGoals;i++){const scorer=opponent.scorers[Math.floor(Math.random()*opponent.scorers.length)];events.push({time:randomTime(),side:"away",scorer})}
events.sort((a,b)=>a.time-b.time);const now=Date.now();
game.match={status:"running",startAt:now,endAt:now+90000,opponent:{name:opponent.name,emoji:opponent.emoji,scorers:opponent.scorers},events,teamSnapshot:squad.map(c=>({name:c.name,rating:c.rating,emoji:c.emoji}))};

document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="teamhub"));

function weightedRarity(odds){
let entries=Object.entries(odds).filter(x=>x[1]>0);let total=entries.reduce((s,x)=>s+x[1],0);let n=Math.random()*total;
for(let [r,w] of entries){n-=w;if(n<=0)return r}
return entries[0][0];
}
function weightedCard(pool,weights={},exclude=new Set()){
let choices=pool.filter(c=>!exclude.has(c.id));if(!choices.length)choices=pool;
let ws=choices.map(c=>weights[c.rarity]??1);let total=ws.reduce((a,b)=>a+b,0);let n=Math.random()*total;
for(let i=0;i<choices.length;i++){n-=ws[i];if(n<=0)return choices[i]}
return choices[choices.length-1];
}
function normalPick(pack){
if(pack.id==="mega"){
const weights=mythical.map(c=>c.rating===99?0.1:8.3);const total=weights.reduce((a,b)=>a+b,0);let n=Math.random()*total;
for(let i=0;i<mythical.length;i++){n-=weights[i];if(n<0)return mythical[i]}
return mythical[mythical.length-1];
}
let odds={...pack.odds};
if(game.potion&&game.potion.until>Date.now()){
let m=game.potion.multiplier;Object.keys(odds).forEach(r=>{if(r!=="Common")odds[r]*=m});
let sum=Object.values(odds).reduce((a,b)=>a+b,0);Object.keys(odds).forEach(r=>odds[r]=odds[r]/sum*100);
}
let rarity=weightedRarity(odds);let pool=cards.filter(c=>c.rarity===rarity);if(!pool.length)pool=cards.filter(c=>c.rarity!=="Icon");
return pool[Math.floor(Math.random()*pool.length)];
}

mythical.forEach(c=>{if(c.rating>=96){c.rarity="Aura";c.aura=true}});
allCards.forEach(c=>{if(mythical.some(m=>m.id===c.id)&&c.rating>=96){c.rarity="Aura";c.aura=true}});

 {id:"high",name:"LOW T PACK",icon:"📦",price:0,pulls:5,odds:{Common:55,Uncommon:20,Rare:9,Epic:4,Legendary:.1,Icon:.005},description:"DA BOIZ: Built different. Every pull tells a story.",className:"low"},
 {id:"mega",name:"DA BOIZ MYTHICAL PACK",icon:"🌌",price:35000,pulls:1,odds:{Mythical:99.95,Aura:.05},description:"DA BOIZ: Legends aren’t found. They’re packed.",className:"mega"},
 {id:"winter",name:"WINTER WILDCARDS",icon:"❄️",price:12000,pulls:2,description:"DA BOIZ: Through every storm, legends rise.",className:"winter"}
);
normalPick=function(pack){
 if(pack.id==="mega"){
  const rarity=weightedRarity(pack.odds||{});
  const pool=rarity==="Aura"?auraCards:mythical.filter(c=>c.rarity==="Mythical");
  if(!pool.length)throw new Error("No players configured for rarity: "+rarity);
  return pool[Math.floor(Math.random()*pool.length)];
 }
 if(pack.id==="high"){
  const odds={Common:55,Uncommon:20,Rare:9,Epic:4,Legendary:.1,Icon:.005};
  const total=Object.values(odds).reduce((sum,value)=>sum+value,0);
  if(Math.random()*100>=total)return null; // Remaining 11.895% awards 1 token instead of a player.
  const rarity=weightedRarity(odds);
  const pool=cards.filter(c=>c.rarity===rarity&&!c.promo&&!c.exclusive);
  if(!pool.length)throw new Error("No LOW T players configured for rarity: "+rarity);
  return pool[Math.floor(Math.random()*pool.length)];
 }
 if(pack.id==="winter")return window.daBoizWinterPack.pick();
 const rarity=weightedRarity(pack.odds||{});
 const pool=cards.filter(c=>c.rarity===rarity&&!c.promo&&!c.exclusive);
 if(!pool.length)throw new Error("No players configured for rarity: "+rarity);
 return pool[Math.floor(Math.random()*pool.length)];
};
function awardPackTokens(){
 if(Math.random()>=0.04)return 0;
 game.tokens=(Number(game.tokens)||0)+2;
 return 2;
}
function duplicateSellValue(c){
 if(c.rarity==="Common"||c.rarity==="Uncommon")return 0;
 if(c.rarity==="Rare")return 500;
 if(c.rarity==="Epic")return 1000;
 if(c.rarity==="Legendary")return 3000;
 return 10000;
}
award=function(c){
 game.owned=game.owned&&typeof game.owned==="object"?game.owned:{};
 const copies=Math.max(0,Number(game.owned[c.id])||0);
 if(copies>0){game.coins=(Number(game.coins)||0)+duplicateSellValue(c);return true}
 game.owned[c.id]=1;return false;
};
function awardPackCard(c){
 game.owned=game.owned&&typeof game.owned==="object"?game.owned:{};
 const copies=parseInt(game.owned[c.id],10)||0;
 if(copies>0){const value=duplicateSellValue(c);game.coins=(Number(game.coins)||0)+value;return {duplicate:true,value}}
 game.owned[c.id]=1;return {duplicate:false,value:0};
}
revealCardElement=function(c,isDuplicate=false,index=0){

 const card=document.createElement("div");card.innerHTML=cardHTML(c);wrap.appendChild(card.firstElementChild);
 return wrap;
};

openWinter=function(){return openPack("winter");};
openPack=function(id){
 if(isOpening)return;
 const pack=packDefs.find(p=>p.id===id);
 if(!pack)return toast("Pack unavailable.");
 if(game.coins<pack.price)return toast("Not enough coins.");
 const oldCoins=Number(game.coins)||0,oldTokens=Number(game.tokens)||0,oldOwned={...(game.owned||{})};
 try{
  const pulls=Array.from({length:pack.pulls},()=>normalPick(pack));
  const tokenPulls=pulls.filter(c=>c===null).length;
  const results=pulls.filter(Boolean);
  if(results.length+tokenPulls!==pack.pulls)throw new Error("Pack reward pool invalid");
  if(id==="winter"&&results.length!==2)throw new Error("Winter pack did not produce two players");
  game.coins=oldCoins-pack.price;
  isOpening=true;
  game.tokens=oldTokens+tokenPulls;
  const saleResults=results.map(c=>awardPackCard(c));
  const duplicateFlags=saleResults.map(x=>x.duplicate);
  const sold=saleResults.reduce((sum,x)=>sum+x.value,0);
  const bonusTokens=awardPackTokens();
  if(id==="winter"&&window.daBoizWinterPack.cards.every(c=>(game.owned[c.id]||0)>0)){
   const special=window.daBoizWinterPack.snowLiam;
   game.owned[special.id]=Math.max(1,Number(game.owned[special.id])||0);
  }
  save();
  const tokenText=tokenPulls?" • +"+tokenPulls+" token"+(tokenPulls===1?"":"s"):"";
  const coinText=sold?" • +"+money(sold)+" coins":"";
  const bonusText=bonusTokens?" • BONUS: +2 tokens!":"";
  showReveal({title:pack.name,subtitle:results.length+" player"+(results.length===1?"":"s")+" in your pack"+tokenText+coinText+bonusText,results,duplicateFlags,walkouts:true});
 }catch(err){
  game.coins=oldCoins;game.tokens=oldTokens;game.owned=oldOwned;isOpening=false;save();
  console.error("Pack opening failed ("+id+"):",err);
  toast("Pack opening failed — coins returned. Please try again.");
  render();
 }
};
renderPacks=function(){
 const coins=Number(game.coins)||0;
 const packs=Array.isArray(packDefs)?packDefs:[];
 const safeMoney=value=>typeof money==="function"?money(Number(value)||0):String(Number(value)||0);
 const cards=packs.map((p,index)=>{
  const id=String(p.id||("pack-"+index)),price=Number(p.price)||0,pulls=Math.max(1,Number(p.pulls)||1);
  const name=String(p.name||"PACK"),description=String(p.description||"Open this pack to discover players.");
  const icon=String(p.icon||"🎁"),className=String(p.className||"");
  const locked=coins<price;
  const odds=String(p.description||"");
  return '<div class="pack '+className+'"><div class="packicon">'+icon+'</div><div class="packname">'+name+'</div><div class="price">'+(price===0?"FREE":"🪙 "+safeMoney(price))+'</div><div class="packdesc">'+description+'</div><div class="packstats"><span>🃏 '+pulls+' pulls</span></div><div class="packfoot"><button data-openpack="'+id+'" '+(locked?"disabled":"")+'>'+(locked?"NOT ENOUGH COINS":"OPEN PACK →")+'</button></div></div>';
 }).join("");
 return '<section><div class="sectionhero"><h2>🎁 THE PACK STORE</h2><p>Open packs, discover rare players and build your ultimate squad.</p><span class="badge">🪙 '+safeMoney(coins)+' COINS AVAILABLE</span></div><div class="grid">'+(cards||'<div class="panel">No packs are currently configured.</div>')+'</div></section>';
};
renderAlbum=function(){
 const rarities=["Common","Uncommon","Rare","Epic","Legendary","Icon","Mythical","Aura","Winter Wildcards"];
 const groups=rarities.map(r=>{
  const set=allCards.filter(c=>c.rarity===r);if(!set.length)return "";
  const found=set.filter(c=>(game.owned[c.id]||0)>0).length,pct=Math.round(found/set.length*100);
  let reward="No set reward";if(r==="Common")reward="2,000 coins";if(r==="Uncommon")reward="6,000 coins";if(r==="Rare")reward="8,000 coins";if(r==="Epic")reward="10,000 coins";if(r==="Legendary")reward="10 tokens";if(r==="Icon")reward="10 tokens + 5,000 coins";if(r==="Mythical")reward="Exclusive Mythical Jacky Chan (99)";if(r==="Aura")reward="20 tokens + 10,000 coins";if(r==="Winter Wildcards")reward="Collect all 13 to unlock Liam Snowtherland (99)";
  const canClaim=["Common","Uncommon","Rare","Epic","Legendary","Icon","Mythical","Aura"].includes(r)&&found===set.length&&!game.galleryClaims[r];
  const cardsHtml=set.map(c=>{const count=game.owned[c.id]||0;return count?cardHTML(c,`<div class="small">Collected • Copies: ${count}</div>`):`<div class="card ${c.rarity}" style="opacity:.48;filter:grayscale(.85)"><div class="emoji">❔</div><div class="rating">?</div><div class="name">Undiscovered</div><div class="rarity">${c.rarity}</div></div>`}).join("");
  return `<div class="panel gallery-set"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>${r} Set</h2><b>${found}/${set.length} • ${pct}%</b></div><p>Set reward: <b>${reward}</b></p><div class="bar"><span style="width:${pct}%"></span></div>${canClaim?`<button data-gallery-claim="${r}">CLAIM SET REWARD</button>`:""}<div class="grid" style="margin-top:14px">${cardsHtml}</div></div>`;
 }).join("");
 return `<section><div class="sectionhero"><h2>📚 THE GALLERY</h2><p>Every card is shown in its rarity set. Discover cards to reveal them and track your collection.</p></div>${groups}</section>`;
};

render=function(){
 const app=document.getElementById("app");
 if(!app)return;
 const coins=document.getElementById("coins"),tokens=document.getElementById("tokens"),rating=document.getElementById("teamRating");
 if(coins)coins.textContent=money(game.coins);
 if(tokens)tokens.textContent=money(game.tokens);
 if(rating)rating.textContent=teamRating()||"—";
 if(activeTab==="shops"){
  if(!["packs","luck","tokenshop"].includes(activeShopTab))activeShopTab="packs";
  let shopContent="";
  try{
   if(activeShopTab==="packs"){
    const defs=Array.isArray(packDefs)?packDefs:[];
    const balance=Number(game.coins)||0;
    const fmt=n=>{try{return typeof money==="function"?money(Number(n)||0):String(Number(n)||0)}catch(e){return String(Number(n)||0)}};
    const packCards=defs.map((p,i)=>{
     const id=String(p&&p.id||("pack-"+i)),price=Number(p&&p.price)||0,pulls=Math.max(1,Number(p&&p.pulls)||1);
     const name=String(p&&p.name||"PACK"),desc=String(p&&p.description||"Open to discover players.");
     const icon=String(p&&p.icon||"🎁"),cls=String(p&&p.className||"");
     const locked=balance<price;
     return '<div class="pack '+cls+'"><div class="packicon">'+icon+'</div><div class="packname">'+name+'</div><div class="price">'+(price===0?"FREE":"🪙 "+fmt(price))+'</div><div class="packdesc">'+desc+'</div><div class="packstats"><span>🃏 '+pulls+' players</span></div><div class="packfoot"><button data-openpack="'+id+'" '+(locked?"disabled":"")+'>'+(locked?"NOT ENOUGH COINS":"OPEN PACK →")+'</button></div></div>';
    }).join("");
    shopContent='<section><div class="sectionhero"><h2>🎁 THE PACK STORE</h2><p>Open packs, discover rare players and build your ultimate squad.</p><span class="badge">🪙 '+fmt(balance)+' COINS AVAILABLE</span></div><div class="grid">'+(packCards||'<div class="panel">No packs are currently configured.</div>')+'</div></section>';
   }else{

   shopContent='<section class="panel"><h2>Shop loading error</h2><p>This shop screen hit an error. Other shop screens remain available.</p></section>';
  }
  app.innerHTML='<div class="subnav"><button data-shop-tab="packs" class="'+(activeShopTab==="packs"?"active":"")+'">🎁 Pack Shop</button><button data-shop-tab="luck" class="'+(activeShopTab==="luck"?"active":"")+'">🍀 Luck Shop</button><button data-shop-tab="tokenshop" class="'+(activeShopTab==="tokenshop"?"active":"")+'">🪙 Token Shop</button></div>'+shopContent;
 }else if(activeTab==="sbcs"){
  app.innerHTML=chessRewardHTML();
 }else{
  previousRender();
 }
 document.querySelectorAll("nav button[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab));

 if(!ids.length||!ids.every(c=>(game.owned[c.id]||0)>0)){toast("Discover every "+r+" player first.");return}
