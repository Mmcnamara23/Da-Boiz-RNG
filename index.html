<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA BOIZ RNG</title>
<style>
:root{
--bg:#080b14;
--panel:#111827;
--panel2:#172033;
--purple:#8b5cf6;
--gold:#fbbf24;
--text:#f8fafc;
--muted:#a1abc0;
--border:#29364d;
--green:#22c55e;
--radius:18px;
--shadow:0 16px 40px #0005;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:
radial-gradient(ellipse at 50% -15%,#283c68 0%,transparent 48%),
radial-gradient(ellipse at 100% 40%,#24134255,transparent 40%),
linear-gradient(180deg,#0b1020,#080b14 65%);
color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
min-height:100vh;
line-height:1.5;
}
button,input,select{font:inherit}
button{
cursor:pointer;
border:1px solid #a78bfa55;
border-radius:12px;
padding:12px 17px;
font-weight:850;
letter-spacing:.2px;
background:linear-gradient(135deg,#9b7bff,#6d3bd1);
color:white;
box-shadow:0 5px 16px #6d3bd133,inset 0 1px #ffffff25;
transition:transform .18s ease,filter .18s ease,box-shadow .18s ease,border-color .18s ease;
}
button:hover:not(:disabled){
filter:brightness(1.13);
transform:translateY(-2px);
box-shadow:0 9px 23px #7c3aed44,inset 0 1px #ffffff30;
}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{
outline:3px solid #c4b5fd;
outline-offset:3px;
}
button:disabled{
opacity:.38;
cursor:not-allowed;
filter:saturate(.5);
transform:none;
box-shadow:none;
}
input,select{
background:#0c1220;
color:white;
border:1px solid #34415b;
border-radius:11px;
padding:11px 13px;
}
input:focus,select:focus{border-color:#a78bfa;outline:none}
header{
padding:19px 4%;
background:#0a1020eF;
border-bottom:1px solid #34415b;
position:sticky;
top:0;
z-index:5;
backdrop-filter:blur(20px);
box-shadow:0 8px 30px #0003;
}
.headtop{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{
font-size:clamp(24px,4vw,39px);
font-weight:1000;
letter-spacing:1.5px;
background:linear-gradient(100deg,#fff 10%,#c4b5fd 48%,#fcd34d 90%);
background-clip:text;
-webkit-background-clip:text;
color:transparent;
filter:drop-shadow(0 4px 15px #8b5cf633);
}
.stats,nav{display:flex;gap:9px;flex-wrap:wrap}
.stat{
background:linear-gradient(145deg,#1c2940,#111a2c);
border:1px solid #3a4964;
padding:10px 14px;
border-radius:13px;
font-weight:850;
font-size:14px;
box-shadow:inset 0 1px #ffffff0c;
}
nav{
overflow-x:auto;
padding-top:17px;
scrollbar-width:thin;
}
nav button{
white-space:nowrap;
background:#151f32;
color:#b9c5da;
border:1px solid #35445e;
flex:1;
min-width:100px;
font-size:14px;
box-shadow:none;
}
nav button.active{
background:linear-gradient(135deg,#9067f5,#6334c3);
color:white;
border-color:#bba4ff;
box-shadow:0 5px 18px #7c3aed55,inset 0 1px #ffffff35;
}
.subnav{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-bottom:20px;
padding:9px;
background:#0e1727;
border:1px solid #2d3c55;
border-radius:15px;
box-shadow:inset 0 1px #ffffff08;
}
.subnav button{
flex:1;
min-width:120px;
background:#1a263b;
color:#b9c5da;
border:1px solid #35445e;
box-shadow:none;
}
.subnav button.active{
background:linear-gradient(135deg,#9067f5,#6334c3);
color:white;
border-color:#bba4ff;
}
main{max-width:1320px;margin:auto;padding:28px 4% 70px}
h2{margin:0 0 16px;font-size:clamp(22px,3vw,29px);letter-spacing:-.5px;line-height:1.2}
h3{margin:0 0 10px;font-size:18px;letter-spacing:-.2px}
p{color:var(--muted);line-height:1.65}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:17px;
}
.panel,.pack,.objective,.setting,.shopitem{
background:linear-gradient(145deg,#19253a,#101827);
border:1px solid #34445f;
border-radius:var(--radius);
padding:19px;
box-shadow:var(--shadow),inset 0 1px #ffffff09;
}
.panel,.objective,.setting,.shopitem{transition:border-color .2s,transform .2s,box-shadow .2s}
.panel:hover,.objective:hover,.shopitem:hover{
border-color:#687ba0;
box-shadow:0 18px 42px #0005,inset 0 1px #ffffff0c;
}
.sectionhero{
background:
radial-gradient(circle at 90% 0%,#9b7bff25,transparent 35%),
linear-gradient(120deg,#202d4b,#131d31 60%,#1d1835);
border:1px solid #485b7c;
border-radius:21px;
padding:24px;
margin-bottom:19px;
box-shadow:0 15px 38px #0003,inset 0 1px #ffffff12;
position:relative;
overflow:hidden;
}
.sectionhero:after{
content:"";
position:absolute;
right:-50px;
bottom:-95px;
width:210px;
height:210px;
border-radius:50%;
border:1px solid #ffffff0b;
box-shadow:0 0 0 22px #ffffff04,0 0 0 44px #ffffff03;
pointer-events:none;
}
.tokenhero{
background:
radial-gradient(circle at 90% 0%,#fbbf2430,transparent 35%),
linear-gradient(120deg,#443019,#211b2c 58%,#171b30);
border-color:#80633b;
}
.pack{
position:relative;
overflow:hidden;
min-height:285px;
display:flex;
flex-direction:column;
gap:12px;
isolation:isolate;
transition:transform .2s,border-color .2s,box-shadow .2s;
}
.pack:hover{transform:translateY(-4px);box-shadow:0 20px 45px #0006}
.pack:before{
content:"";
position:absolute;
width:210px;
height:210px;
border-radius:50%;
background:var(--glow,#8b5cf633);
filter:blur(35px);
right:-80px;
top:-85px;
z-index:-1;
}
.pack>*{position:relative}
.pack.low{--glow:#60a5fa66;border-color:#3b82f688}
.pack.mid{--glow:#a78bfa77;border-color:#8b5cf688}
.pack.high{--glow:#ec489977;border-color:#ec489988}
.pack.mega{--glow:#22d3ee77;border-color:#22d3ee99}
.packicon{font-size:48px;filter:drop-shadow(0 6px 12px #0006)}
.packname{font-size:19px;font-weight:1000;letter-spacing:.2px}
.price{font-size:24px;font-weight:1000;color:#fcd46b;text-shadow:0 2px 12px #fbbf2420}
.packdesc{font-size:13px;color:#c0cce0;min-height:35px}
.packfoot{margin-top:auto}
.packfoot button{width:100%;padding:14px}
.packstats{display:flex;gap:7px;flex-wrap:wrap}
.packstats span{
background:#ffffff0b;
border:1px solid #ffffff18;
padding:7px 9px;
border-radius:9px;
font-size:11px;
color:#d8e0ef;
}
.shopitem{
position:relative;
overflow:hidden;
display:flex;
flex-direction:column;
gap:11px;
min-height:275px;
}
.shopitem .packicon{font-size:42px}
.shopitem p{font-size:13px;min-height:50px;margin:0}
.shopitem button{margin-top:auto;width:100%}
.badge{
display:inline-block;
padding:7px 10px;
border-radius:9px;
background:#ffffff0d;
border:1px solid #ffffff20;
font-size:10px;
letter-spacing:1px;
font-weight:950;
color:#dce5f5;
}
.card{
border:2px solid #53627b;
border-radius:17px;
padding:15px;
background:linear-gradient(155deg,#25324a,#111827 72%);
text-align:center;
position:relative;
overflow:hidden;
min-width:0;
box-shadow:0 10px 24px #0003,inset 0 1px #ffffff12;
transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 15px 28px #0005,inset 0 1px #ffffff15}
.card:before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(130deg,#ffffff0b,transparent 40%);
pointer-events:none;
}
.card .emoji{font-size:40px;margin:9px 0 6px;filter:drop-shadow(0 5px 9px #0005)}
.card .name{font-size:14px;font-weight:950;overflow-wrap:anywhere;line-height:1.35;margin-top:4px}
.rating{font-size:30px;font-weight:1000;line-height:1.1;text-shadow:0 3px 15px #0006}
.rarity{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:950;margin:9px 0 3px}
.Common{border-color:#94a3b8}
.Common .rarity{color:#cbd5e1}
.Uncommon{border-color:#4ade80}
.Uncommon .rarity{color:#4ade80}
.Rare{border-color:#60a5fa;box-shadow:0 0 18px #60a5fa20,0 10px 24px #0003}
.Rare .rarity{color:#60a5fa}
.Epic{border-color:#c084fc;box-shadow:0 0 18px #a855f722,0 10px 24px #0003}
.Epic .rarity{color:#d8b4fe}
.Legendary{border-color:#fbbf24;box-shadow:0 0 22px #fbbf2428,0 10px 24px #0003}
.Legendary .rarity{color:#fcd34d}
.Icon{border-color:#fb7185;box-shadow:0 0 22px #fb71852b,0 10px 24px #0003}
.Icon .rarity{color:#fda4af}
.Mythical{border-color:#22d3ee;box-shadow:0 0 24px #22d3ee30,0 10px 24px #0003}
.Mythical .rarity{color:#67e8f9}
.card.selected{outline:3px solid var(--gold);transform:translateY(-3px)}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.card-actions button{flex:1;padding:9px 5px;font-size:12px}
.secondary{
background:linear-gradient(145deg,#27354c,#1a2639);
border:1px solid #53627b;
color:#e0e8f5;
box-shadow:none;
}
.secondary:hover:not(:disabled){background:#354560;box-shadow:0 7px 18px #0003}
.gold{
background:linear-gradient(135deg,#facc15,#d97706);
color:#201300;
border-color:#fcd34d;
}
.small{font-size:12px;color:var(--muted)}
.bar{
height:10px;
background:#26334a;
border:1px solid #3b4b66;
border-radius:20px;
overflow:hidden;
margin:11px 0;
}
.bar span{
height:100%;
display:block;
background:linear-gradient(90deg,#8b5cf6,#c084fc,#f0abfc);
border-radius:20px;
box-shadow:0 0 12px #a78bfa88;
}
.pitch{
position:relative;
overflow:hidden;
background:
linear-gradient(#ffffff08 1px,transparent 1px),
repeating-linear-gradient(90deg,#176b42 0 55px,#1c7549 55px 110px);
background-size:100% 50px,auto;
border:3px solid #64b78b;
border-radius:22px;
padding:24px 18px;
min-height:360px;
display:flex;
flex-direction:column;
justify-content:space-around;
gap:12px;
box-shadow:0 15px 35px #0004,inset 0 0 35px #001d0f55;
}
.pitch-markings{position:absolute;inset:10px;border:2px solid #d5f7e7aa;pointer-events:none;z-index:0;border-radius:5px}
.center-line{position:absolute;left:0;right:0;top:50%;border-top:2px solid #d5f7e7aa}
.center-circle{position:absolute;width:95px;height:95px;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #d5f7e7aa;border-radius:50%}
.center-spot{position:absolute;width:7px;height:7px;left:50%;top:50%;transform:translate(-50%,-50%);background:#e7fff2;border-radius:50%}
.penalty-box{position:absolute;left:22%;width:56%;height:17%;border:2px solid #d5f7e7aa}
.penalty-box.top{top:-2px;border-top:0}
.penalty-box.bottom{bottom:-2px;border-bottom:0}
.goal-box{position:absolute;left:37.5%;width:25%;height:7%;border:2px solid #d5f7e7aa}
.goal-box.top{top:-2px;border-top:0}
.goal-box.bottom{bottom:-2px;border-bottom:0}
.pitchrow{position:relative;z-index:1;display:flex;justify-content:space-evenly;gap:10px;flex-wrap:wrap}
.position{
background:linear-gradient(145deg,#123d31ee,#102c26ee);
border:1px solid #8bd6a8;
border-radius:14px;
padding:11px;
min-width:115px;
flex:1;
text-align:center;
box-shadow:0 7px 16px #0004,inset 0 1px #ffffff18;
}
.position button{margin-top:8px;padding:8px;font-size:12px;width:100%}
.position-role{display:block;font-size:12px;font-weight:1000;letter-spacing:2px;color:#b7ffd0;margin-bottom:5px}
.playerlist{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:10px;
max-height:55vh;
overflow:auto;
padding:5px;
}
.playeroption{
display:flex;
align-items:center;
gap:10px;
text-align:left;
background:linear-gradient(145deg,#202e45,#141e30);
border:1px solid #3b4b66;
border-radius:13px;
padding:11px;
color:white;
transition:.18s;
}
.playeroption:hover{border-color:#a78bfa;background:#27344d}
.playeroption .miniemoji{font-size:25px}
.playerinfo{flex:1;min-width:0}
.playerinfo b{display:block;overflow-wrap:anywhere;font-size:13px}
.playerinfo small{color:var(--muted)}
.ovr{font-size:20px;font-weight:1000;color:var(--gold)}
.playeroption.active{border-color:var(--gold);background:#493617}.overlay{
position:fixed;
inset:0;
background:#030712ed;
backdrop-filter:blur(13px);
z-index:20;
display:none;
overflow:auto;
padding:20px;
align-items:center;
justify-content:center;
}
.overlay.show{display:flex}
.modal{
width:min(100%,1000px);
background:
radial-gradient(circle at 90% 0%,#8b5cf622,transparent 35%),
linear-gradient(145deg,#1b2940,#0d1524);
border:1px solid #52627e;
border-radius:23px;
padding:24px;
box-shadow:0 25px 90px #000b,0 0 60px #8b5cf622;
max-height:94vh;
overflow:auto;
}
.modalhead{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:18px;
}
.revealgrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
gap:13px;
}
.revealcard{min-width:0}
.revealcard.hidden-reveal{opacity:0;transform:scale(.65);pointer-events:none;visibility:hidden}
.revealcard.card-revealed{visibility:visible;animation:flipin .4s ease both}
.card-status{
font-size:12px;
font-weight:1000;
letter-spacing:1px;
text-align:center;
margin-bottom:8px;
padding:8px;
border-radius:9px;
}
.card-status.new{background:#14532d;color:#86efac;border:1px solid #22c55e}
.card-status.dupe{background:#713f12;color:#fde68a;border:1px solid #f59e0b}
.storage-button{
width:100%;
margin-top:9px;
background:linear-gradient(135deg,#0f766e,#115e59);
font-size:11px;
padding:10px 5px;
}
.storage-sell-button{
width:100%;
margin-top:10px;
background:linear-gradient(135deg,#facc15,#d97706);
color:#201300;
font-size:12px;
padding:11px;
}
#revealStorageStatus{font-size:12px;color:#fcd34d;font-weight:900;margin-top:7px}
#walkoutBanner{text-align:center;min-height:65px}
.walkouttitle{
font-size:clamp(28px,6vw,58px);
font-weight:1000;
letter-spacing:2px;
text-align:center;
margin:18px 0;
color:white;
text-shadow:0 5px 25px #8b5cf655;
}
.walkout-subtitle{
text-align:center;
font-weight:1000;
letter-spacing:2px;
margin-bottom:20px;
color:#eee;
animation:rarityAppear .45s ease both;
}
.walkout-mode{background:radial-gradient(ellipse at center,#21143a 0%,#05030df5 78%)}
.pack-rest-title{
text-align:center;
font-weight:1000;
font-size:24px;
margin:20px 0;
animation:titleSlam .4s both;
}
.pickhint{text-align:center;color:var(--gold);font-weight:900;margin:12px 0;min-height:18px}
.walkout-flip{perspective:1000px;width:100%;max-width:250px;height:330px;margin:15px auto}
.flip-inner{position:relative;width:100%;height:330px;transform-style:preserve-3d}
.flip-inner.flip-now{animation:cardFlip .9s ease-in-out forwards}
.flip-back,.flip-front{
position:absolute;
inset:0;
width:100%;
height:330px;
min-height:330px;
box-sizing:border-box;
border-radius:18px;
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
}
.flip-back{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
background:linear-gradient(145deg,#30204e,#100d1b);
border:3px solid #8b5cf6;
box-shadow:0 0 35px #8b5cf655;
font-size:65px;
}
.flip-back span{font-size:16px;font-weight:1000;letter-spacing:3px}
.flip-front{transform:rotateY(180deg)}
.flip-front .card{
width:100%;
height:100%;
min-height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}
.walkout-flip.Rare .flip-back{border-color:#60a5fa}
.walkout-flip.Epic .flip-back{border-color:#c084fc}
.walkout-flip.Legendary .flip-back{border-color:#fbbf24}
.walkout-flip.Icon .flip-back{border-color:#fb7185}
.walkout-flip.Mythical .flip-back{border-color:#22d3ee}
@keyframes cardFlip{0%{transform:rotateY(0deg)}100%{transform:rotateY(180deg)}}
@keyframes rarityAppear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes flipin{from{opacity:0;transform:rotateY(35deg)}to{opacity:1;transform:rotateY(0)}}
@keyframes titleSlam{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
.toast{
position:fixed;
bottom:22px;
left:50%;
transform:translateX(-50%);
background:linear-gradient(145deg,#26334d,#111b2d);
border:1px solid #9270e9;
padding:14px 20px;
border-radius:14px;
z-index:50;
display:none;
box-shadow:0 12px 40px #0009;
max-width:90vw;
text-align:center;
font-weight:750;
}
.toast.show{display:block;animation:flipin .2s}
.setting{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}
.setting input{width:20px;height:20px;accent-color:#8b5cf6}
footer{
text-align:center;
color:#77849c;
padding:28px;
border-top:1px solid #29364d;
background:#090f1b;
font-size:13px;
letter-spacing:.5px;
}
.match-hud{
display:none;
margin-top:15px;
background:linear-gradient(100deg,#173e2d,#21143a);
border:1px solid #65d99a;
border-radius:14px;
padding:13px 16px;
align-items:center;
justify-content:space-between;
gap:12px;
flex-wrap:wrap;
box-shadow:0 8px 25px #0003;
}
.match-hud.visible{display:flex}
.match-hud strong{font-size:17px}
.match-clock{font-size:24px;font-weight:1000;color:var(--gold)}
.match-panel{
margin:18px 0;
background:linear-gradient(145deg,#162e26,#171326);
border:1px solid #4b936e;
border-radius:18px;
padding:20px;
box-shadow:var(--shadow);
}
.match-panel h3{font-size:20px}
.match-score{font-size:clamp(25px,5vw,38px);font-weight:1000;text-align:center;margin:14px}
.match-events{max-height:190px;overflow:auto;margin-top:12px}
.match-event{
padding:10px 12px;
margin:7px 0;
background:#ffffff0b;
border:1px solid #ffffff16;
border-radius:10px;
font-size:13px;
}
.match-win{color:#4ade80;font-weight:900}
.match-loss{color:#fb7185;font-weight:900}
.match-draw{color:var(--gold);font-weight:900}
.match-play{
width:100%;
padding:16px;
font-size:16px;
margin-top:12px;
background:linear-gradient(135deg,#16a34a,#047857);
border-color:#4ade80;
}
body.goal-shake{animation:screenShake .45s ease}
@keyframes screenShake{
0%,100%{transform:translateX(0)}
15%{transform:translateX(-9px) rotate(-.5deg)}
30%{transform:translateX(9px) rotate(.5deg)}
45%{transform:translateX(-7px)}
60%{transform:translateX(7px)}
75%{transform:translateX(-3px)}
}
.goal-flash{
position:fixed;
inset:0;
z-index:60;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
background:#ffd16622;
animation:goalFlash .9s ease forwards;
}
.goal-flash-text{
font-size:clamp(55px,14vw,125px);
font-weight:1000;
font-style:italic;
letter-spacing:4px;
color:#ffd166;
text-shadow:0 0 15px #ff8c00,0 0 40px #ff8c00,5px 7px 0 #5b2600;
animation:goalSlam .9s ease forwards;
text-align:center;
}
@keyframes goalFlash{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes goalSlam{0%{transform:scale(.2) rotate(-12deg);opacity:0}25%{transform:scale(1.2) rotate(4deg);opacity:1}45%{transform:scale(1) rotate(0)}100%{transform:scale(1.1);opacity:0}}
@media(max-width:700px){
header{padding:14px 4%}
.headtop{align-items:flex-start}
.stats{width:100%}
.stat{padding:9px 10px;font-size:12px;flex:1;text-align:center}
main{padding-top:19px}
.grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.panel,.pack,.objective,.setting,.shopitem{padding:15px}
.sectionhero{padding:19px}
.pack{min-height:270px}
.modal{padding:15px}
.position{min-width:100px}
.walkout-flip{max-width:230px}

game.owned=game.owned||{};

game.formation=["2-2-1","1-3-1"].includes(game.formation)?game.formation:"2-2-1";

let activeTab="shops";
let activeShopTab="packs";

let isResetting=false;
function save(){if(isResetting)return false;try{localStorage.setItem(SAVE_KEY,JSON.stringify(game));return true}catch(e){console.error("Save failed:",e);return false}}
setInterval(save,2000);
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save()});
function ownedCount(){return Object.values(game.owned).reduce((a,b)=>a+b,0)}
function getCard(id){return allCards.find(c=>c.id===id)}
function getOwned(){return Object.keys(game.owned).filter(id=>game.owned[id]>0).map(getCard).filter(Boolean)}
function teamCards(){return game.team.map(id=>id?getCard(id):null)}
function teamRating(){let t=teamCards();return t.length===5&&t.every(Boolean)?Math.round(t.reduce((s,c)=>s+c.rating,0)/5):0}
function money(n){return Math.round(n).toLocaleString("en-GB")}
function persistRender(){save();render()}
function opponentName(){return game.match?.opponent?.name||"GOATS XI"}
function opponentEmoji(){return game.match?.opponent?.emoji||"🐐"}

function toast(msg){
let t=document.getElementById("toast");
t.textContent=msg;
t.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

function cardHTML(c,actions=""){
return `<div class="card ${c.rarity}">
<div class="emoji">${c.emoji}</div>

<div class="name">${c.name}</div>
<div class="rarity">${c.id==="gallery_aura_liam_og"?"HACK CLUB OG":c.rarity}</div>${actions}</div>`;
}

activeTab=tab;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
render();
}

function renderPacks(){
return `<section>
<div class="sectionhero"><h2>🎁 THE PACK STORE</h2><p>Open packs, discover rare players and build your ultimate squad. You can still open packs during a match!</p><span class="badge">🪙 ${money(game.coins)} COINS AVAILABLE</span></div>
<div class="grid">${packDefs.map(p=>`

<div class="price">${p.price===0?"FREE":"🪙 "+money(p.price)}</div>
<div class="packdesc">${p.description}</div>
<div class="packstats"><span>🃏 ${p.pulls} player${p.pulls===1?"":"s"}</span></div>
<div class="packfoot"><button data-openpack="${p.id}" ${game.coins<p.price?"disabled":""}>${game.coins<p.price?"NOT ENOUGH COINS":"OPEN PACK →"}</button></div>
</div>`).join("")}</div>
</section>`;
}

function sellPlayer(id){
const c=getCard(id);const count=Number(game.owned[id])||0;
if(!c||count<=0)return;
const value=Number(rarityPrice[c.rarity])||0;
if(c.rarity==="Mythical"||value<=0){toast("Mythical players cannot be sold.");return;}
game.owned[id]=count-1;if(game.owned[id]<=0)delete game.owned[id];
game.coins+=value;save();render();toast("Sold "+c.name+" for "+money(value)+" coins.");
}

function renderTeam(){
const slots=game.team.map((id,i)=>{
const c=id?getCard(id):null;
const locked=game.match?.status==="running";
return `<div class="position"><span class="position-role">${positionNames[i]}</span><div class="small">POSITION ${i+1}</div>${c?`<div style="font-size:26px">${c.emoji}</div><b>${c.name}</b><div class="rating">${c.rating}</div><span class="badge">${c.rarity}</span>`:`<div style="font-size:25px">➕</div><b>Empty slot</b>`}<button data-slot="${i}" ${locked?"disabled":""}>${c?"CHANGE PLAYER":"SELECT PLAYER"}</button>${c?`<button class="secondary" data-clear="${i}" ${locked?"disabled":""}>REMOVE</button>`:""}</div>`;
}).join("");
const rows=game.formation==="1-3-1"?[[4],[1,2,3],[0]]:[[4],[3],[1,2],[0]];
const match=game.match;
const running=match?.status==="running";
const finished=match?.status==="finished";
const ready=game.team.length===5&&game.team.every(id=>id&&getCard(id));

if(running){
const score=getMatchScore();const opp=opponentName();

}else if(finished){
const score=getMatchScore();const result=score.home>score.away?"WIN":score.home<score.away?"LOSS":"DRAW";const reward=result==="WIN"?10:result==="DRAW"?4:0;const opp=opponentName();
matchPanel=`<div class="match-panel"><h3>🏁 FULL TIME!</h3><div class="match-score">DA BOIZ XI ${score.home} - ${score.away} ${opp}</div><p style="text-align:center" class="${result==="WIN"?"match-win":result==="LOSS"?"match-loss":"match-draw"}">${result==="WIN"?"🏆 YOU WON!":result==="LOSS"?"❌ YOU LOST!":"🤝 IT'S A DRAW!"}</p><p style="text-align:center">${reward?`You earned <b>${reward} tokens</b>!`:"No tokens earned this time."}</p><h3>Match events</h3><div class="match-events">${match.events.map(matchEventHTML).join("")||'<div class="match-event">No goals were scored.</div>'}</div><button class="match-play" data-claimmatch>CLAIM MATCH RESULT</button></div>`;
}else{
matchPanel=`<div class="match-panel"><h3>🏟️ QUICK MATCH</h3><p>Play a simulated 90-second match against a randomly selected team: GOATS XI, ICONS XI or BRONZE XI. It costs <b>3 tokens</b> to enter.</p><p>Win to earn <b>10 tokens</b>, draw to earn <b>4 tokens</b>, and lose to earn no tokens!</p><p>You'll need a complete five-player team. Your squad will be locked during the match, but you can still open packs.</p>${!ready?'<p class="match-loss">You need all 5 team positions filled before you can play.</p>':""}${game.tokens<3?'<p class="match-loss">You need at least 3 tokens to enter.</p>':""}<button class="match-play" data-startmatch ${!ready||game.tokens<3?"disabled":""}>⚽ START RANDOM MATCH — 3 TOKENS</button></div>`;
}
return `<section>
<div class="sectionhero"><h2>⚽ MY SQUAD</h2><p>Fill all five positions to calculate your team rating.</p><span class="badge">⭐ TEAM RATING: ${teamRating()||"NOT COMPLETE"}</span></div>
<div class="panel" style="margin-bottom:15px"><label><b>Formation:</b><select id="formation" ${running?"disabled":""}><option value="2-2-1" ${game.formation==="2-2-1"?"selected":""}>2-2-1</option><option value="1-3-1" ${game.formation==="1-3-1"?"selected":""}>1-3-1</option></select></label></div>
<div class="pitch"><div class="pitch-markings"><div class="center-line"></div><div class="center-circle"></div><div class="center-spot"></div><div class="penalty-box top"></div><div class="penalty-box bottom"></div><div class="goal-box top"></div><div class="goal-box bottom"></div></div>
${rows.map(row=>`<div class="pitchrow">${row.map(i=>{let c=game.team[i]?getCard(game.team[i]):null;return `<div class="position"><span class="position-role">${positionNames[i]}</span>${c?`${c.emoji}<br><b>${c.name}</b><br><strong>${c.rating} OVR</strong>`:`➕<br><b>${positionNames[i]} Empty</b>`}</div>`}).join("")}</div>`).join("")}
</div>${matchPanel}
<h2 style="margin-top:24px">Squad Positions</h2><div class="grid">${slots}</div>
<div class="panel" style="margin-top:17px"><h3>Your Players</h3><div class="playerlist">${getOwned().sort((a,b)=>b.rating-a.rating).map(c=>`<div class="playeroption"><span class="miniemoji">${c.emoji}</span><span class="playerinfo"><b>${c.name}</b><small>${c.rarity} • Owned: ${game.owned[c.id]}</small></span><span class="ovr">${c.rating}</span><button class="secondary player-sell-button" data-sell-player="${c.id}" ${c.rarity==="Mythical"||!(rarityPrice[c.rarity]>0)?"disabled":""}>${c.rarity==="Mythical"?"CANNOT SELL":"SELL • "+money(rarityPrice[c.rarity]||0)+" COINS"}</button></div>`).join("")||"Open a pack to get your first player."}</div></div>
${game.lastMatch?`<div class="panel" style="margin-top:15px"><h3>Last match</h3><p>${game.lastMatch.result}: ${game.lastMatch.home} - ${game.lastMatch.away} ${game.lastMatch.opponent||"GOATS XI"} • ${game.lastMatch.reward} tokens earned</p></div>`:""}
</section>`;

function weightedRarity(odds){
let entries=Object.entries(odds).filter(x=>x[1]>0);let total=entries.reduce((s,x)=>s+x[1],0);let n=Math.random()*total;
for(let [r,w] of entries){n-=w;if(n<=0)return r}
return entries[0][0];
}
function weightedCard(pool,weights={},exclude=new Set()){
let choices=pool.filter(c=>!exclude.has(c.id));if(!choices.length)choices=pool;
let ws=choices.map(c=>weights[c.rarity]??1);let total=ws.reduce((a,b)=>a+b,0);let n=Math.random()*total;
for(let i=0;i<choices.length;i++){n-=ws[i];if(n<=0)return choices[i]}
return choices[choices.length-1];
}
function normalPick(pack){
if(pack.id==="mega"){
const weights=mythical.map(c=>c.rating===99?0.1:8.3);const total=weights.reduce((a,b)=>a+b,0);let n=Math.random()*total;
for(let i=0;i<mythical.length;i++){n-=weights[i];if(n<0)return mythical[i]}
return mythical[mythical.length-1];
}
let odds={...pack.odds};
if(game.potion&&game.potion.until>Date.now()){
let m=game.potion.multiplier;Object.keys(odds).forEach(r=>{if(r!=="Common")odds[r]*=m});
let sum=Object.values(odds).reduce((a,b)=>a+b,0);Object.keys(odds).forEach(r=>odds[r]=odds[r]/sum*100);
}
let rarity=weightedRarity(odds);let pool=cards.filter(c=>c.rarity===rarity);if(!pool.length)pool=cards.filter(c=>c.rarity!=="Icon");
return pool[Math.floor(Math.random()*pool.length)];
}

 '</style><section id="choos"><div class="ch-head"><h2>♟ CHOOS!</h2><p>White vs '+["","Beginner Bot","Easy Bot","Hard Bot","Expert Bot"][choosSelectedLevel]+' · Standard chess rules</p></div>'+

function initChoos(){
 const boardEl=document.getElementById("choosBoard");if(!boardEl)return;
 if(typeof Chess!=="function"){document.getElementById("chStatus").textContent="Chess rules are still loading. Check your connection and reopen Choos!.";return}
 if(window.__choosBotTimer)clearTimeout(window.__choosBotTimer);
 const game=new Chess();let level=choosSelectedLevel||1,selected=null,targets=[],pendingPromotion=null,thinking=false,lastMove=null;
 const glyph={wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟︎"};
 const names=["","Beginner Bot","Easy Bot","Hard Bot","Expert Bot"];
 const values={p:100,n:320,b:335,r:500,q:900,k:20000};
 const statusEl=document.getElementById("chStatus"),historyEl=document.getElementById("chHistory"),promotionEl=document.getElementById("chPromotion");
 const allSquares=()=>{const a=[];for(let r=0;r<8;r++)for(let f=0;f<8;f++)a.push("abcdefgh"[f]+(8-r));return a};
 function status(){
  if(game.in_checkmate())return game.turn()==="w"?"Checkmate — the bot wins.":"Checkmate — you win!";
  if(game.in_stalemate())return "Draw — stalemate.";
  if(game.in_draw())return "Draw — game drawn.";
  if(thinking)return names[level]+" is thinking…";
  if(game.in_check())return (game.turn()==="w"?"Your move":"Bot to move")+" — CHECK!";
  return game.turn()==="w"?"Your move — White":"Bot to move — Black";
 }
 function render(){
  const moves=selected?game.moves({square:selected,verbose:true}):[];
  targets=moves.map(m=>m.to);
  const board=game.board(),squares=allSquares();
  boardEl.innerHTML=squares.map((sq,i)=>{
   const r=Math.floor(i/8),f=i%8,p=board[r][f],isTarget=targets.includes(sq),isSelected=selected===sq,isLast=lastMove&&(lastMove.from===sq||lastMove.to===sq);
   const color=(r+f)%2?"dark":"light";
   return '<button type="button" class="ch-square '+color+(isSelected?" ch-selected":"")+(isLast?" ch-last":"")+'" data-square="'+sq+'" aria-label="'+sq+(p?" "+(p.color==="w"?"white ":"black ")+p.type:" empty square")+'">'+
    (p?'<span class="ch-piece '+(p.color==="w"?"ch-white":"ch-black")+'">'+glyph[p.color+p.type]+'</span>':'')+
    (isTarget?(p?'<span class="ch-capture"></span>':'<span class="ch-dot"></span>'):'')+
    (f===0?'<span class="ch-coord">'+(8-r)+'</span>':'')+(r===7?'<span class="ch-coord" style="left:auto;right:3px">'+ "abcdefgh"[f]+'</span>':'')+'</button>';
  }).join("");
  statusEl.textContent=status();
  document.getElementById("chBotName").textContent=names[level];
  historyEl.textContent=game.history().length?game.history().reduce((out,m,i)=>out+(i%2===0?Math.floor(i/2+1)+". ":"")+m+(i%2===1?"\n":" "), ""):"Game started.";
  document.querySelectorAll("[data-ch-level]").forEach(b=>b.classList.toggle("chosen",Number(b.dataset.chLevel)===level));
  promotionEl.innerHTML=pendingPromotion?'<b>Promote pawn to:</b><div class="ch-promo">'+["q","r","b","n"].map(p=>'<button type="button" data-ch-promo="'+p+'">'+({q:"♕ Queen",r:"♖ Rook",b:"♗ Bishop",n:"♘ Knight"})[p]+'</button>').join("")+'</div>':"";
  promotionEl.querySelectorAll("[data-ch-promo]").forEach(b=>b.onclick=()=>finishPromotion(b.dataset.chPromo));
  boardEl.querySelectorAll("[data-square]").forEach(b=>b.onclick=()=>clickSquare(b.dataset.square));
 }
 function finishPromotion(piece){if(!pendingPromotion)return;game.move({from:pendingPromotion.from,to:pendingPromotion.to,promotion:piece});pendingPromotion=null;selected=null;lastMove=game.history({verbose:true}).slice(-1)[0];afterHumanMove()}
 function clickSquare(sq){
  if(thinking||game.game_over()||game.turn()!=="w"||pendingPromotion)return;
  const piece=game.get(sq);
  if(selected&&targets.includes(sq)){
   const options=game.moves({square:selected,verbose:true}).filter(m=>m.to===sq);
   if(options.some(m=>m.flags.includes("p"))){pendingPromotion={from:selected,to:sq};render();return}
   const move=game.move({from:selected,to:sq,promotion:"q"});if(move){lastMove=move;selected=null;afterHumanMove();return}
  }
  if(piece&&piece.color==="w"){selected=selected===sq?null:sq;render();return}
  selected=null;render();
 }
 function afterHumanMove(){selected=null;render();if(!game.game_over())scheduleBot()}
 function evaluate(g){
  if(g.in_checkmate())return g.turn()==="w"?-100000:100000;
  if(g.in_draw())return 0;
  let score=0;const b=g.board();
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(!p)continue;let v=values[p.type];const center=3.5-(Math.abs(3.5-f)+Math.abs(3.5-r))/2; if(p.type==="n"||p.type==="b")v+=center*7;if(p.type==="p")v+=(p.color==="w"?(6-r):(r-1))*3;score+=(p.color==="w"?v:-v)}
  return score;
 }
 function ordered(g){return g.moves({verbose:true}).sort((a,b)=>((b.captured?values[b.captured]:0)+(b.promotion?800:0))-((a.captured?values[a.captured]:0)+(a.promotion?800:0)))}
 function search(g,depth,alpha,beta){
  if(depth===0||g.game_over())return evaluate(g);
  const maximizing=g.turn()==="w";let best=maximizing?-Infinity:Infinity;
  for(const m of ordered(g)){const child=new Chess(g.fen());child.move({from:m.from,to:m.to,promotion:m.promotion||"q"});const score=search(child,depth-1,alpha,beta);
   if(maximizing){best=Math.max(best,score);alpha=Math.max(alpha,best)}else{best=Math.min(best,score);beta=Math.min(beta,best)}
   if(beta<=alpha)break;
  }
  return best;
 }
 function chooseBotMove(){
  const moves=ordered(game);if(!moves.length)return null;
  if(level===1)return moves[Math.floor(Math.random()*moves.length)];
  if(level===2){
   let best=Infinity,pool=[];for(const m of moves){const child=new Chess(game.fen());child.move({from:m.from,to:m.to,promotion:m.promotion||"q"});const val=evaluate(child)-(m.captured?values[m.captured]*.25:0);if(val<best){best=val;pool=[m]}else if(val===best)pool.push(m)}return pool[Math.floor(Math.random()*pool.length)];
  }
  const depth=level===3?2:3;let best=Infinity,pool=[];
  for(const m of moves){const child=new Chess(game.fen());child.move({from:m.from,to:m.to,promotion:m.promotion||"q"});const val=search(child,depth-1,-Infinity,Infinity);if(val<best){best=val;pool=[m]}else if(val===best)pool.push(m)}
  return pool[Math.floor(Math.random()*pool.length)];
 }
 function scheduleBot(){
  thinking=true;render();
  window.__choosBotTimer=setTimeout(()=>{
   if(!document.getElementById("choosBoard")||game.turn()!=="b"||game.game_over())return;
   const m=chooseBotMove();if(m){const done=game.move({from:m.from,to:m.to,promotion:m.promotion||"q"});lastMove=done}
   thinking=false;selected=null;render();
  },level===4?450:300);
 }
 function restart(){if(window.__choosBotTimer)clearTimeout(window.__choosBotTimer);game.reset();selected=null;targets=[];pendingPromotion=null;thinking=false;lastMove=null;render()}
 
 document.getElementById("chRestart").onclick=restart;
 document.getElementById("chBack").onclick=()=>{if(window.__choosBotTimer)clearTimeout(window.__choosBotTimer);choosSelectedLevel=null;render()};
 render();
}
let sadTiresState=null;
function initSadTires(){
 const canvas=document.getElementById("stCanvas");
 if(!canvas)return;

 const ctx=canvas.getContext("2d");
 if(!ctx)return;
 const W=960,H=540;
 let best=0;try{best=Number(localStorage.getItem("daBoiz_sadtires_best_v1"))||0}catch(e){}
 let running=true,last=0,world=0,airY=0,vy=0,lean=0,airRotation=0,crashed=false,crashType="",crashTimer=0,crashDrop=0,crashAngle=0,elapsed=0;
 const speed=235,groundY=405;
 const mapThemes=[
  {name:"GREEN HILLS",sky1:"#77c9ed",sky2:"#e0f4e8",hill:"#9acb8b",grass:"#4b9b55",dirt:"#7b5837",accent:"#ff8b32"},
  {name:"DUSTY DESERT",sky1:"#f4bd78",sky2:"#f8e3b5",hill:"#d5a36b",grass:"#c28a48",dirt:"#80512e",accent:"#e65c32"},
  {name:"FROZEN PEAKS",sky1:"#8bbce0",sky2:"#e7f5ff",hill:"#b7d3e8",grass:"#77a9bd",dirt:"#526f86",accent:"#ff784f"},
  {name:"DARK FOREST",sky1:"#354c61",sky2:"#9ab5a0",hill:"#536d59",grass:"#315b42",dirt:"#443b32",accent:"#e2a33b"},
  {name:"LAVA RUN",sky1:"#482b42",sky2:"#e58b53",hill:"#68434a",grass:"#8b4937",dirt:"#44302e",accent:"#ffcf45"}
 ];
 const keys={jump:false,back:false,front:false};
 function course(){
  const level=Math.floor(world/6000),difficulty=Math.min(8,level);
  const period=Math.max(780,1300-difficulty*65);
  return {level,difficulty,period,gapStart:period*.62,gapWidth:90+difficulty*12,obstacleA:period*.40,obstacleB:period*.92};
 }
 const distanceEl=document.getElementById("stDistance"),bestEl=document.getElementById("stBest"),statusEl=document.getElementById("stStatus");
 if(bestEl)bestEl.textContent=Math.floor(best)+" m";
 function terrain(x){
  const wave=Math.sin(x/190)*17+Math.sin(x/73)*7;
  return groundY+wave;
 }
 function gapAt(x){
  const c=course(),local=((x%c.period)+c.period)%c.period;
  return local>c.gapStart&&local<c.gapStart+c.gapWidth;
 }
 function obstacleAt(x){
  const c=course(),n=Math.floor(x/c.period),local=((x%c.period)+c.period)%c.period;
  if(Math.abs(local-c.obstacleA)<24)return {x:n*c.period+c.obstacleA,type:"cone"};

 }
 function restart(){
  world=0;airY=0;vy=0;lean=0;airRotation=0;crashed=false;crashType="";crashTimer=0;crashDrop=0;crashAngle=0;elapsed=0;running=true;last=0;
  if(statusEl)statusEl.textContent="RIDE ON!";
  if(distanceEl)distanceEl.textContent="0 m";
 }
 function jump(){if(!crashed&&airY===0&&vy===0){vy=-900;airRotation=0}}
 function startCrash(type){if(crashed)return;crashed=true;running=false;crashType=type;crashTimer=0;crashDrop=0;crashAngle=0;if(statusEl)statusEl.textContent="WIPEOUT — RESTART"}
 function setAction(name,on){
  if(name==="jump"&&on)jump();
  if(name==="leanBack")keys.back=on;
  if(name==="leanFront")keys.front=on;
 }
 let lastTouchAction=0;
 document.querySelectorAll("#sadTires [data-st-action]").forEach(b=>{
  const a=b.dataset.stAction;
  function activate(){
   if(a==="restart"){restart();return}
   if(a==="jump"){jump();return}
   lean=a==="leanBack"?-0.85:0.85;
   keys.back=false;keys.front=false;

  // Use Pointer Events for touch, pen and mouse so every control follows
  // the same reliable path on mobile and desktop.
  b.onpointerdown=e=>{
   e.preventDefault();
   lastTouchAction=Date.now();
   if(a==="restart")restart();
   else if(a==="jump")jump();
   else setAction(a,true);
  };
  b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{
   if(a==="leanBack"||a==="leanFront")setAction(a,false);
  };

  b.onclick=e=>{
   e.preventDefault();
   if(Date.now()-lastTouchAction<800)return;

 });
 function keyDown(e){
  if(!document.getElementById("stCanvas")||activeTab!=="minigames")return;
  if(["Space","ArrowUp","ArrowLeft","ArrowRight","KeyA","KeyD","KeyR"].includes(e.code))e.preventDefault();
  if(e.code==="Space"||e.code==="ArrowUp")jump();
  if(e.code==="ArrowLeft"||e.code==="KeyA")keys.back=true;
  if(e.code==="ArrowRight"||e.code==="KeyD")keys.front=true;
  if(e.code==="KeyR")restart();
 }
 function keyUp(e){
  if(e.code==="ArrowLeft"||e.code==="KeyA")keys.back=false;
  if(e.code==="ArrowRight"||e.code==="KeyD")keys.front=false;
 }
 if(window.__sadTiresKeyDown)document.removeEventListener("keydown",window.__sadTiresKeyDown);
 if(window.__sadTiresKeyUp)document.removeEventListener("keyup",window.__sadTiresKeyUp);
 window.__sadTiresKeyDown=keyDown;window.__sadTiresKeyUp=keyUp;
 document.addEventListener("keydown",keyDown);
 document.addEventListener("keyup",keyUp);
 function draw(){
  ctx.clearRect(0,0,W,H);
  const theme=mapThemes[course().level%mapThemes.length];
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,theme.sky1);sky.addColorStop(1,theme.sky2);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff9";for(let i=0;i<5;i++){let x=((i*245-world*.12)%(W+140)+W+140)%(W+140)-60;ctx.beginPath();ctx.arc(x,95+i%2*52,25,0,Math.PI*2);ctx.arc(x+27,96+i%2*52,33,0,Math.PI*2);ctx.arc(x+58,100+i%2*52,22,0,Math.PI*2);ctx.fill()}
  // Distant rolling hills
  ctx.fillStyle=theme.hill;ctx.beginPath();ctx.moveTo(0,330);for(let x=0;x<=W;x+=20)ctx.lineTo(x,315+Math.sin((x+world*.25)/115)*19);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  // Continuous ground, with occasional safe-to-see gaps
  for(let sx=0;sx<W;sx+=5){
   const wx=world+sx,gy=terrain(wx);
   if(!gapAt(wx)){ctx.fillStyle=theme.grass;ctx.fillRect(sx,gy,6,H-gy);ctx.fillStyle=theme.dirt;ctx.fillRect(sx,gy+13,6,H-gy-13)}
  }

   // Make every lethal feature obvious: marked gap edges and high-contrast obstacles.
   const gapLeft=wx+cfg.gapStart,gapRight=gapLeft+cfg.gapWidth;
   [gapLeft,gapRight].forEach((edge,i)=>{
    const x=edge-world,y=terrain(edge);
    if(x>-35&&x<W+35){
     ctx.strokeStyle="#7f1d1d";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y-3);ctx.lineTo(x,y-54);ctx.stroke();
     ctx.fillStyle="#ef4444";ctx.beginPath();ctx.moveTo(x,y-54);ctx.lineTo(x+(i?25:-25),y-46);ctx.lineTo(x,y-37);ctx.closePath();ctx.fill();
     ctx.fillStyle="#fff";ctx.font="900 13px system-ui";ctx.textAlign="center";ctx.fillText("GAP",x+(i?20:-20),y-64);
    }
   });
   const ob1=obstacleAt(wx+cfg.obstacleA),ob2=obstacleAt(wx+cfg.obstacleB);
   [ob1,ob2].forEach(o=>{if(!o)return;const x=o.x-world,y=terrain(o.x);
    ctx.save();ctx.shadowColor="#ffea00";ctx.shadowBlur=15;
    if(o.type==="cone"){ctx.fillStyle=theme.accent;ctx.beginPath();ctx.moveTo(x,y-34);ctx.lineTo(x-17,y);ctx.lineTo(x+17,y);ctx.closePath();ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#fff";ctx.fillRect(x-10,y-12,20,5)}
    else{ctx.fillStyle="#9a6238";ctx.fillRect(x-19,y-32,38,32);ctx.strokeStyle="#fff1a8";ctx.lineWidth=4;ctx.strokeRect(x-19,y-32,38,32);ctx.beginPath();ctx.moveTo(x-17,y-28);ctx.lineTo(x+17,y-4);ctx.stroke()}
    ctx.restore();
   });
  }
  ctx.fillStyle="#ffffffdd";ctx.font="900 18px system-ui";ctx.textAlign="right";ctx.fillText(theme.name+" • MAP "+(course().level+1),W-22,35);
  // Rider and bicycle
  const bx=W*.22+90,by=terrain(world+W*.22+90)-42-airY+crashDrop;
  ctx.save();ctx.translate(bx,by);ctx.rotate(lean*.38+airRotation+crashAngle);
  ctx.strokeStyle="#202733";ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(-29,25,20,0,Math.PI*2);ctx.arc(35,25,20,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="#e94f37";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-29,25);ctx.lineTo(-5,-1);ctx.lineTo(12,25);ctx.lineTo(-29,25);ctx.moveTo(-5,-1);ctx.lineTo(35,25);ctx.moveTo(12,25);ctx.lineTo(35,25);ctx.stroke();
  ctx.strokeStyle="#202733";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(35,25);ctx.lineTo(43,-3);ctx.moveTo(34,-3);ctx.lineTo(50,-3);ctx.moveTo(-5,-1);ctx.lineTo(-16,-12);ctx.stroke();
  // Friendly cartoon rider
  ctx.strokeStyle="#263445";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-4,-5);ctx.lineTo(-1,-34);ctx.lineTo(17,-15);ctx.moveTo(-1,-34);ctx.lineTo(-19,-7);ctx.stroke();
  ctx.fillStyle="#f1c49a";ctx.beginPath();ctx.arc(1,-45,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f4d35e";ctx.beginPath();ctx.arc(1,-49,13,Math.PI,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#263445";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(17,-15);ctx.lineTo(35,-3);ctx.stroke();
  ctx.restore();
  if(crashed&&crashTimer>1.05){ctx.fillStyle="#101820cc";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="900 48px system-ui";ctx.fillText("WIPEOUT!",W/2,H/2-15);ctx.font="bold 21px system-ui";ctx.fillText("You rode "+Math.floor(world/10)+" metres",W/2,H/2+25);ctx.fillText("Press R or RESTART to try again",W/2,H/2+62)}
  else if(world<5){ctx.fillStyle="#18212b";ctx.font="bold 20px system-ui";ctx.fillText("GET READY!",W-145,45)}
 }
 function frame(t){
  if(!document.getElementById("stCanvas"))return;
  const dt=Math.min(.035,(t-last)/1000||0);last=t;
  if(running&&!crashed){
   elapsed+=dt;world+=speed*dt;
   const airborne=airY>0||vy<0;
   if(keys.back)lean=Math.max(-1,lean-dt*8);else if(keys.front)lean=Math.min(1,lean+dt*8);else lean*=Math.max(0,1-dt*3);
   if(airborne){const spinDirection=(keys.front?1:0)-(keys.back?1:0);airRotation+=spinDirection*8*dt}
   if(airborne){airY-=vy*dt;vy+=2200*dt;if(airY<=0&&vy>0){airY=0;vy=0;
    const landedAngle=((airRotation%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
    if(Math.cos(landedAngle)<-0.15)startCrash("landing");
   }}
   const riderX=world+W*.22+90,ob=obstacleAt(riderX);
   // Check the visible bicycle wheel positions against the actual drawn gap.
   const bodyFootprint=[-49,-42,-35,-28,-21,-14,-7,0,7,14,21,28,35,42,49,55];;
   const wholeBodyOverGap=bodyFootprint.every(offset=>gapAt(riderX+offset));
   // Hills are scenery only. A wipeout can only come from a clearly drawn obstacle or gap.
   if(!crashed&&ob&&airY<30&&Math.abs(ob.x-riderX)<34)startCrash("obstacle");
   if(!crashed&&wholeBodyOverGap&&airY<12)startCrash("gap");
   const d=Math.floor(world/10);if(distanceEl)distanceEl.textContent=d+" m";
   if(d>best){best=d;if(bestEl)bestEl.textContent=best+" m";try{localStorage.setItem("daBoiz_sadtires_best_v1",String(best))}catch(e){}}
  }else if(crashed&&crashTimer<=1.05){
   crashTimer+=dt;
   if(crashType==="gap")crashDrop+=430*dt;
   else{crashAngle+=9*dt;crashDrop+=95*dt}
  }
  draw();window.__sadTiresRAF=requestAnimationFrame(frame);
 }

buyTokenItem=function(type){
 const costs={pick79:75,x2:100};
 const cost=costs[type];
 if(!cost){toast("That token reward is unavailable.");return}
 const overlay=document.getElementById("reveal");
 if(isOpening&&overlay&&overlay.classList.contains("show"))return;
 const balance=Math.max(0,Number(game.tokens)||0);
 if(balance<cost){toast("Not enough tokens!");return}
 try{
  if(type==="pick79"){
   // Build the pool from the full card catalogue, excluding every special
   // promo/aura category while retaining ordinary base and Mythical cards.
   const pool=allCards.filter(c=>
    c&&Number(c.rating)>=79&&
    c.rarity!=="Aura"&&c.rarity!=="Winter Wildcards"&&c.rarity!=="HACK-CLUB-OG"&&
    !c.aura&&!c.promo&&!c.exclusive&&
    c.id!=="gallery_aura_liam_og"&&c.id!=="liam_snowtherland"&&
    c.id!=="nose_breather_lil_mumps"
   );
   const unique=[...new Map(pool.map(c=>[c.id,c])).values()];
   if(unique.length<5){toast("There aren't five eligible 79+ players available.");return}
   const candidates=[],remaining=unique.slice();
   while(candidates.length<5){
    const c=weightedCard(remaining,tokenRewardWeights);
    if(!c)throw new Error("Unable to select five eligible players");
    candidates.push(c);
    const index=remaining.findIndex(x=>x.id===c.id);
    if(index>=0)remaining.splice(index,1);
   }
   // Charge only after all five candidates have been safely prepared.
   game.tokens=balance-cost;
   save();
   isOpening=true;
   pickState={config:{count:5,need:2,min:79,title:"79+ PLAYER PICK • CHOOSE 2 OF 5"},candidates,selected:new Set(),revealed:5};
   const grid=document.getElementById("revealGrid");
   if(!overlay||!grid)throw new Error("Player-pick screen is missing");
   overlay.classList.remove("walkout-mode");
   document.getElementById("revealTitle").textContent="79+ PLAYER PICK";
   document.getElementById("revealSubtitle").textContent="Five eligible players. Choose exactly two to keep.";
   document.getElementById("walkoutBanner").innerHTML="";
   document.getElementById("pickHint").textContent="SELECT 2 OF 5 PLAYERS";
   grid.innerHTML="";
   candidates.forEach(c=>{
    const el=document.createElement("div");
    el.className="revealcard card-revealed";
    el.innerHTML=cardHTML(c,'<div class="card-actions"><button type="button">SELECT</button></div>');
    el.querySelector("button").onclick=()=>{
     if(!pickState)return;
     const selected=pickState.selected;
     if(selected.has(c.id))selected.delete(c.id);
     else if(selected.size<2)selected.add(c.id);
     else{toast("You can only choose two players.");return}
     el.classList.toggle("selected",selected.has(c.id));
     el.querySelector("button").textContent=selected.has(c.id)?"✓ SELECTED":"SELECT";
     document.getElementById("pickHint").textContent="SELECT 2 OF 5 • "+selected.size+"/2 SELECTED";
     document.getElementById("confirmPick").disabled=selected.size!==2;
    };
    grid.appendChild(el);
   });
   document.getElementById("revealActions").innerHTML='<button type="button" id="confirmPick" disabled>CONFIRM 2 PLAYERS</button>';
   document.getElementById("confirmPick").onclick=()=>{
    if(!pickState||pickState.selected.size!==2)return;
    const chosen=pickState.candidates.filter(c=>pickState.selected.has(c.id));
    const duplicates=chosen.map(c=>award(c));
    save();
    pickState=null;
    document.getElementById("revealTitle").textContent="PLAYER PICK CONFIRMED!";
    document.getElementById("revealSubtitle").textContent="Your two selected players have been added to your collection.";
    document.getElementById("pickHint").textContent="";
    grid.innerHTML="";
    chosen.forEach((c,i)=>grid.appendChild(revealCardElement(c,duplicates[i],i)));
    document.getElementById("revealActions").innerHTML='<button type="button" id="pickDone">CONTINUE</button>';
    document.getElementById("pickDone").onclick=closeReveal;
    document.getElementById("closeReveal").onclick=closeReveal;
   };
   document.getElementById("closeReveal").disabled=false;
   document.getElementById("closeReveal").onclick=()=>{if(confirm("Close this player pick?"))closeReveal()};
   overlay.classList.add("show");
   const tokenCounter=document.getElementById("tokens");
   if(tokenCounter)tokenCounter.textContent=money(game.tokens);
   return;
  }
  // Preserve the existing 84+ x2 reward flow.
  const pool=randomRewardCards.filter(c=>c&&c.id!==hackClubOG.id&&Number(c.rating)>=84&&c.rarity!=="Aura"&&c.rarity!=="Winter Wildcards"&&c.rarity!=="HACK-CLUB-OG"&&!c.aura&&!c.promo&&!c.exclusive);
  if(pool.length<1){toast("No eligible 84+ players are available right now.");return}
  const results=[weightedCard(pool,tokenRewardWeights),weightedCard(pool,tokenRewardWeights)];
  if(results.some(c=>!c))throw new Error("Unable to select 84+ rewards");
  game.tokens=balance-cost;
  const duplicateFlags=results.map(c=>awardPackCard(c).duplicate);
  save();isOpening=true;
  showReveal({title:"84+ x2 TOKEN PACK",subtitle:"Two guaranteed players rated 84 or higher",results,duplicateFlags,walkouts:true});
  const tokenCounter=document.getElementById("tokens");
  if(tokenCounter)tokenCounter.textContent=money(game.tokens);
 }catch(err){
  game.tokens=balance;
  isOpening=false;
  pickState=null;
  if(overlay)overlay.classList.remove("show","walkout-mode");
  save();
  const tokenCounter=document.getElementById("tokens");
  if(tokenCounter)tokenCounter.textContent=money(game.tokens);
  console.error("Token shop purchase failed:",err);
  toast("Purchase failed safely: "+(err&&err.message?err.message:"unknown error")+". Tokens returned.");
 }
};

 `;
 document.head.appendChild(style);
 renderPacks=function(){
  const balance=Number(game.coins)||0;
  const packHtml=(p,description)=>'<div class="pack '+p.className+'"><div class="packicon">'+p.icon+'</div><div class="packname">'+p.name+'</div><div class="price">'+(p.price===0?'FREE':'🪙 '+money(p.price))+'</div><div class="packdesc">'+description+'</div><div class="packstats"><span>🃏 '+p.pulls+' guaranteed player'+(p.pulls===1?'':'s')+'</span></div><div class="packfoot"><button type="button" data-openpack="'+p.id+'" '+(balance<p.price?'disabled':'')+'>'+(balance<p.price?'NOT ENOUGH COINS':'OPEN PACK →')+'</button></div></div>';
  return '<section><div class="sectionhero"><h2>🎁 THE PACK STORE</h2><p>Open the Low T Pack or choose one of the guaranteed promo packs.</p><span class="badge">🪙 '+money(balance)+' COINS AVAILABLE</span></div><div class="grid pack-grid">'+
   packHtml(packDefs[0],'Free pack • 5 rewards. Rarity chances: Common 40%, Uncommon 25%, Rare 13%, Epic 9%, Legendary 0.5%, Icon 0.1%, Tokens 12.4%.')+
   packHtml(pack79x2,'Two players rated 79+. Rare 35%, Epic 20%, Italian Brainrot 25%, Legendary 5%, Icon 1%, Footballer Showdown 9%, Winter Wildcards 4.9%, Aura 0.1%.')+
   packHtml(pack80x5,'Five players rated 80+. Epic 45%, Legendary 20%, Mythical 15%, Footballer Showdown 9%, Icon 2%, Aura 0.3%, Italian Brainrot 8.7%.')+
   packHtml(pack80x10,'Ten players rated 80+. Epic 46.2%, Legendary 20%, Mythical 15%, Footballer Showdown 9%, Icon 1%, Aura 0.1%, Italian Brainrot 8.7%.')+
   packHtml(promoPack,'Seven players. Italian Brainrot 20%, Mythical 20%, Footballer Showdown 30%, Winter Wildcards 29.8%, Aura 0.2%.')+
   packHtml(promoMega,'One guaranteed Mythical player.')+
   packHtml(promoWinter,'Two guaranteed Winter Wildcards players.')+
   packHtml(showdownPack,'Two Footballer Showdown players. Henry, Dexter and Ollie each have a 2% chance; the other six share the remaining 94%.')+
   packHtml(italianBrainrotPack,'Two Italian Brainrot players. Every one of the 19 cards has an equal chance.')+
   '</div></section>';
 };
 const specialPackOdds={
  "79x2":{Rare:35,Epic:20,"Italian Brainrot":25,Legendary:5,Icon:1,"Footballer Showdown":9,"Winter Wildcards":4.9,Aura:0.1},
  "80x5":{Epic:45,Legendary:20,Mythical:15,"Footballer Showdown":9,Icon:2,Aura:0.3,"Italian Brainrot":8.7},
  "80x10":{Epic:46.2,Legendary:20,Mythical:15,"Footballer Showdown":9,Icon:1,Aura:0.1,"Italian Brainrot":8.7},
  "promo-pack":{"Italian Brainrot":20,Mythical:20,"Footballer Showdown":30,"Winter Wildcards":29.8,Aura:0.2}
 };
 const pickSpecialPackCard=function(packId){
  const odds=specialPackOdds[packId];
  let roll=Math.random()*100,chosen=null;
  for(const [rarity,chance] of Object.entries(odds)){roll-=chance;if(roll<0){chosen=rarity;break}}
  if(!chosen)throw new Error("Invalid odds for "+packId);
  let pool=[];
  if(chosen==="Italian Brainrot")pool=italianBrainrotCards;
  else if(chosen==="Footballer Showdown")pool=footballerShowdownCards;
  else if(chosen==="Winter Wildcards"){
   const winter=window.daBoizWinterPack;
   if(!winter||typeof winter.pick!=="function")throw new Error("Winter Wildcards pool unavailable.");
   return winter.pick();
  }else if(chosen==="Mythical")pool=mythical.filter(c=>c.rarity==="Mythical"&&!c.promo&&!c.exclusive);
  else if(chosen==="Aura")pool=allCards.filter(c=>c.rarity==="Aura"&&!c.promo&&!c.exclusive);
  else pool=allCards.filter(c=>c.rarity===chosen&&!c.promo&&!c.exclusive&&c.id!=="nose_breather_lil_mumps"&&(packId!=="79x2"||chosen!=="Rare"||Number(c.rating)>=79));
  if(!pool.length)throw new Error("No eligible "+chosen+" players are available for this pack.");
  return pool[Math.floor(Math.random()*pool.length)];
 };
 normalPick=function(pack){
  if(specialPackOdds[pack.id])return pickSpecialPackCard(pack.id);
  if(pack.id==="italian-brainrot")return italianBrainrotCards[Math.floor(Math.random()*italianBrainrotCards.length)];
  if(pack.id==="footballer-showdown"){
   const weighted=footballerShowdownCards.map(c=>({card:c,weight:["showdown_henry_worsellotti","showdown_ollie_dixiniesta","showdown_dexter_chadwickham"].includes(c.id)?2:94/6}));
   const roll=Math.random()*100;let total=0;
   for(const entry of weighted){total+=entry.weight;if(roll<total)return entry.card}
   return weighted[weighted.length-1].card;
  }
  if(pack.id==="promo-mythical"){
   const pool=mythical.filter(c=>c.rarity==="Mythical");
   if(!pool.length)throw new Error("No Mythical players are available.");
   return pool[Math.floor(Math.random()*pool.length)];
  }
  if(pack.id==="promo-winter"){
   const picker=window.daBoizWinterPack;
   if(!picker||typeof picker.pick!=="function")throw new Error("Winter Wildcards promo pool unavailable.");
   return picker.pick();
  }
  const rarity=weightedRarity(lowOdds);
  const pool=cards.filter(c=>c.rarity===rarity&&!c.promo&&!c.exclusive&&c.id!=="nose_breather_lil_mumps");
  if(!pool.length)throw new Error("No eligible "+rarity+" players are available in the Low T Pack.");
  return pool[Math.floor(Math.random()*pool.length)];
 };
 openPack=function(id){
  if(isOpening)return;
  const p=packDefs.find(x=>x.id===id);
  if(!p)return;
  const cost=Number(p.price)||0;
  if((Number(game.coins)||0)<cost){toast("Not enough coins.");return}
  const oldCoins=Number(game.coins)||0,oldTokens=Number(game.tokens)||0,oldOwned={...(game.owned||{})};
  try{
   let results=[],tokenPulls=0;
   if(id==="low"){
    for(let i=0;i<5;i++){
     if(Math.random()*100>=100-tokenChance){tokenPulls++;continue}
     results.push(normalPick(p));
    }
   }else{
    for(let i=0;i<p.pulls;i++)results.push(normalPick(p));
   }
   game.coins=oldCoins-cost;
   game.tokens=oldTokens+tokenPulls;
   const duplicateFlags=results.map(c=>award(c));
   const tokenCards=Array.from({length:tokenPulls},(_,i)=>({id:"low-pack-token-"+i+"-"+Date.now(),name:"1 TOKEN",emoji:"🪙",rating:"+1",rarity:"Token"}));
   const revealResults=results.concat(tokenCards),flags=duplicateFlags.concat(tokenCards.map(()=>false));
   isOpening=true;save();
   const subtitle=id==="italian-brainrot"?"Two Italian Brainrot players • all 19 cards have equal chances":id==="footballer-showdown"?"Two guaranteed Footballer Showdown players":id==="promo-winter"?"Two guaranteed Winter Wildcards players":id==="79x2"?"Two players rated 79+ • special rarity odds":id==="80x5"?"Five players rated 80+ • special rarity odds":id==="80x10"?"Ten players rated 80+ • special rarity odds":id==="promo-pack"?"Seven special promo players":"5 rewards • "+tokenPulls+" token"+(tokenPulls===1?"":"s")+" from the remaining 12.4% chance";
   showReveal({title:p.name,subtitle,results:revealResults,duplicateFlags:flags,walkouts:true,forceWalkout:id==="promo-winter"});
  }catch(err){
   game.coins=oldCoins;game.tokens=oldTokens;game.owned=oldOwned;isOpening=false;save();
   console.error("Pack opening failed:",err);toast("Pack opening failed safely. No currency was lost.");render();
  }
 };
 render();
})();
