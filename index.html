<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA BOIZ RNG</title>
<style>
:root{--bg:#0b0914;--panel:#171326;--purple:#8b5cf6;--gold:#ffd166;--text:#f7f4ff;--muted:#aaa1c3;--border:#392c55}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#241442,#0b0914 65%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white;transition:.2s}
button:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-2px)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
input,select{background:#100d1b;color:white;border:1px solid var(--border);border-radius:9px;padding:10px}
header{padding:20px 4%;background:#100c1cf2;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.headtop{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{font-size:clamp(24px,4vw,38px);font-weight:1000;letter-spacing:1px;background:linear-gradient(90deg,#fff,#c4b5fd,#ffd166);background-clip:text;color:transparent}
.stats,nav{display:flex;gap:9px;flex-wrap:wrap}
.stat{background:#211a36;border:1px solid var(--border);padding:10px 13px;border-radius:12px;font-weight:800}
nav{overflow-x:auto;padding-top:16px}
nav button{white-space:nowrap;background:#211a36;color:#cfc5e9;border:1px solid #392c55;flex:1;min-width:100px;font-size:15px}
nav button.active{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:white;border-color:#a78bfa}
.subnav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px;padding:10px;background:#100c1c;border:1px solid var(--border);border-radius:14px}
.subnav button{flex:1;min-width:120px;background:#211a36;color:#cfc5e9;border:1px solid #392c55}
.subnav button.active{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:white;border-color:#a78bfa}
main{max-width:1250px;margin:auto;padding:25px 4% 60px}
h2{margin:0 0 16px;font-size:25px}
h3{margin:0 0 10px}
p{color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.panel,.pack,.objective,.setting,.shopitem{background:linear-gradient(145deg,#1e1730,#141020);border:1px solid var(--border);border-radius:16px;padding:17px;box-shadow:0 10px 30px #0002}
.sectionhero{background:linear-gradient(120deg,#24133f,#17112b 60%,#21182d);border:1px solid #483265;border-radius:18px;padding:21px;margin-bottom:17px}
.tokenhero{background:linear-gradient(120deg,#30200c,#21172c 55%,#17112b);border-color:#6b4c22}
.pack{position:relative;overflow:hidden;min-height:270px;display:flex;flex-direction:column;gap:12px}
.pack:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:var(--glow,#8b5cf633);filter:blur(25px);right:-65px;top:-70px}
.pack>*{position:relative}
.pack.low{--glow:#60a5fa55;border-color:#3b82f655}
.pack.mid{--glow:#a78bfa66;border-color:#8b5cf6}
.pack.high{--glow:#ec489955;border-color:#ec4899}
.pack.mega{--glow:#22d3ee66;border-color:#22d3ee}
.packicon{font-size:44px;filter:drop-shadow(0 0 13px #ffffff20)}
.packname{font-size:19px;font-weight:1000}
.price{font-size:23px;font-weight:1000;color:var(--gold)}
.packdesc{font-size:13px;color:#c0b5d8;min-height:35px}
.packfoot{margin-top:auto}
.packfoot button{width:100%;padding:13px}
.packstats{display:flex;gap:7px;flex-wrap:wrap}
.packstats span{background:#ffffff0b;border:1px solid #ffffff12;padding:6px 8px;border-radius:8px;font-size:11px;color:#d8ccef}
.shopitem{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:260px}
.shopitem .packicon{font-size:38px}
.shopitem p{font-size:13px;min-height:50px;margin:0}
.shopitem button{margin-top:auto;width:100%}
.badge{display:inline-block;padding:6px 9px;border-radius:8px;background:#ffffff12;border:1px solid #ffffff1a;font-size:10px;letter-spacing:1px;font-weight:900}
.card{border:2px solid #55476b;border-radius:14px;padding:13px;background:linear-gradient(160deg,#29223a,#13101d);text-align:center;position:relative;overflow:hidden;min-width:0}
.card .emoji{font-size:37px;margin:8px 0}
.card .name{font-size:14px;font-weight:900;overflow-wrap:anywhere}
.rating{font-size:27px;font-weight:1000}
.rarity{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:900;margin:7px 0}
.Common{border-color:#9ca3af}
.Common .rarity{color:#cbd5e1}
.Uncommon{border-color:#4ade80}
.Uncommon .rarity{color:#4ade80}
.Rare{border-color:#60a5fa;box-shadow:0 0 14px #60a5fa22}
.Rare .rarity{color:#60a5fa}
.Epic{border-color:#c084fc;box-shadow:0 0 14px #a855f722}
.Epic .rarity{color:#c084fc}
.Legendary{border-color:#fbbf24;box-shadow:0 0 18px #fbbf2433}
.Legendary .rarity{color:#fbbf24}
.Icon{border-color:#fb7185;box-shadow:0 0 18px #fb718533}
.Icon .rarity{color:#fb7185}
.Mythical{border-color:#22d3ee;box-shadow:0 0 20px #22d3ee33}
.Mythical .rarity{color:#67e8f9}
.card.selected{outline:3px solid var(--gold);transform:translateY(-3px)}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.card-actions button{flex:1;padding:8px 5px;font-size:12px}
.secondary{background:#302744;border:1px solid #514267}
.gold{background:linear-gradient(135deg,#facc15,#d97706);color:#201300}
.small{font-size:12px;color:var(--muted)}
.bar{height:8px;background:#332946;border-radius:9px;overflow:hidden;margin:10px 0}
.bar span{height:100%;display:block;background:linear-gradient(90deg,#8b5cf6,#f0abfc)}

/* FOOTBALL PITCH */
.pitch{position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#176b42 0 55px,#1c7549 55px 110px);border:3px solid #3b8d68;border-radius:20px;padding:24px 18px;min-height:360px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.pitch-markings{position:absolute;inset:10px;border:2px solid #d5f7e7aa;pointer-events:none;z-index:0;border-radius:4px}
.center-line{position:absolute;left:0;right:0;top:50%;border-top:2px solid #d5f7e7aa}
.center-circle{position:absolute;width:95px;height:95px;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #d5f7e7aa;border-radius:50%}
.center-spot{position:absolute;width:7px;height:7px;left:50%;top:50%;transform:translate(-50%,-50%);background:#e7fff2;border-radius:50%}
.penalty-box{position:absolute;left:22%;width:56%;height:17%;border:2px solid #d5f7e7aa}
.penalty-box.top{top:-2px;border-top:0}
.penalty-box.bottom{bottom:-2px;border-bottom:0}
.goal-box{position:absolute;left:37.5%;width:25%;height:7%;border:2px solid #d5f7e7aa}
.goal-box.top{top:-2px;border-top:0}
.goal-box.bottom{bottom:-2px;border-bottom:0}
.pitchrow{position:relative;z-index:1;display:flex;justify-content:space-evenly;gap:10px;flex-wrap:wrap}
.position{background:#102f27ef;border:1px solid #8bd6a8;border-radius:12px;padding:10px;min-width:115px;flex:1;text-align:center;box-shadow:0 4px 12px #0004}
.position button{margin-top:7px;padding:7px;font-size:12px;width:100%}
.position-role{display:block;font-size:12px;font-weight:1000;letter-spacing:2px;color:#b7ffd0;margin-bottom:5px}
.playerlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;max-height:55vh;overflow:auto;padding:4px}
.playeroption{display:flex;align-items:center;gap:10px;text-align:left;background:#201831;border:1px solid var(--border);border-radius:12px;padding:10px;color:white}
.playeroption .miniemoji{font-size:25px}
.playerinfo{flex:1;min-width:0}
.playerinfo b{display:block;overflow-wrap:anywhere;font-size:13px}
.playerinfo small{color:var(--muted)}
.ovr{font-size:20px;font-weight:1000;color:var(--gold)}
.playeroption.active{border-color:var(--gold);background:#493617}
.overlay{position:fixed;inset:0;background:#05030df5;z-index:20;display:none;overflow:auto;padding:20px;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{width:min(100%,1000px);background:linear-gradient(145deg,#211733,#100d19);border:1px solid #59416f;border-radius:22px;padding:22px;box-shadow:0 0 80px #8b5cf644;max-height:94vh;overflow:auto}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.revealgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}
.revealcard{min-width:0}
.revealcard.hidden-reveal{opacity:0;transform:scale(.65);pointer-events:none;visibility:hidden}
.revealcard.card-revealed{visibility:visible;animation:flipin .4s ease both}
#walkoutBanner{text-align:center;min-height:65px}
.walkouttitle{font-size:clamp(28px,6vw,58px);font-weight:1000;letter-spacing:2px;text-align:center;margin:18px 0;color:white}
.walkout-subtitle{text-align:center;font-weight:900;letter-spacing:2px;margin-bottom:20px;color:#eee;animation:rarityAppear .45s ease both}
.walkout-mode{background:radial-gradient(ellipse at center,#21143a 0%,#05030df5 78%)}
.pack-rest-title{text-align:center;font-weight:1000;font-size:24px;margin:20px 0;animation:titleSlam .4s both}
.pickhint{text-align:center;color:var(--gold);font-weight:900;margin:12px 0;min-height:18px}
.walkout-flip{perspective:1000px;width:100%;max-width:250px;height:330px;margin:15px auto}
.flip-inner{position:relative;width:100%;height:330px;transform-style:preserve-3d}
.flip-inner.flip-now{animation:cardFlip .9s ease-in-out forwards}
.flip-back,.flip-front{position:absolute;inset:0;width:100%;height:330px;min-height:330px;box-sizing:border-box;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-back{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;background:linear-gradient(145deg,#30204e,#100d1b);border:3px solid #8b5cf6;box-shadow:0 0 20px #8b5cf655;font-size:65px}
.flip-back span{font-size:16px;font-weight:1000;letter-spacing:3px}
.flip-front{transform:rotateY(180deg)}
.flip-front .card{width:100%;height:100%;min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.walkout-flip.Rare .flip-back{border-color:#60a5fa}
.walkout-flip.Epic .flip-back{border-color:#c084fc}
.walkout-flip.Legendary .flip-back{border-color:#fbbf24}
.walkout-flip.Icon .flip-back{border-color:#fb7185}
.walkout-flip.Mythical .flip-back{border-color:#22d3ee}
@keyframes cardFlip{0%{transform:rotateY(0deg)}100%{transform:rotateY(180deg)}}
@keyframes rarityAppear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes flipin{from{opacity:0;transform:rotateY(35deg)}to{opacity:1;transform:rotateY(0)}}
@keyframes titleSlam{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#211831;border:1px solid #8b5cf6;padding:13px 19px;border-radius:13px;z-index:50;display:none;box-shadow:0 10px 40px #0008;max-width:90vw;text-align:center}
.toast.show{display:block;animation:flipin .2s}
.setting{display:flex;align-items:center;justify-content:space-between;gap:15px}
.setting input{width:20px;height:20px;accent-color:#8b5cf6}
footer{text-align:center;color:#716684;padding:25px}

/* MATCH SYSTEM */
.match-hud{display:none;margin-top:15px;background:linear-gradient(100deg,#173e2d,#21143a);border:1px solid #65d99a;border-radius:13px;padding:12px 15px;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.match-hud.visible{display:flex}
.match-hud strong{font-size:17px}
.match-clock{font-size:23px;font-weight:1000;color:var(--gold)}
.match-panel{margin:17px 0;background:linear-gradient(145deg,#162e26,#171326);border:1px solid #4b936e;border-radius:17px;padding:18px}
.match-panel h3{font-size:20px}
.match-score{font-size:35px;font-weight:1000;text-align:center;margin:12px}
.match-events{max-height:190px;overflow:auto;margin-top:12px}
.match-event{padding:9px 10px;margin:6px 0;background:#ffffff0b;border:1px solid #ffffff12;border-radius:9px;font-size:13px}
.match-win{color:#4ade80;font-weight:900}
.match-loss{color:#fb7185;font-weight:900}
.match-draw{color:var(--gold);font-weight:900}
.match-play{width:100%;padding:15px;font-size:16px;margin-top:12px;background:linear-gradient(135deg,#16a34a,#047857)}

/* GOAL CELEBRATION */
body.goal-shake{animation:screenShake .45s ease}
@keyframes screenShake{
0%,100%{transform:translateX(0)}
15%{transform:translateX(-9px) rotate(-.5deg)}
30%{transform:translateX(9px) rotate(.5deg)}
45%{transform:translateX(-7px)}
60%{transform:translateX(7px)}
75%{transform:translateX(-3px)}
}
.goal-flash{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#ffd16622;animation:goalFlash .9s ease forwards}
.goal-flash-text{font-size:clamp(55px,14vw,125px);font-weight:1000;font-style:italic;letter-spacing:4px;color:#ffd166;text-shadow:0 0 15px #ff8c00,0 0 40px #ff8c00,5px 7px 0 #5b2600;animation:goalSlam .9s ease forwards;text-align:center}
@keyframes goalFlash{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes goalSlam{0%{transform:scale(.2) rotate(-12deg);opacity:0}25%{transform:scale(1.2) rotate(4deg);opacity:1}45%{transform:scale(1) rotate(0)}100%{transform:scale(1.1);opacity:0}}
@media(max-width:600px){
header{padding:15px 4%}
.stat{padding:8px;font-size:12px}
main{padding-top:18px}
.modal{padding:14px}
.position{min-width:100px}
.walkout-flip{max-width:230px}
nav button{min-width:0;padding:11px 8px;font-size:13px}
.subnav button{min-width:0;padding:10px 7px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){.flip-inner,.walkouttitle,.revealcard,.walkout-subtitle{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<header>
 <div class="headtop">
  <div class="logo">⚡ DA BOIZ RNG</div>
  <div class="stats">
   <div class="stat">🪙 <span id="coins">0</span></div>
   <div class="stat">🪙 Tokens: <span id="tokens">0</span></div>
   <div class="stat">⭐ Team: <span id="teamRating">—</span></div>
  </div>
 </div>
 <nav>
  <button class="active" data-tab="shops">🛍️ Shops</button>
  <button data-tab="teamhub">⚽ Team</button>
  <button data-tab="settings">⚙️ Settings</button>
 </nav>
 <div class="match-hud" id="matchHud">
  <strong>⚽ LIVE MATCH</strong>
  <span id="hudScore">DA BOIZ XI 0 - 0 GOATS XI</span>
  <span class="match-clock" id="hudClock">1</span>
  <span id="hudLatest">Kick-off!</span>
 </div>
</header>
<main id="app"></main>
<footer>DA BOIZ RNG • Build your dream team.</footer>

<div class="overlay" id="reveal">
 <div class="modal">
  <div class="modalhead">
   <div><h2 id="revealTitle">PACK OPENING</h2><div class="small" id="revealSubtitle"></div></div>
   <button class="secondary" id="closeReveal">✕ Close</button>
  </div>
  <div id="walkoutBanner"></div>
  <div class="pickhint" id="pickHint"></div>
  <div class="revealgrid" id="revealGrid"></div>
  <div id="revealActions" style="text-align:center;margin-top:18px"></div>
 </div>
</div>

<div class="overlay" id="playerPicker">
 <div class="modal">
  <div class="modalhead">
   <div><h2>🟣 SELECT YOUR PLAYER</h2><div class="small" id="pickerSubtitle"></div></div>
   <button class="secondary" id="closePicker">✕ Close</button>
  </div>
  <div class="playerlist" id="playerList"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SAVE_KEY="daBoizRNG_full_v6";
const positionNames=["GK","CB","CB","CM","ST"];

const baseCards=[
["dexter","Dexter Chadwick","🧢","Common",68,100],
["matthew","Matthew Bardsley","😎","Common",67,100],
["numaii","Numaii Leslie-Madden","🦊","Common",70,100],
["freddie","Freddie Fifield","⚽","Uncommon",74,300],
["max_rolfe","Max Rolfe","🔥","Uncommon",75,300],
["ashton","Ashton Elliott","🦁","Rare",79,600],
["oscar","Oscar Robert Harper","👑","Rare",80,600],
["jayden","Jayden Jobarteh","💎","Rare",78,600],
["henry","Henry James Worsell","⚡","Epic",84,1200],
["vittorio","Vittorio Petruzzelli","🦈","Epic",85,1200],
["zain","Zain Miah","🚀","Epic",83,1200],
["lil_mumps","Lil Mumps","🎤","Legendary",88,3000],
["liam","Liam Sutherland","🌠","Icon",95,10000],
["max_worboys","Max Worboys","🐐","Icon",95,10000],
["jacky_chan","Jacky Chan","🥋","Icon",95,10000],
["riley_may","Riley May","🌟","Icon",95,10000]
].map(x=>({id:x[0],name:x[1],emoji:x[2],rarity:x[3],rating:x[4],price:x[5]}));

const cards=baseCards.map(c=>({...c}));
const mythical=cards.map(c=>({...c,id:"myth_"+c.id,name:"Mythical "+c.name,rarity:"Mythical",emoji:"🌌",price:5000,rating:c.rarity==="Icon"?99:c.rating+5}));
const allCards=[...cards,...mythical];

const rarityPrice={Common:100,Uncommon:300,Rare:600,Epic:1200,Legendary:3000,Icon:10000,Mythical:5000};
const rarityRank={Common:0,Uncommon:1,Rare:2,Epic:3,Legendary:4,Icon:5,Mythical:6};

const packDefs=[
{id:"low",name:"LOW T PACK",icon:"📦",price:0,pulls:5,odds:{Common:80,Uncommon:13,Rare:5.5,Epic:1.4,Legendary:.1},tokenChance:.06,tokenAmount:2,description:"Free pack • 5 players",className:"low"},
{id:"mid",name:"MID T PACK",icon:"🎁",price:3500,pulls:5,odds:{Common:64,Uncommon:22,Rare:9,Epic:4.2,Legendary:.7,Icon:.1},tokenChance:.07,tokenAmount:3,description:"5 players • Better odds",className:"mid"},
{id:"high",name:"HIGH T PACK",icon:"💜",price:7500,pulls:5,odds:{Common:40,Uncommon:30,Rare:18,Epic:10,Legendary:1.8,Icon:.2},tokenChance:.08,tokenAmount:4,description:"5 players • Top-tier odds",className:"high"},
{id:"mega",name:"DA BOIZ MYTHICAL PACK",icon:"🌌",price:35000,pulls:1,odds:{Mythical:100},description:"Guaranteed Mythical player",className:"mega"}
];

const objectives=[
{rating:83,coins:5000,tokens:5},
{rating:88,coins:55000,tokens:10},
{rating:90,coins:65000,tokens:15},
{rating:93,coins:75000,tokens:20},
{rating:96,coins:80000,tokens:35}
];

let game;
try{game=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){}
if(!game||typeof game!=="object")game={};

game.coins=Number(game.coins??0);
game.tokens=Number(game.tokens??0);
game.owned=game.owned||{};
game.team=Array.isArray(game.team)?game.team:[null,null,null,null,null];
while(game.team.length<5)game.team.push(null);
game.team=game.team.slice(0,5);
game.formation=["2-2-1","1-3-1"].includes(game.formation)?game.formation:"2-2-1";
game.claimed=game.claimed||{};
objectives.forEach(o=>{if(typeof game.claimed[o.rating]!=="boolean")game.claimed[o.rating]=false});
game.potion=game.potion||null;
game.settings=game.settings||{};
game.settings.walkouts=game.settings.walkouts||{};
game.match=game.match&&typeof game.match==="object"?game.match:null;
game.lastMatch=game.lastMatch||null;

["Rare","Epic","Legendary","Icon","Mythical"].forEach(r=>{
if(typeof game.settings.walkouts[r]!=="boolean")game.settings.walkouts[r]=true;
});

let activeTab="shops";
let activeShopTab="packs";
let activeTeamTab="team";
let isOpening=false;
let pickState=null;
let toastTimer,animationTimer,openingRun=0;
let matchInterval=null;
let celebratedGoals=new Set();

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(game))}catch(e){}}
function ownedCount(){return Object.values(game.owned).reduce((a,b)=>a+b,0)}
function getCard(id){return allCards.find(c=>c.id===id)}
function getOwned(){return Object.keys(game.owned).filter(id=>game.owned[id]>0).map(getCard).filter(Boolean)}
function teamCards(){return game.team.map(id=>id?getCard(id):null)}
function teamRating(){let t=teamCards();return t.length===5&&t.every(Boolean)?Math.round(t.reduce((s,c)=>s+c.rating,0)/5):0}
function money(n){return Math.round(n).toLocaleString("en-GB")}
function persistRender(){save();render()}

function toast(msg){
let t=document.getElementById("toast");
t.textContent=msg;
t.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

function cardHTML(c,actions=""){
return `<div class="card ${c.rarity}">
<div class="emoji">${c.emoji}</div>
<div class="rating">${c.rating}</div>
<div class="name">${c.name}</div>
<div class="rarity">${c.rarity}</div>${actions}</div>`;
}

function setTab(tab){
if(isOpening)return;
activeTab=tab;

/* MATCH FUNCTIONS */
function getMatchElapsed(){
if(!game.match)return 0;
return Math.min(90,Math.max(0,Math.floor((Date.now()-game.match.startAt)/1000)));
}
function getMatchScore(){
const events=game.match?.events||[];
const elapsed=getMatchElapsed();
return {
home:events.filter(e=>e.side==="home"&&e.time<=elapsed).length,
away:events.filter(e=>e.side==="away"&&e.time<=elapsed).length
};
}
function matchEventHTML(e){
return `<div class="match-event">${e.time} • ${e.side==="home"?"⚽ DA BOIZ XI":"🐐 GOATS XI"} — ${e.scorer} scored!</div>`;
}
function celebrateGoal(){
document.body.classList.remove("goal-shake");
void document.body.offsetWidth;
document.body.classList.add("goal-shake");
const flash=document.createElement("div");
flash.className="goal-flash";
flash.innerHTML='<div class="goal-flash-text">⚽ GOAL!!! ⚽</div>';
document.body.appendChild(flash);
setTimeout(()=>flash.remove(),950);
}
function updateMatchHUD(){
const hud=document.getElementById("matchHud");
if(!hud)return;
if(!game.match||game.match.status!=="running"){
hud.classList.remove("visible");
return;
}
hud.classList.add("visible");
const score=getMatchScore();
const elapsed=Math.max(1,getMatchElapsed());
document.getElementById("hudScore").textContent=`DA BOIZ XI ${score.home} - ${score.away} GOATS XI`;
document.getElementById("hudClock").textContent=elapsed;
const latest=game.match.events.filter(e=>e.time<=getMatchElapsed()).slice(-1)[0];
document.getElementById("hudLatest").textContent=latest?`${latest.scorer} scored!`:"Kick-off!";
const teamClock=document.getElementById("teamMatchClock");
if(teamClock)teamClock.textContent=elapsed;
}
function createMatch(){
if(game.match){toast("You already have a match in progress!");return;}
if(!teamCards().every(Boolean)){toast("You need a full five-player team!");return;}
if(game.tokens<3){toast("You need 3 tokens to play!");return;}

game.tokens-=3;
const squad=teamCards();
const homeGoals=Math.min(5,Math.max(0,Math.floor(Math.random()*5)));
const awayGoals=Math.min(5,Math.max(0,Math.floor(Math.random()*5)));
const events=[];
const usedTimes=new Set();

function randomTime(){
let t;
do{t=5+Math.floor(Math.random()*81)}while(usedTimes.has(t));
usedTimes.add(t);
return t;
}
for(let i=0;i<homeGoals;i++){
const scorer=squad[Math.floor(Math.random()*squad.length)];
events.push({time:randomTime(),side:"home",scorer:scorer.name});
}
const goatsScorers=["Cristiano Ronaldo","Lionel Messi","Kylian Mbappé","Phil Jones"];
for(let i=0;i<awayGoals;i++){
const scorer=goatsScorers[Math.floor(Math.random()*goatsScorers.length)];
events.push({time:randomTime(),side:"away",scorer});
}
events.sort((a,b)=>a.time-b.time);

const now=Date.now();
game.match={
status:"running",
startAt:now,
endAt:now+90000,
events,
teamSnapshot:squad.map(c=>({name:c.name,rating:c.rating,emoji:c.emoji}))
};
celebratedGoals=new Set();
save();
activeTab="teamhub";
activeTeamTab="team";
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="teamhub"));
render();
toast("Match started! Good luck, Da Boiz XI!");
}
function finishMatch(){
if(!game.match||game.match.status!=="running")return;
game.match.status="finished";
game.match.finishedAt=Date.now();
activeTab="teamhub";
activeTeamTab="team";
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="teamhub"));
save();
render();
toast("FULL TIME! Claim your match result.");
}
function claimMatch(){
if(!game.match||game.match.status!=="finished")return;
const score=getMatchScore();
const result=score.home>score.away?"WIN":score.home<score.away?"LOSS":"DRAW";
const reward=result==="WIN"?10:0;
game.tokens+=reward;
game.lastMatch={
home:score.home,
away:score.away,
result,
reward,
events:game.match.events,
date:Date.now()
};
game.match=null;
celebratedGoals=new Set();
save();
render();
toast(reward?"Victory! You earned 10 tokens!":"Match claimed. Better luck next time!");
}
function matchTick(){
if(game.match&&game.match.status==="running"){
const elapsed=getMatchElapsed();
game.match.events.forEach((event,index)=>{
if(event.side==="home"&&event.time<=elapsed&&!celebratedGoals.has(index)){
celebratedGoals.add(index);
celebrateGoal();
}
});
updateMatchHUD();
if(Date.now()>=game.match.endAt)finishMatch();
}
}
function startMatchTimer(){
if(matchInterval)clearInterval(matchInterval);
if(game.match?.status==="running"){
celebratedGoals=new Set(
game.match.events
.map((event,index)=>({event,index}))
.filter(item=>item.event.side==="home"&&item.event.time<=getMatchElapsed())
.map(item=>item.index)
);
}
matchTick();
matchInterval=setInterval(matchTick,250);
}

document.querySelectorAll("[data-potion]").forEach(b=>b.onclick=()=>buyPotion(+b.dataset.potion));

function weightedRarity(odds){
let entries=Object.entries(odds).filter(x=>x[1]>0);
let total=entries.reduce((s,x)=>s+x[1],0);
let n=Math.random()*total;
for(let [r,w] of entries){n-=w;if(n<=0)return r}
return entries[0][0];
}

function weightedCard(pool,weights={},exclude=new Set()){
let choices=pool.filter(c=>!exclude.has(c.id));
if(!choices.length)choices=pool;
let ws=choices.map(c=>weights[c.rarity]??1);
let total=ws.reduce((a,b)=>a+b,0);
let n=Math.random()*total;
for(let i=0;i<choices.length;i++){n-=ws[i];if(n<=0)return choices[i]}
return choices[choices.length-1];
}

function normalPick(pack){
if(pack.id==="mega"){
const weights=mythical.map(c=>c.rating===99?0.1:8.3);
const total=weights.reduce((a,b)=>a+b,0);
let n=Math.random()*total;
for(let i=0;i<mythical.length;i++){
n-=weights[i];
if(n<0)return mythical[i];
}
return mythical[mythical.length-1];
}
let odds={...pack.odds};

if(game.potion&&game.potion.until>Date.now()){
let m=game.potion.multiplier;
Object.keys(odds).forEach(r=>{if(r!=="Common")odds[r]*=m});
let sum=Object.values(odds).reduce((a,b)=>a+b,0);
Object.keys(odds).forEach(r=>odds[r]=odds[r]/sum*100);
}

let rarity=weightedRarity(odds);
let pool=cards.filter(c=>c.rarity===rarity);
if(!pool.length)pool=cards.filter(c=>c.rarity!=="Icon");
return pool[Math.floor(Math.random()*pool.length)];
}

function award(c){
if(game.owned[c.id]){
let value=rarityPrice[c.rarity]||c.price||100;
game.coins+=value;
return value;
}
game.owned[c.id]=1;
return 0;
}

function openPack(id){
if(isOpening)return;
let p=packDefs.find(x=>x.id===id);
if(!p||game.coins<p.price)return;

game.coins-=p.price;
isOpening=true;

let results=Array.from({length:p.pulls},()=>normalPick(p));
let tokens=0;

if(p.tokenChance&&Math.random()<p.tokenChance){
tokens=p.tokenAmount;
game.tokens+=tokens;
}

let duplicates=0;
results.forEach(c=>duplicates+=award(c));
save();

showReveal({
title:p.name,
subtitle:`${results.length} player${results.length===1?"":"s"} in your pack${tokens?` • BONUS +${tokens} TOKENS`:""}`,
results,
duplicateCoins:duplicates,
walkouts:true
});
}

function revealEffect(c){
return ["Rare","Epic","Legendary","Icon","Mythical"].includes(c.rarity)&&game.settings.walkouts[c.rarity];
}

function bestWalkout(results){
return results.filter(revealEffect).sort((a,b)=>(rarityRank[b.rarity]-rarityRank[a.rarity])||(b.rating-a.rating))[0]||null;
}

function walkoutMarkup(c){
let icon=c.rarity==="Mythical"?"🌌":c.rarity==="Icon"?"⚡":c.rarity==="Legendary"?"👑":c.rarity==="Epic"?"💜":"💎";
return `<div class="walkouttitle">YOU PACKED A...</div><div class="walkout-subtitle">${c.rarity.toUpperCase()} ${icon}</div>`;
}

function showReveal(data){
clearTimeout(animationTimer);

const overlay=document.getElementById("reveal");
const grid=document.getElementById("revealGrid");
const run=++openingRun;

overlay.classList.remove("walkout-mode");
document.getElementById("revealTitle").textContent=data.title||"PLAYER REVEAL";
document.getElementById("revealSubtitle").textContent=data.subtitle||"";
document.getElementById("walkoutBanner").innerHTML="";
document.getElementById("pickHint").textContent="";
document.getElementById("revealActions").innerHTML="";
grid.innerHTML="";
overlay.classList.add("show");
document.getElementById("closeReveal").disabled=true;

const walkout=data.walkouts?bestWalkout(data.results):null;
const rest=walkout?data.results.filter(c=>c!==walkout):data.results.slice();

function makeCard(c){
let wrap=document.createElement("div");
wrap.className="revealcard card-revealed";
wrap.innerHTML=cardHTML(c);
return wrap;
}

function finish(){
if(run!==openingRun)return;
document.getElementById("closeReveal").disabled=false;
document.getElementById("revealActions").innerHTML='<button id="revealDone">CONTINUE</button>';
document.getElementById("revealDone").onclick=closeReveal;
document.getElementById("closeReveal").onclick=closeReveal;
}

function showRest(){
if(run!==openingRun)return;
overlay.classList.remove("walkout-mode");
document.getElementById("walkoutBanner").innerHTML="";
document.getElementById("pickHint").textContent="";
grid.innerHTML="";

if(rest.length){
document.getElementById("revealSubtitle").textContent="THE REST OF THE PACK"+(data.duplicateCoins?` • Duplicates converted to ${money(data.duplicateCoins)} coins`:"");
let title=document.createElement("div");
title.className="pack-rest-title";
title.style.gridColumn="1/-1";
title.textContent="📦 THE REST OF THE PACK";
grid.appendChild(title);
rest.forEach((c,i)=>{
let el=makeCard(c);
el.style.animationDelay=(i*.12)+"s";
grid.appendChild(el);
});
}else{
document.getElementById("revealSubtitle").textContent="Your pack contained one player!"+(data.duplicateCoins?` • Duplicates converted to ${money(data.duplicateCoins)} coins`:"");
let el=makeCard(walkout);
grid.appendChild(el);
}
finish();
}

if(!walkout){
document.getElementById("revealSubtitle").textContent+=(data.duplicateCoins?` • Duplicates converted to ${money(data.duplicateCoins)} coins`:"");
data.results.forEach((c,i)=>{
let el=makeCard(c);
el.style.animationDelay=(i*.12)+"s";
grid.appendChild(el);
});
finish();
return;
}

overlay.classList.add("walkout-mode");
document.getElementById("walkoutBanner").innerHTML='<div class="walkouttitle">YOU PACKED A...</div>';
document.getElementById("pickHint").textContent="WAIT FOR IT...";
let rarity=walkout.rarity;

let special=document.createElement("div");
special.className="walkout-flip "+rarity;
let inner=document.createElement("div");
inner.className="flip-inner";
let back=document.createElement("div");
back.className="flip-back";
back.innerHTML=`${rarity==="Mythical"?"🌌":rarity==="Icon"?"⚡":"🎁"}<span>DA BOIZ RNG</span>`;
let front=document.createElement("div");
front.className="flip-front";
front.innerHTML=cardHTML(walkout);
inner.appendChild(back);
inner.appendChild(front);
special.appendChild(inner);
grid.appendChild(special);

animationTimer=setTimeout(()=>{
if(run!==openingRun)return;
let icon=rarity==="Mythical"?"🌌":rarity==="Icon"?"⚡":rarity==="Legendary"?"👑":rarity==="Epic"?"💜":"💎";
document.getElementById("walkoutBanner").innerHTML=`<div class="walkouttitle">YOU PACKED A...</div><div class="walkout-subtitle">${rarity.toUpperCase()} ${icon}</div>`;
document.getElementById("pickHint").textContent="REVEALING PLAYER...";
animationTimer=setTimeout(()=>{
if(run!==openingRun)return;
inner.classList.add("flip-now");
},550);
animationTimer=setTimeout(()=>{
if(run!==openingRun)return;
showRest();
},1900);
},800);

document.getElementById("closeReveal").onclick=()=>{
if(confirm("Close the pack reveal?"))closeReveal();
};
}

function closeReveal(){
clearTimeout(animationTimer);
openingRun++;
document.getElementById("reveal").classList.remove("show","walkout-mode");
document.getElementById("closeReveal").disabled=false;
isOpening=false;
pickState=null;
render();
}

function buyTokenItem(type){
if(isOpening)return;
const costs={x2:25,pick84:50,pick95:400,pick79:15};
const cost=costs[type];
if(game.tokens<cost){toast("Not enough tokens!");return}
game.tokens-=cost;
isOpening=true;
save();

if(type==="x2"){
let pool=allCards.filter(c=>c.rating>=84);
let weights={Common:80,Uncommon:13,Rare:5.5,Epic:1.5,Legendary:.6,Icon:.1,Mythical:.01};
let results=[weightedCard(pool,weights),weightedCard(pool,weights)];
let dup=0;
results.forEach(c=>dup+=award(c));
save();
showReveal({title:"84+ x2 TOKEN PACK",subtitle:"Two guaranteed 84+ players",results,walkouts:true,duplicateCoins:dup});
return;
}

let config={
pick84:{count:5,need:1,min:84,title:"1 OF 5 • 84+ PLAYER PICK"},
pick95:{count:4,need:1,min:95,title:"1 OF 4 • 95+ PLAYER PICK"},
pick79:{count:5,need:2,min:79,title:"2 OF 5 • 79+ PLAYER PICK"}
}[type];

let pool=allCards.filter(c=>c.rating>=config.min);
let candidates=[];
let excluded=new Set();
let weights={Common:80,Uncommon:13,Rare:5.5,Legendary:.6,Icon:.1,Mythical:.01};

for(let i=0;i<config.count;i++){
let c=weightedCard(pool,weights,excluded);
candidates.push(c);
excluded.add(c.id);
}
showPick(config,candidates);
}

function showPick(config,candidates){
clearTimeout(animationTimer);
openingRun++;
const overlay=document.getElementById("reveal");
const grid=document.getElementById("revealGrid");
overlay.classList.remove("walkout-mode");
document.getElementById("revealTitle").textContent=config.title;
document.getElementById("revealSubtitle").textContent="Your candidates are being revealed one at a time...";
document.getElementById("walkoutBanner").innerHTML="";
document.getElementById("pickHint").textContent=`REVEALED 0/${candidates.length}`;
grid.innerHTML="";
pickState={config,candidates,selected:new Set(),revealed:0};

candidates.forEach(c=>{
let el=document.createElement("div");
el.className="revealcard hidden-reveal";
el.innerHTML=cardHTML(c,'<div class="card-actions"><button class="secondary" disabled>WAIT...</button></div>');
el.onclick=()=>togglePick(c);
grid.appendChild(el);
});

document.getElementById("revealActions").innerHTML='<button id="confirmPick" disabled>CONFIRM SELECTION</button> <button class="secondary" id="cancelPick">CANCEL</button>';
document.getElementById("confirmPick").onclick=confirmPick;
document.getElementById("cancelPick").onclick=()=>{if(confirm("Cancel this pick? Tokens already spent will not be refunded."))closeReveal()};
document.getElementById("closeReveal").disabled=false;
document.getElementById("closeReveal").onclick=()=>{if(confirm("Close this pick? Tokens already spent will not be refunded."))closeReveal()};
overlay.classList.add("show");

let i=0;
function next(){
if(!pickState||i>=candidates.length)return;
let c=candidates[i];
let el=grid.children[i];
el.classList.remove("hidden-reveal");
el.classList.add("card-revealed");
el.querySelector("button").disabled=false;
el.querySelector("button").textContent="SELECT";
pickState.revealed=i+1;
document.getElementById("pickHint").textContent=`REVEALED ${i+1}/${candidates.length} • SELECT ${config.need} PLAYER${config.need>1?"S":""}`;
i++;
if(i<candidates.length)animationTimer=setTimeout(next,650);
else document.getElementById("revealSubtitle").textContent="All candidates revealed! Choose your reward.";
}
animationTimer=setTimeout(next,400);
}

function togglePick(c){
if(!pickState)return;
let index=pickState.candidates.findIndex(x=>x.id===c.id);
if(index>=pickState.revealed){toast("Wait for this player to be revealed!");return}
let s=pickState.selected;
if(s.has(c.id))s.delete(c.id);
else if(s.size<pickState.config.need)s.add(c.id);
else{toast("You can only select "+pickState.config.need+" player(s).");return}
document.getElementById("revealGrid").querySelectorAll(".revealcard").forEach((el,i)=>{
el.classList.toggle("selected",s.has(pickState.candidates[i].id));
let b=el.querySelector("button");
if(b&&i<pickState.revealed)b.textContent=s.has(pickState.candidates[i].id)?"✓ SELECTED":"SELECT";
});
document.getElementById("pickHint").textContent=`SELECT ${pickState.config.need} PLAYER${pickState.config.need>1?"S":""} • ${s.size}/${pickState.config.need} SELECTED`;
document.getElementById("confirmPick").disabled=s.size!==pickState.config.need||pickState.revealed!==pickState.candidates.length;
}

function confirmPick(){
if(!pickState||pickState.selected.size!==pickState.config.need||pickState.revealed!==pickState.candidates.length)return;
let chosen=pickState.candidates.filter(c=>pickState.selected.has(c.id));
let dup=0;
chosen.forEach(c=>dup+=award(c));
save();
pickState=null;
document.getElementById("reveal").classList.remove("walkout-mode");
document.getElementById("revealTitle").textContent="PLAYER PICK CONFIRMED!";
document.getElementById("revealSubtitle").textContent="Your selected players have been added to your collection."+(dup?` Duplicates converted to ${money(dup)} coins.`:"");
document.getElementById("walkoutBanner").innerHTML="";
document.getElementById("pickHint").textContent="";
let grid=document.getElementById("revealGrid");
grid.innerHTML="";
chosen.forEach((c,i)=>{
let el=document.createElement("div");
el.className="revealcard";
el.style.animationDelay=(i*.2)+"s";
el.innerHTML=cardHTML(c);
grid.appendChild(el);
});
document.getElementById("revealActions").innerHTML='<button id="pickDone">CONTINUE</button>';
document.getElementById("pickDone").onclick=closeReveal;
document.getElementById("closeReveal").onclick=closeReveal;
}

function openPicker(slot){
if(isOpening)return;
if(game.match?.status==="running"){toast("You cannot change your team during a match!");return;}
let list=document.getElementById("playerList");
list.innerHTML="";
let owned=getOwned().sort((a,b)=>b.rating-a.rating||a.name.localeCompare(b.name));
document.getElementById("pickerSubtitle").textContent=`${positionNames[slot]} • Position ${slot+1} • Sorted by rating`;
if(!owned.length)list.innerHTML='<div class="panel">You have no players yet. Open a pack first.</div>';
owned.forEach(c=>{
let el=document.createElement("button");
el.className="playeroption"+(game.team[slot]===c.id?" active":"");
el.innerHTML=`<span class="miniemoji">${c.emoji}</span><span class="playerinfo"><b>${c.name}</b><small>${c.rarity} • Owned: ${game.owned[c.id]}</small></span><span class="ovr">${c.rating}</span>`;
el.onclick=()=>{
if(game.team.some((id,i)=>i!==slot&&id===c.id)){
toast("That player is already in another position.");
return;
}
game.team[slot]=c.id;
save();
document.getElementById("playerPicker").classList.remove("show");
render();
};
list.appendChild(el);
});
document.getElementById("playerPicker").classList.add("show");
}

document.getElementById("closePicker").onclick=()=>document.getElementById("playerPicker").classList.remove("show");

function claimObjective(target){
let o=objectives.find(x=>x.rating===target);
if(!o||game.claimed[target]||teamRating()<target||!teamCards().every(Boolean))return;
game.claimed[target]=true;
game.coins+=o.coins;
game.tokens+=o.tokens;
persistRender();
toast(`Reward claimed: ${money(o.coins)} coins and ${o.tokens} tokens!`);
}

function buyPotion(mult){
let price=mult===2?20000:80000;
if(game.coins<price||game.potion&&game.potion.until>Date.now())return;
game.coins-=price;
game.potion={multiplier:mult,until:Date.now()+120000};
persistRender();
toast(mult+"x luck activated for 2 minutes!");
}

function startMatchTimer(){
if(matchInterval)clearInterval(matchInterval);
if(game.match?.status==="running"){
celebratedGoals=new Set(
game.match.events
.map((event,index)=>({event,index}))
.filter(item=>item.event.side==="home"&&item.event.time<=getMatchElapsed())
.map(item=>item.index)
);
}
matchTick();
matchInterval=setInterval(matchTick,250);
}

function sellOne(id){
let c=getCard(id);
if(!c||!game.owned[id])return;
if(game.team.includes(id)&&game.owned[id]===1){
toast("Remove this player from your team before selling the last copy.");
return;
}
game.owned[id]--;
if(game.owned[id]<=0)delete game.owned[id];
let value=rarityPrice[c.rarity]||c.price||100;
game.coins+=value;
persistRender();
toast("Sold "+c.name+" for "+money(value)+" coins.");
}

render();
startMatchTimer();
</script>
</body>
</html>
